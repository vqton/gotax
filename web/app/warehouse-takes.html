<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm kê kho · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="takesPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Kiểm kê kho</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Tạo phiếu kiểm kê
        </button>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" x-model="search" placeholder="Tìm mã phiếu, kho..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách phiếu kiểm kê</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' phiếu'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã phiếu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày bắt đầu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày kết thúc</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="t in filtered" :key="t.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="t.code"></td>
                  <td class="px-5 py-3 text-gray-900" x-text="warehouseName(t.warehouse_id)"></td>
                  <td class="px-5 py-3" x-html="statusBadge(t.status || 'DRAFT')"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(t.start_date)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(t.end_date)"></td>
                  <td class="px-5 py-3 text-right space-x-3">
                    <template x-if="t.status === 'DRAFT'">
                      <button @click="startTake(t)" class="text-yellow-600 hover:text-yellow-800 text-xs font-medium">Bắt đầu</button>
                    </template>
                    <template x-if="t.status === 'IN_PROGRESS'">
                      <button @click="openComplete(t)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Hoàn thành</button>
                    </template>
                    <template x-if="t.status === 'COMPLETED'">
                      <span class="space-x-3">
                        <button @click="verifyTake(t)" class="text-green-600 hover:text-green-800 text-xs font-medium">Xác minh</button>
                        <button @click="postTake(t)" class="text-purple-600 hover:text-purple-800 text-xs font-medium">Hạch toán</button>
                      </span>
                    </template>
                    <template x-if="t.status === 'VERIFIED'">
                      <button @click="postTake(t)" class="text-purple-600 hover:text-purple-800 text-xs font-medium">Hạch toán</button>
                    </template>
                    <template x-if="t.status === 'POSTED'">
                      <span class="text-xs text-gray-400">—</span>
                    </template>
                    <template x-if="t.status === 'CANCELLED'">
                      <span class="text-xs text-gray-400">—</span>
                    </template>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="6" class="px-5 py-12 text-center text-gray-400">
                  <span class="text-3xl block mb-2">📋</span>
                  Không có phiếu kiểm kê nào
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Tạo phiếu kiểm kê mới</h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Kho <span class="text-red-500">*</span></label>
            <select x-model="form.warehouse_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">— Chọn kho —</option>
              <template x-for="wh in warehouses" :key="wh.id">
                <option :value="wh.id" x-text="wh.code + ' — ' + wh.name"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Ghi chú</label>
            <textarea x-model="form.notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Lý do kiểm kê, ghi chú..."></textarea>
          </div>

          <!-- Items -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-medium text-gray-500">Hàng hóa kiểm kê</label>
              <button @click="addItem()" type="button" class="text-xs text-blue-600 hover:text-blue-800 font-medium">+ Thêm hàng hóa</button>
            </div>
            <div class="space-y-2">
              <template x-for="(item, idx) in form.items" :key="idx">
                <div class="grid grid-cols-12 gap-2 items-end">
                  <div class="col-span-5">
                    <label class="block text-xs text-gray-400 mb-1" x-show="idx === 0">Mã hàng</label>
                    <select x-model="item.item_id" @change="loadExpected(item)" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                      <option value="">— Chọn hàng —</option>
                      <template x-for="it in availableItems(idx)" :key="it.id">
                        <option :value="it.id" x-text="it.code + ' — ' + it.name"></option>
                      </template>
                    </select>
                  </div>
                  <div class="col-span-3">
                    <label class="block text-xs text-gray-400 mb-1" x-show="idx === 0">SL sổ sách</label>
                    <input type="number" :value="item.expected_quantity" readonly class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-500" placeholder="—">
                  </div>
                  <div class="col-span-3">
                    <label class="block text-xs text-gray-400 mb-1" x-show="idx === 0">SL thực tế</label>
                    <input type="number" x-model.number="item.counted_quantity" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0">
                  </div>
                  <div class="col-span-1 flex justify-center">
                    <button @click="form.items.splice(idx, 1)" type="button" class="text-red-400 hover:text-red-600 mt-5">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                </div>
              </template>
              <p x-show="!form.items.length" class="text-xs text-gray-400 text-center py-3">Chưa có hàng hóa nào. Nhấn "Thêm hàng hóa" để bắt đầu.</p>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveTake()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving">Tạo phiếu</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Complete modal (enter count results) -->
  <template x-if="showCompleteModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCompleteModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Hoàn thành kiểm kê</h3>
          <button @click="showCompleteModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <p class="text-sm text-gray-600">Nhập số lượng thực tế kiểm kê cho phiếu <span class="font-medium" x-text="completingTake?.code"></span></p>
          <div class="space-y-2">
            <template x-for="(item, idx) in completeItems" :key="idx">
              <div class="grid grid-cols-12 gap-2 items-center">
                <div class="col-span-5">
                  <span class="text-sm text-gray-900" x-text="item.item_name || item.item_id"></span>
                </div>
                <div class="col-span-3 text-center">
                  <span class="text-sm text-gray-500" x-text="'SL sổ: ' + (item.expected_quantity ?? '—')"></span>
                </div>
                <div class="col-span-4">
                  <input type="number" x-model.number="item.counted_quantity" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="SL thực tế">
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showCompleteModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmComplete()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving">Hoàn thành</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

<script>
function takesPage() {
  return {
    search: "",
    showModal: false,
    showCompleteModal: false,
    saving: false,
    items: [],
    warehouses: [],
    allItems: [],
    completingTake: null,
    completeItems: [],
    form: { warehouse_id: "", notes: "", items: [] },

    get filtered() {
      const q = this.search.toLowerCase();
      if (!q) return this.items;
      return this.items.filter(t =>
        (t.code || "").toLowerCase().includes(q) ||
        this.warehouseName(t.warehouse_id).toLowerCase().includes(q)
      );
    },

    async init() {
      mountAppShell("Kiểm kê kho", "/app/warehouse-takes.html");
      try {
        const cid = App.companyId();
        const [takesRes, whRes, itRes] = await Promise.all([
          apiGet(`/warehouse/takes?company_id=${cid}`),
          apiGet(`/warehouse/warehouses?company_id=${cid}`),
          apiGet(`/warehouse/items?company_id=${cid}`)
        ]);
        this.items = Array.isArray(takesRes) ? takesRes : (takesRes?.data || []);
        this.warehouses = Array.isArray(whRes) ? whRes : (whRes?.data || []);
        this.allItems = Array.isArray(itRes) ? itRes : (itRes?.data || []);
      } catch (e) {
        console.error("takes init:", e);
        $store.app.flashError(e.error || "Không thể tải dữ liệu kiểm kê");
      }
    },

    warehouseName(id) {
      const wh = this.warehouses.find(w => w.id === id);
      return wh ? wh.code + " — " + wh.name : id || "—";
    },

    fmtDate(d) {
      if (!d) return "—";
      try { return new Date(d).toLocaleDateString("vi-VN"); } catch { return d; }
    },

    statusBadge(status) {
      const map = {
        DRAFT:        "bg-gray-100 text-gray-700",
        IN_PROGRESS:  "bg-yellow-100 text-yellow-800",
        COMPLETED:    "bg-blue-100 text-blue-700",
        VERIFIED:     "bg-green-100 text-green-700",
        POSTED:       "bg-emerald-100 text-emerald-800",
        CANCELLED:    "bg-red-100 text-red-700",
      };
      const labels = {
        DRAFT: "Nháp", IN_PROGRESS: "Đang kiểm kê", COMPLETED: "Hoàn thành",
        VERIFIED: "Đã xác minh", POSTED: "Đã hạch toán", CANCELLED: "Đã hủy",
      };
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${map[status] || map.DRAFT}">${labels[status] || status}</span>`;
    },

    availableItems(idx) {
      const used = this.form.items.map((it, i) => i === idx ? null : it.item_id).filter(Boolean);
      return this.allItems.filter(it => !used.includes(it.id));
    },

    openCreate() {
      this.form = { warehouse_id: "", notes: "", items: [] };
      this.showModal = true;
    },

    addItem() {
      this.form.items.push({ item_id: "", expected_quantity: null, counted_quantity: null });
    },

    async loadExpected(item) {
      if (!item.item_id || !this.form.warehouse_id) return;
      try {
        const cid = App.companyId();
        const res = await apiGet(`/warehouse/balance?company_id=${cid}&warehouse_id=${this.form.warehouse_id}&item_id=${item.item_id}`);
        const balance = res?.quantity ?? res?.balance ?? 0;
        item.expected_quantity = balance;
      } catch (e) {
        item.expected_quantity = 0;
      }
    },

    async saveTake() {
      if (!this.form.warehouse_id) {
        $store.app.flashError("Vui lòng chọn kho");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        await apiPost(`/warehouse/takes?company_id=${cid}`, this.form);
        $store.app.flashSuccess("Đã tạo phiếu kiểm kê");
        this.showModal = false;
        const res = await apiGet(`/warehouse/takes?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi tạo phiếu kiểm kê");
      } finally {
        this.saving = false;
      }
    },

    async startTake(t) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/takes/${t.id}/start?company_id=${cid}`);
        $store.app.flashSuccess("Đã bắt đầu kiểm kê");
        const res = await apiGet(`/warehouse/takes?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể bắt đầu kiểm kê");
      }
    },

    async openComplete(t) {
      this.completingTake = t;
      this.completeItems = (t.items || []).map(it => ({
        item_id: it.item_id,
        item_name: it.item_name || it.item_id,
        expected_quantity: it.expected_quantity,
        counted_quantity: it.counted_quantity ?? it.expected_quantity
      }));
      this.showCompleteModal = true;
    },

    async confirmComplete() {
      this.saving = true;
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/takes/${this.completingTake.id}/complete?company_id=${cid}`, {
          items: this.completeItems
        });
        $store.app.flashSuccess("Đã hoàn thành kiểm kê");
        this.showCompleteModal = false;
        const res = await apiGet(`/warehouse/takes?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể hoàn thành kiểm kê");
      } finally {
        this.saving = false;
      }
    },

    async verifyTake(t) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/takes/${t.id}/verify?company_id=${cid}`);
        $store.app.flashSuccess("Đã xác minh kiểm kê");
        const res = await apiGet(`/warehouse/takes?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể xác minh kiểm kê");
      }
    },

    async postTake(t) {
      if (!confirm("Hạch toán phiếu kiểm kê sẽ tạo bút toán GL. Tiếp tục?")) return;
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/takes/${t.id}/post?company_id=${cid}`);
        $store.app.flashSuccess("Đã hạch toán kiểm kê");
        const res = await apiGet(`/warehouse/takes?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể hạch toán kiểm kê");
      }
    },
  };
}
</script>

</body>
</html>
