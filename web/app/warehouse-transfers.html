<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển kho · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="transfersPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Chuyển kho</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Lập phiếu chuyển
        </button>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" x-model="search" placeholder="Tìm mã phiếu..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách phiếu chuyển kho</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' phiếu'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã phiếu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho nguồn</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho đích</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày tạo</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="t in filtered" :key="t.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="t.code || t.transfer_number"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="t.from_warehouse_name || t.from_warehouse_id || '—'"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="t.to_warehouse_name || t.to_warehouse_id || '—'"></td>
                  <td class="px-5 py-3" x-html="transferStatusBadge(t.status)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(t.created_at)"></td>
                  <td class="px-5 py-3 text-right space-x-2" x-html="workflowButtons(t)"></td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="6" class="px-5 py-12 text-center text-gray-400">
                  <span class="text-3xl block mb-2">📦</span>
                  Chưa có phiếu chuyển kho
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Phiếu chuyển kho mới</h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Kho nguồn <span class="text-red-500">*</span></label>
              <select x-model="form.from_warehouse_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Chọn kho nguồn</option>
                <template x-for="wh in warehouses" :key="wh.id">
                  <option :value="wh.id" x-text="wh.name || wh.code"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Kho đích <span class="text-red-500">*</span></label>
              <select x-model="form.to_warehouse_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Chọn kho đích</option>
                <template x-for="wh in warehouses" :key="wh.id">
                  <option :value="wh.id" x-text="wh.name || wh.code"></option>
                </template>
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Ghi chú</label>
              <textarea x-model="form.notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Lý do chuyển kho, ghi chú..."></textarea>
            </div>
          </div>

          <!-- Items -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700">Danh sách mặt hàng</label>
              <button @click="addItem()" class="text-sm text-blue-700 hover:underline font-medium">+ Thêm dòng</button>
            </div>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-200">
                  <tr>
                    <th class="text-left px-4 py-2 font-semibold text-gray-600">Mặt hàng</th>
                    <th class="text-left px-4 py-2 font-semibold text-gray-600 w-32">Số lượng</th>
                    <th class="px-4 py-2 w-10"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(item, idx) in form.items" :key="idx">
                    <tr class="border-b border-gray-100">
                      <td class="px-4 py-2">
                        <select x-model="item.item_id" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                          <option value="">Chọn mặt hàng</option>
                          <template x-for="it in items" :key="it.id">
                            <option :value="it.id" x-text="it.name || it.code"></option>
                          </template>
                        </select>
                      </td>
                      <td class="px-4 py-2">
                        <input type="number" x-model.number="item.quantity" min="1" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0">
                      </td>
                      <td class="px-4 py-2 text-center">
                        <button @click="form.items.splice(idx, 1)" class="text-red-400 hover:text-red-600" x-show="form.items.length > 1">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <p x-show="!form.items.length || (form.items.length === 1 && !form.items[0].item_id)" class="text-xs text-gray-400 mt-1">Thêm ít nhất một mặt hàng</p>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="createTransfer()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving">Tạo phiếu</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Reject confirmation modal -->
  <template x-if="rejectingId">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="rejectingId=null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Từ chối phiếu</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn từ chối phiếu chuyển kho này?</p>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Lý do từ chối</label>
          <textarea x-model="rejectReason" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Nhập lý do..."></textarea>
        </div>
        <div class="flex justify-end gap-3 mt-4">
          <button @click="rejectingId=null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmReject()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Từ chối</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Cancel confirmation modal -->
  <template x-if="cancellingId">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="cancellingId=null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Hủy phiếu</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn hủy phiếu chuyển kho này? Hành động này không thể hoàn tác.</p>
        <div class="flex justify-end gap-3">
          <button @click="cancellingId=null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Không</button>
          <button @click="confirmCancel()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Hủy phiếu</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Detail modal -->
  <template x-if="viewing">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="viewing=null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Chi tiết phiếu chuyển kho</h3>
          <button @click="viewing=null" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div class="grid grid-cols-2 gap-4 text-sm">
            <div><span class="text-gray-500">Mã phiếu:</span> <span class="font-medium" x-text="viewing.code || viewing.transfer_number"></span></div>
            <div><span class="text-gray-500">Trạng thái:</span> <span x-html="transferStatusBadge(viewing.status)"></span></div>
            <div><span class="text-gray-500">Kho nguồn:</span> <span class="font-medium" x-text="viewing.from_warehouse_name || viewing.from_warehouse_id || '—'"></span></div>
            <div><span class="text-gray-500">Kho đích:</span> <span class="font-medium" x-text="viewing.to_warehouse_name || viewing.to_warehouse_id || '—'"></span></div>
            <div class="col-span-2"><span class="text-gray-500">Ghi chú:</span> <span class="font-medium" x-text="viewing.notes || '—'"></span></div>
            <div><span class="text-gray-500">Ngày tạo:</span> <span class="font-medium" x-text="fmtDate(viewing.created_at)"></span></div>
          </div>
          <div x-show="viewing.items && viewing.items.length">
            <h4 class="text-sm font-medium text-gray-700 mb-2">Chi tiết mặt hàng</h4>
            <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="text-left px-4 py-2 font-semibold text-gray-600">Mặt hàng</th>
                  <th class="text-right px-4 py-2 font-semibold text-gray-600">Số lượng</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(item, idx) in viewing.items" :key="idx">
                  <tr class="border-b border-gray-100">
                    <td class="px-4 py-2 text-gray-700" x-text="item.item_name || item.item_id || '—'"></td>
                    <td class="px-4 py-2 text-right font-medium" x-text="item.quantity"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <div class="flex justify-end px-6 py-4 border-t border-gray-200">
          <button @click="viewing=null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Đóng</button>
        </div>
      </div>
    </div>
  </template>

<script>
function transfersPage() {
  return {
    search: "",
    showModal: false,
    viewing: null,
    saving: false,
    rejectingId: null,
    rejectReason: "",
    cancellingId: null,
    transfers: [],
    warehouses: [],
    items: [],
    form: {
      from_warehouse_id: "",
      to_warehouse_id: "",
      notes: "",
      items: [{ item_id: "", quantity: 1 }],
    },

    get filtered() {
      const q = this.search.toLowerCase();
      if (!q) return this.transfers;
      return this.transfers.filter(t =>
        (t.code || t.transfer_number || "").toLowerCase().includes(q)
      );
    },

    async init() {
      mountAppShell("Chuyển kho", "/app/warehouse-transfers.html");
      await this.loadTransfers();
      await this.loadWarehouses();
      await this.loadItems();
    },

    async loadTransfers() {
      try {
        const cid = App.companyId();
        const res = await apiGet(`/warehouse/transfers?company_id=${cid}`);
        this.transfers = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("transfers init:", e);
        $store.app.flashError(e.error || "Không thể tải danh sách phiếu chuyển kho");
      }
    },

    async loadWarehouses() {
      try {
        const cid = App.companyId();
        const res = await apiGet(`/warehouse/warehouses?company_id=${cid}`);
        this.warehouses = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("load warehouses:", e);
      }
    },

    async loadItems() {
      try {
        const cid = App.companyId();
        const res = await apiGet(`/warehouse/items?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("load items:", e);
      }
    },

    openCreate() {
      this.form = {
        from_warehouse_id: "",
        to_warehouse_id: "",
        notes: "",
        items: [{ item_id: "", quantity: 1 }],
      };
      this.showModal = true;
    },

    addItem() {
      this.form.items.push({ item_id: "", quantity: 1 });
    },

    async createTransfer() {
      if (!this.form.from_warehouse_id || !this.form.to_warehouse_id) {
        $store.app.flashError("Vui lòng chọn kho nguồn và kho đích");
        return;
      }
      if (this.form.from_warehouse_id === this.form.to_warehouse_id) {
        $store.app.flashError("Kho nguồn và kho đích phải khác nhau");
        return;
      }
      const validItems = this.form.items.filter(i => i.item_id && i.quantity > 0);
      if (!validItems.length) {
        $store.app.flashError("Vui lòng thêm ít nhất một mặt hàng hợp lệ");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        const body = { ...this.form, items: validItems };
        await apiPost(`/warehouse/transfers?company_id=${cid}`, body);
        this.showModal = false;
        await this.loadTransfers();
        $store.app.flashSuccess("Tạo phiếu chuyển kho thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được phiếu");
      } finally {
        this.saving = false;
      }
    },

    async submitTransfer(id) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${id}/submit?company_id=${cid}`);
        await this.loadTransfers();
        $store.app.flashSuccess("Đã gửi phiếu chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể gửi phiếu");
      }
    },

    openReject(id) {
      this.rejectingId = id;
      this.rejectReason = "";
    },

    async confirmReject() {
      if (!this.rejectingId) return;
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${this.rejectingId}/reject?company_id=${cid}`, { reason: this.rejectReason });
        this.rejectingId = null;
        this.rejectReason = "";
        await this.loadTransfers();
        $store.app.flashSuccess("Đã từ chối phiếu chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể từ chối phiếu");
      }
    },

    async approveTransfer(id) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${id}/approve?company_id=${cid}`);
        await this.loadTransfers();
        $store.app.flashSuccess("Đã duyệt phiếu chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể duyệt phiếu");
      }
    },

    async markInTransit(id) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${id}/transfer?company_id=${cid}`);
        await this.loadTransfers();
        $store.app.flashSuccess("Đang trong quá trình chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể cập nhật trạng thái");
      }
    },

    async completeTransfer(id) {
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${id}/complete?company_id=${cid}`);
        await this.loadTransfers();
        $store.app.flashSuccess("Đã hoàn tất chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể hoàn tất phiếu");
      }
    },

    openCancel(id) {
      this.cancellingId = id;
    },

    async confirmCancel() {
      if (!this.cancellingId) return;
      try {
        const cid = App.companyId();
        await apiPatch(`/warehouse/transfers/${this.cancellingId}/cancel?company_id=${cid}`);
        this.cancellingId = null;
        await this.loadTransfers();
        $store.app.flashSuccess("Đã hủy phiếu chuyển kho");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể hủy phiếu");
      }
    },

    viewDetail(t) {
      this.viewing = t;
    },

    transferStatusBadge(status) {
      const map = {
        DRAFT:      'bg-gray-100 text-gray-700',
        SUBMITTED:  'bg-yellow-100 text-yellow-700',
        APPROVED:   'bg-blue-100 text-blue-700',
        IN_TRANSIT: 'bg-purple-100 text-purple-700',
        COMPLETED:  'bg-green-100 text-green-700',
        CANCELLED:  'bg-red-100 text-red-700',
        REJECTED:   'bg-red-100 text-red-700',
      };
      const label = {
        DRAFT: 'Nháp',
        SUBMITTED: 'Đã gửi',
        APPROVED: 'Đã duyệt',
        IN_TRANSIT: 'Đang chuyển',
        COMPLETED: 'Hoàn tất',
        CANCELLED: 'Đã hủy',
        REJECTED: 'Từ chối',
      };
      const cls = map[status] || 'bg-gray-100 text-gray-700';
      const txt = label[status] || status;
      return `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}">${txt}</span>`;
    },

    workflowButtons(t) {
      const s = t.status;
      const id = t.id;
      let btns = '';

      btns += `<button onclick="document.querySelector('[x-data]').__x.$data.viewDetail(document.querySelector('[x-data]').__x.$data.transfers.find(x=>x.id==='${id}'))" class="text-blue-600 hover:text-blue-800 text-xs font-medium" title="Xem">Xem</button> `;

      if (s === 'DRAFT') {
        btns += `<button class="text-green-600 hover:text-green-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.submitTransfer('${id}')" title="Gửi">Gửi</button> `;
        btns += `<button class="text-red-600 hover:text-red-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.openCancel('${id}')" title="Hủy">Hủy</button>`;
      } else if (s === 'SUBMITTED') {
        btns += `<button class="text-blue-600 hover:text-blue-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.approveTransfer('${id}')" title="Duyệt">Duyệt</button> `;
        btns += `<button class="text-red-600 hover:text-red-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.openReject('${id}')" title="Từ chối">Từ chối</button>`;
      } else if (s === 'APPROVED') {
        btns += `<button class="text-purple-600 hover:text-purple-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.markInTransit('${id}')" title="Chuyển đi">Chuyển đi</button>`;
      } else if (s === 'IN_TRANSIT') {
        btns += `<button class="text-green-600 hover:text-green-800 text-xs font-medium" onclick="document.querySelector('[x-data]').__x.$data.completeTransfer('${id}')" title="Hoàn tất">Hoàn tất</button>`;
      }

      return btns;
    },
  };
}
</script>

</body>
</html>
