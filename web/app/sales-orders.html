<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng bán · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Đơn hàng bán</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Tạo SO</button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số SO</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Khách hàng</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng tiền</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in items" :key="item.id">
              <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-5 py-3 font-medium text-blue-700" x-text="item.order_number"></td>
                <td class="px-5 py-3 text-gray-500" x-text="fmtDate(item.order_date)"></td>
                <td class="px-5 py-3 text-gray-700" x-text="item.customer_name"></td>
                <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(item.total_amount)"></td>
                <td class="px-5 py-3" x-html="statusBadge(item.status)"></td>
              </tr>
            </template>
            <tr x-show="!items.length && !loading">
              <td colspan="5" class="px-5 py-8 text-center text-gray-400">Chưa có đơn hàng bán nào</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6" @click.stop>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Tạo đơn hàng bán</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số SO</label>
                <input type="text" x-model="form.order_number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tự động">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày đặt</label>
                <input type="date" x-model="form.order_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Khách hàng</label>
                <input type="text" x-model="form.customer_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày giao hàng dự kiến</label>
                <input type="date" x-model="form.delivery_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Điều kiện thanh toán</label>
                <input type="text" x-model="form.payment_terms" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Diễn giải</label>
                <input type="text" x-model="form.description" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createItem()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="saving">
                <span x-show="!saving">Tạo</span>
                <span x-show="saving">Đang lưu...</span>
              </button>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

<script>
function comp() {
  return {
    items: [],
    loading: true,
    showCreate: false,
    saving: false,
    form: { order_number: "", order_date: "", customer_name: "", delivery_date: "", payment_terms: "", description: "" },

    async init() {
      mountAppShell("Đơn hàng bán", "/app/sales-orders.html");
      await this.loadItems();
    },

    async loadItems() {
      this.loading = true;
      try {
        const cid = App.companyId();
        const data = await apiGet(`/sale/orders?company_id=${cid}`);
        this.items = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách");
      }
      this.loading = false;
    },

    async createItem() {
      this.saving = true;
      try {
        const cid = App.companyId();
        const body = { ...this.form, company_id: cid };
        await apiPost(`/sale/orders?company_id=${cid}`, body);
        this.showCreate = false;
        this.form = { order_number: "", order_date: "", customer_name: "", delivery_date: "", payment_terms: "", description: "" };
        await this.loadItems();
        $store.app.flashSuccess("Tạo SO thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được SO");
      }
      this.saving = false;
    },
  };
}
</script>

</body>
</html>
