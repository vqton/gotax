<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tồn kho · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="balancesPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Tồn kho</h2>
        <button class="px-4 py-2 bg-gray-200 text-gray-500 rounded-lg text-sm font-medium cursor-not-allowed transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Xuất Excel
        </button>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" x-model="search" placeholder="Tìm mã hàng, tên hàng..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách tồn kho</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' dòng'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số lượng tồn</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Đơn giá</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng giá trị</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="b in filtered" :key="b.item_id + '-' + b.warehouse_id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="b.item_code"></td>
                  <td class="px-5 py-3 text-gray-900" x-text="b.item_name"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="b.warehouse_name"></td>
                  <td class="px-5 py-3 text-right font-mono" x-text="formatNum(b.quantity)"></td>
                  <td class="px-5 py-3 text-right font-mono" x-text="formatMoney(b.unit_cost)"></td>
                  <td class="px-5 py-3 text-right font-mono font-medium text-gray-900" x-text="formatMoney(b.total_value)"></td>
                </tr>
              </template>
              <!-- Summary row -->
              <template x-if="filtered.length">
                <tr class="bg-gray-50 border-t-2 border-gray-200 font-semibold">
                  <td colspan="3" class="px-5 py-3 text-gray-700">Tổng cộng</td>
                  <td class="px-5 py-3 text-right font-mono" x-text="formatNum(totalQty)"></td>
                  <td class="px-5 py-3 text-right"></td>
                  <td class="px-5 py-3 text-right font-mono text-gray-900" x-text="formatMoney(totalValue)"></td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="6" class="px-5 py-12 text-center text-gray-400">
                  <span class="text-3xl block mb-2">📦</span>
                  Không có dữ liệu tồn kho
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function balancesPage() {
  return {
    search: "",
    items: [],

    get filtered() {
      const q = this.search.toLowerCase();
      if (!q) return this.items;
      return this.items.filter(b =>
        b.item_code.toLowerCase().includes(q) || b.item_name.toLowerCase().includes(q)
      );
    },

    get totalQty() {
      return this.filtered.reduce((s, b) => s + (b.quantity || 0), 0);
    },

    get totalValue() {
      return this.filtered.reduce((s, b) => s + (b.total_value || 0), 0);
    },

    async init() {
      mountAppShell("Tồn kho", "/app/warehouse-balances.html");
      try {
        const cid = App.companyId();
        const res = await apiGet(`/warehouse/balances?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("balances init:", e);
        $store.app.flashError(e.error || "Không thể tải dữ liệu tồn kho");
      }
    },

    formatNum(v) {
      return new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 2 }).format(v || 0);
    },

    formatMoney(v) {
      return new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND", maximumFractionDigits: 0 }).format(v || 0);
    },
  };
}
</script>

</body>
</html>
