<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Người dùng · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="usersPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Quản lý người dùng</h2>
        <button @click="showCreateModal = true"
          class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm người dùng
        </button>
      </div>

      <!-- User table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <!-- Loading -->
        <template x-if="loading">
          <div class="p-6">
            <div class="space-y-3">
              <div class="h-4 bg-gray-100 rounded animate-pulse"></div>
              <div class="h-4 bg-gray-100 rounded animate-pulse w-5/6"></div>
              <div class="h-4 bg-gray-100 rounded animate-pulse w-4/6"></div>
              <div class="h-4 bg-gray-100 rounded animate-pulse w-3/4"></div>
            </div>
          </div>
        </template>

        <!-- Table -->
        <template x-if="!loading">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="text-left px-5 py-3 font-semibold text-gray-600">Tên đăng nhập</th>
                  <th class="text-left px-5 py-3 font-semibold text-gray-600">Email</th>
                  <th class="text-left px-5 py-3 font-semibold text-gray-600">Vai trò</th>
                  <th class="text-left px-5 py-3 font-semibold text-gray-600">Trạng thái</th>
                  <th class="text-left px-5 py-3 font-semibold text-gray-600">Lần đăng nhập cuối</th>
                  <th class="text-right px-5 py-3 font-semibold text-gray-600">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="u in users" :key="u.id">
                  <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="px-5 py-3">
                      <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-xs font-semibold text-blue-700" x-text="(u.username||'U')[0].toUpperCase()"></div>
                        <span class="font-medium text-gray-900" x-text="u.username"></span>
                      </div>
                    </td>
                    <td class="px-5 py-3 text-gray-600" x-text="u.email || '—'"></td>
                    <td class="px-5 py-3">
                      <select :value="u.role" @change="updateRole(u, $event.target.value)"
                        class="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="admin">admin</option>
                        <option value="chief_accountant">chief_accountant</option>
                        <option value="accountant">accountant</option>
                        <option value="viewer">viewer</option>
                      </select>
                    </td>
                    <td class="px-5 py-3">
                      <span class="inline-flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full" :class="u.is_active !== false ? 'bg-green-500' : 'bg-red-500'"></span>
                        <span class="text-xs" :class="u.is_active !== false ? 'text-green-700' : 'text-red-700'" x-text="u.is_active !== false ? 'Hoạt động' : 'Khóa'"></span>
                      </span>
                    </td>
                    <td class="px-5 py-3 text-gray-500 text-xs" x-text="u.last_login ? fmtDateTime(u.last_login) : '—'"></td>
                    <td class="px-5 py-3 text-right">
                      <button @click="editUser(u)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Sửa</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="!users.length">
                  <td colspan="6" class="px-5 py-12 text-center text-gray-400">
                    <span class="text-3xl block mb-2">👥</span>
                    Chưa có người dùng nào
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- Create user modal -->
  <template x-if="showCreateModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreateModal = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Thêm người dùng mới</h3>
          <button @click="showCreateModal = false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tên đăng nhập <span class="text-red-500">*</span></label>
            <input type="text" x-model="createForm.username" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="username">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Email <span class="text-red-500">*</span></label>
            <input type="email" x-model="createForm.email" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="user@company.vn">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Mật khẩu <span class="text-red-500">*</span></label>
            <input type="password" x-model="createForm.password" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tối thiểu 8 ký tự">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Vai trò</label>
            <select x-model="createForm.role" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="viewer">Viewer — Chỉ xem</option>
              <option value="accountant">Accountant — Kế toán viên</option>
              <option value="chief_accountant">Chief Accountant — Kế toán trưởng</option>
              <option value="admin">Admin — Quản trị viên</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showCreateModal = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="createUser()" :disabled="creating"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!creating">Tạo người dùng</span>
            <span x-show="creating">Đang tạo...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Edit role modal -->
  <template x-if="showEditModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showEditModal = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Sửa vai trò</h3>
          <button @click="showEditModal = false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4">
          <p class="text-sm text-gray-600 mb-3">Người dùng: <span class="font-medium" x-text="editingUser?.username"></span></p>
          <label class="block text-xs font-medium text-gray-500 mb-1">Vai trò mới</label>
          <select x-model="editRole" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="admin">Admin — Quản trị viên</option>
            <option value="chief_accountant">Chief Accountant — Kế toán trưởng</option>
            <option value="accountant">Accountant — Kế toán viên</option>
            <option value="viewer">Viewer — Chỉ xem</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showEditModal = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveRole()" :disabled="savingRole"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            Lưu
          </button>
        </div>
      </div>
    </div>
  </template>

<script>
const ROLE_LABELS = {
  admin: "Admin",
  chief_accountant: "Kế toán trưởng",
  accountant: "Kế toán viên",
  viewer: "Viewer",
};

function usersPage() {
  return {
    loading: true,
    users: [],
    showCreateModal: false,
    showEditModal: false,
    creating: false,
    savingRole: false,
    editingUser: null,
    editRole: "",
    createForm: {
      username: "",
      email: "",
      password: "",
      role: "accountant",
    },

    async init() {
      mountAppShell("Người dùng", "/app/users.html");
      await this.loadUsers();
    },

    async loadUsers() {
      this.loading = true;
      try {
        const res = await apiGet("/users");
        this.users = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể tải danh sách người dùng");
      } finally {
        this.loading = false;
      }
    },

    editUser(u) {
      this.editingUser = u;
      this.editRole = u.role || "accountant";
      this.showEditModal = true;
    },

    async saveRole() {
      if (!this.editingUser) return;
      this.savingRole = true;
      try {
        await apiPut(`/users/${this.editingUser.id}/role`, { role: this.editRole });
        this.editingUser.role = this.editRole;
        this.showEditModal = false;
        $store.app.flashSuccess("Đã cập nhật vai trò");
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi cập nhật vai trò");
      } finally {
        this.savingRole = false;
      }
    },

    async createUser() {
      if (!this.createForm.username || !this.createForm.email || !this.createForm.password) {
        $store.app.flashError("Vui lòng điền đầy đủ thông tin");
        return;
      }
      this.creating = true;
      try {
        const created = await apiPost("/users", this.createForm);
        this.users.unshift(created);
        this.showCreateModal = false;
        this.createForm = { username: "", email: "", password: "", role: "accountant" };
        $store.app.flashSuccess("Đã tạo người dùng thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi tạo người dùng");
      } finally {
        this.creating = false;
      }
    },
  };
}
</script>

</body>
</html>
