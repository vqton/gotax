<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tùy chọn báo cáo · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Tùy chọn báo cáo</h2>
        <button @click="save()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="saving">
          <span x-show="!saving">Lưu</span>
          <span x-show="saving">Đang lưu...</span>
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Company Info -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h3 class="text-sm font-semibold text-gray-700 mb-4">Thông tin công ty trên báo cáo</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tên công ty</label>
              <input type="text" x-model="opts.company_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Công ty TNHH ABC">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Địa chỉ</label>
              <input type="text" x-model="opts.company_address" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="123 Đường ABC, Hà Nội">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Mã số thuế</label>
                <input type="text" x-model="opts.company_tax_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0123456789">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Điện thoại</label>
                <input type="text" x-model="opts.company_phone" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="024 1234 5678">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Email</label>
                <input type="email" x-model="opts.company_email" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="info@abc.com">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Website</label>
                <input type="text" x-model="opts.company_website" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="abc.com">
              </div>
            </div>
          </div>
        </div>

        <!-- Report Format -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h3 class="text-sm font-semibold text-gray-700 mb-4">Định dạng báo cáo</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Phông chữ</label>
              <select x-model="opts.report_font_family" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Cỡ chữ</label>
              <select x-model="opts.report_font_size" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Căn lề thông tin công ty</label>
              <select x-model="opts.alignment" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="left">Trái</option>
                <option value="center">Giữa</option>
                <option value="right">Phải</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Lặp lại ở mỗi trang</label>
              <select x-model="opts.repeat_on_each_page" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="false">Không</option>
                <option value="true">Có</option>
              </select>
            </div>
          </div>

          <!-- Preview -->
          <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <p class="text-xs text-gray-500 mb-2">Xem trước:</p>
            <div class="text-sm" :class="{ 'text-center': opts.alignment === 'center', 'text-right': opts.alignment === 'right', 'text-left': opts.alignment !== 'center' && opts.alignment !== 'right' }" :style="'font-family: ' + opts.report_font_family + '; font-size: ' + opts.report_font_size + 'px'">
              <p class="font-bold" x-text="opts.company_name || 'Tên công ty'"></p>
              <p class="text-gray-600" x-text="opts.company_address || 'Địa chỉ'"></p>
              <p class="text-gray-600" x-text="'MST: ' + (opts.company_tax_code || '0000000000')"></p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    saving: false,
    opts: {
      company_name: '',
      company_address: '',
      company_tax_code: '',
      company_phone: '',
      company_email: '',
      company_website: '',
      report_font_family: 'Arial',
      report_font_size: '10',
      alignment: 'left',
      repeat_on_each_page: 'false',
    },

    async init() {
      mountAppShell("Tùy chọn báo cáo", "/app/report-options.html");
      await this.load();
    },

    async load() {
      try {
        const data = await apiGet("/report-options");
        if (data && typeof data === 'object') {
          Object.keys(this.opts).forEach(key => {
            if (data[key] !== undefined && data[key] !== null) {
              this.opts[key] = String(data[key]);
            }
          });
        }
      } catch (e) {
        // Options may not exist yet
      }
    },

    async save() {
      this.saving = true;
      try {
        await apiPut("/report-options", this.opts);
        $store.app.flashSuccess("Đã lưu tùy chọn báo cáo");
      } catch (e) {
        $store.app.flashError(e.error || "Không lưu được tùy chọn");
      }
      this.saving = false;
    },
  };
}
</script>

</body>
</html>
