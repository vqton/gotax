<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template bút toán định kỳ · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="recurringPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Bút toán định kỳ</h2>
        <div class="flex items-center gap-3">
          <button @click="processDue()" :disabled="processing"
            class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 disabled:opacity-50 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span x-show="!processing">Chạy định kỳ đến hạn</span>
            <span x-show="processing">Đang xử lý...</span>
          </button>
          <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Thêm template
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" x-model="search" placeholder="Tìm tên template..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách template</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' template'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên template</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tần suất</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày chạy tiếp</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kích hoạt</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in filtered" :key="r.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3">
                    <div class="font-medium text-gray-900" x-text="r.template_name"></div>
                    <div class="text-xs text-gray-400 mt-0.5" x-text="r.description || '—'"></div>
                  </td>
                  <td class="px-5 py-3" x-html="frequencyBadge(r.frequency)"></td>
                  <td class="px-5 py-3 text-gray-600" x-text="r.next_run_date || '—'"></td>
                  <td class="px-5 py-3" x-html="activeBadge(r.is_active)"></td>
                  <td class="px-5 py-3 text-right space-x-3">
                    <button @click="openEdit(r)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Sửa</button>
                    <button @click="runNow(r)" class="text-emerald-600 hover:text-emerald-800 text-xs font-medium" title="Chạy ngay">
                      <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </button>
                    <button @click="deleteItem(r)" class="text-red-600 hover:text-red-800 text-xs font-medium">Xóa</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="5" class="px-5 py-12 text-center text-gray-400">
                  <span class="text-3xl block mb-2">🔄</span>
                  Chưa có template bút toán định kỳ
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 overflow-y-auto py-8" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900" x-text="editing ? 'Sửa template' : 'Thêm template mới'"></h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4 max-h-[70vh] overflow-y-auto">
          <!-- Basic info -->
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Tên template <span class="text-red-500">*</span></label>
              <input type="text" x-model="form.template_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Thuê mặt bằng hàng tháng...">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tần suất <span class="text-red-500">*</span></label>
              <select x-model="form.frequency" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="MONTHLY">Hàng tháng</option>
                <option value="QUARTERLY">Hàng quý</option>
                <option value="YEARLY">Hàng năm</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ngày trong tháng (1–28)</label>
              <input type="number" x-model.number="form.day_of_month" min="1" max="28" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="1">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ngày chạy tiếp</label>
              <input type="date" x-model="form.next_run_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ngày kết thúc (tùy chọn)</label>
              <input type="date" x-model="form.end_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div class="col-span-2 flex items-center gap-2">
              <input type="checkbox" x-model="form.is_active" id="is_active" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
              <label for="is_active" class="text-sm text-gray-700">Kích hoạt</label>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Mô tả</label>
              <textarea x-model="form.description" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Mô tả模板..."></textarea>
            </div>
          </div>

          <!-- Lines -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-medium text-gray-500">Hạch toán</label>
              <div class="flex items-center gap-3">
                <span class="text-xs" :class="balanceDelta === 0 ? 'text-emerald-600 font-medium' : 'text-red-600'"
                  x-text="'Nợ: ' + formatNum(totalDebit) + ' · Có: ' + formatNum(totalCredit) + (balanceDelta === 0 ? ' ✓' : ' (chênh lệch ' + formatNum(Math.abs(balanceDelta)) + ')')">
                </span>
                <button @click="addLine()" type="button" class="px-3 py-1 bg-blue-50 text-blue-700 rounded text-xs font-medium hover:bg-blue-100 transition">+ Thêm dòng</button>
              </div>
            </div>
            <div class="space-y-2">
              <template x-for="(line, idx) in form.lines" :key="idx">
                <div class="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">
                  <input type="text" x-model="line.account_code" placeholder="Mã TK" class="w-24 border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="line.debit_amount" min="0" step="0.01" placeholder="Nợ" class="w-28 border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="line.credit_amount" min="0" step="0.01" placeholder="Có" class="w-28 border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="text" x-model="line.description" placeholder="Diễn giải" class="flex-1 border border-gray-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <button @click="removeLine(idx)" type="button" class="text-red-400 hover:text-red-600 p-1" title="Xóa dòng">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              </template>
              <div x-show="!form.lines.length" class="text-center py-4 text-gray-400 text-xs">
                Chưa có dòng hạch toán. Nhấn "+ Thêm dòng" để bắt đầu.
              </div>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveItem()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving" x-text="editing ? 'Cập nhật' : 'Thêm mới'"></span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Delete confirmation -->
  <template x-if="showDeleteConfirm">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showDeleteConfirm=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Xác nhận xóa</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn xóa template <span class="font-medium" x-text="deletingItem?.template_name"></span>?</p>
        <div class="flex justify-end gap-3">
          <button @click="showDeleteConfirm=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmDelete()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Xóa</button>
        </div>
      </div>
    </div>
  </template>

<script>
function recurringPage() {
  return {
    search: "",
    showModal: false,
    showDeleteConfirm: false,
    editing: false,
    saving: false,
    processing: false,
    deletingItem: null,
    items: [],
    form: {
      template_name: "",
      frequency: "MONTHLY",
      day_of_month: 1,
      next_run_date: "",
      end_date: "",
      is_active: true,
      description: "",
      lines: []
    },

    get filtered() {
      const q = this.search.toLowerCase();
      if (!q) return this.items;
      return this.items.filter(r =>
        (r.template_name || "").toLowerCase().includes(q)
      );
    },

    get totalDebit() {
      return this.form.lines.reduce((s, l) => s + (Number(l.debit_amount) || 0), 0);
    },

    get totalCredit() {
      return this.form.lines.reduce((s, l) => s + (Number(l.credit_amount) || 0), 0);
    },

    get balanceDelta() {
      return this.totalDebit - this.totalCredit;
    },

    formatNum(n) {
      return Number(n || 0).toLocaleString("vi-VN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    },

    frequencyBadge(f) {
      const map = {
        MONTHLY: '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">Hàng tháng</span>',
        QUARTERLY: '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-700">Hàng quý</span>',
        YEARLY: '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">Hàng năm</span>',
      };
      return map[f] || '<span class="text-gray-400 text-xs">' + (f || '—') + '</span>';
    },

    activeBadge(isActive) {
      if (isActive) return '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">Đang chạy</span>';
      return '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500">Tạm dừng</span>';
    },

    emptyForm() {
      return {
        template_name: "",
        frequency: "MONTHLY",
        day_of_month: 1,
        next_run_date: "",
        end_date: "",
        is_active: true,
        description: "",
        lines: [{ account_code: "", debit_amount: 0, credit_amount: 0, description: "" }]
      };
    },

    addLine() {
      this.form.lines.push({ account_code: "", debit_amount: 0, credit_amount: 0, description: "" });
    },

    removeLine(idx) {
      this.form.lines.splice(idx, 1);
    },

    async init() {
      mountAppShell("Bút toán định kỳ", "/app/recurring-entries.html");
      try {
        const cid = App.companyId();
        const res = await apiGet(`/recurring-entries?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("recurring-entries init:", e);
        $store.app.flashError(e.error || "Không thể tải danh sách template");
      }
    },

    openCreate() {
      this.editing = false;
      this.form = this.emptyForm();
      this.showModal = true;
    },

    async openEdit(r) {
      this.editing = true;
      try {
        const cid = App.companyId();
        const detail = await apiGet(`/recurring-entries/${r.id}?company_id=${cid}`);
        this.form = {
          template_name: detail.template_name || "",
          frequency: detail.frequency || "MONTHLY",
          day_of_month: detail.day_of_month || 1,
          next_run_date: detail.next_run_date || "",
          end_date: detail.end_date || "",
          is_active: !!detail.is_active,
          description: detail.description || "",
          lines: (detail.lines || []).map(l => ({
            account_code: l.account_code || "",
            debit_amount: l.debit_amount || 0,
            credit_amount: l.credit_amount || 0,
            description: l.description || ""
          }))
        };
        if (!this.form.lines.length) this.form.lines = [{ account_code: "", debit_amount: 0, credit_amount: 0, description: "" }];
        this._editId = r.id;
        this.showModal = true;
      } catch (e) {
        $store.app.flashError(e.error || "Không thể tải chi tiết template");
      }
    },

    async saveItem() {
      if (!this.form.template_name) {
        $store.app.flashError("Vui lòng nhập tên template");
        return;
      }
      if (!this.form.lines.length) {
        $store.app.flashError("Cần ít nhất một dòng hạch toán");
        return;
      }
      if (this.balanceDelta !== 0) {
        $store.app.flashError("Tổng nợ phải bằng tổng có");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        const payload = { ...this.form };
        if (this.editing) {
          await apiPut(`/recurring-entries/${this._editId}?company_id=${cid}`, payload);
          $store.app.flashSuccess("Đã cập nhật template");
        } else {
          await apiPost(`/recurring-entries?company_id=${cid}`, payload);
          $store.app.flashSuccess("Đã thêm template mới");
        }
        this.showModal = false;
        const res = await apiGet(`/recurring-entries?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Lưu template thất bại");
      } finally {
        this.saving = false;
      }
    },

    async runNow(r) {
      try {
        const cid = App.companyId();
        await apiPost(`/recurring-entries/${r.id}/run?company_id=${cid}`, {});
        $store.app.flashSuccess(`Đã chạy template "${r.template_name}"`);
        const res = await apiGet(`/recurring-entries?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể chạy template");
      }
    },

    async processDue() {
      this.processing = true;
      try {
        const cid = App.companyId();
        const res = await apiPost(`/recurring-entries/process-due?company_id=${cid}`, {});
        const count = res?.processed ?? res?.count ?? '?';
        $store.app.flashSuccess(`Đã xử lý ${count} template đến hạn`);
        const list = await apiGet(`/recurring-entries?company_id=${cid}`);
        this.items = Array.isArray(list) ? list : (list?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể xử lý template đến hạn");
      } finally {
        this.processing = false;
      }
    },

    deleteItem(r) {
      this.deletingItem = r;
      this.showDeleteConfirm = true;
    },

    async confirmDelete() {
      if (!this.deletingItem) return;
      try {
        const cid = App.companyId();
        await apiDelete(`/recurring-entries/${this.deletingItem.id}?company_id=${cid}`);
        this.showDeleteConfirm = false;
        this.deletingItem = null;
        const res = await apiGet(`/recurring-entries?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
        $store.app.flashSuccess("Đã xóa template");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể xóa template");
      }
    },
  };
}
</script>

</body>
</html>
