<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sao lưu dữ liệu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Sao lưu dữ liệu</h2>
        <button @click="createBackup()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="creating">
          <span x-show="!creating">+ Tạo bản sao lưu</span>
          <span x-show="creating">Đang sao lưu...</span>
        </button>
      </div>

      <!-- Warning -->
      <div class="mb-6 rounded-lg bg-amber-50 border border-amber-200 px-4 py-3">
        <p class="text-sm text-amber-800"><strong>Lưu ý:</strong> Bản sao lưu sẽ được lưu tại server. Hãy tải về máy định kỳ để đảm bảo an toàn dữ liệu.</p>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Lịch sử sao lưu</h3>
          <span class="text-xs text-gray-400" x-text="backups.length + ' bản sao lưu'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên file</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kích thước</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Loại</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Thời gian</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="b in backups" :key="b.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-gray-900" x-text="b.filename"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="formatSize(b.file_size)"></td>
                  <td class="px-5 py-3">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700" x-text="b.backup_type === 'manual' ? 'Thủ công' : 'Tự động'"></span>
                  </td>
                  <td class="px-5 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-green-100 text-green-700': b.status === 'completed',
                        'bg-red-100 text-red-700': b.status === 'failed',
                        'bg-amber-100 text-amber-700': b.status === 'in_progress',
                      }" x-text="b.status === 'completed' ? 'Thành công' : b.status === 'failed' ? 'Thất bại' : 'Đang thực hiện'"></span>
                  </td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDateTime(b.created_at)"></td>
                </tr>
              </template>
              <tr x-show="!backups.length && !loading">
                <td colspan="5" class="px-5 py-8 text-center text-gray-400">Chưa có bản sao lưu nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    backups: [],
    loading: true,
    creating: false,

    async init() {
      mountAppShell("Sao lưu dữ liệu", "/app/backups.html");
      await this.loadBackups();
    },

    async loadBackups() {
      this.loading = true;
      try {
        const data = await apiGet("/backups");
        this.backups = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách sao lưu");
      }
      this.loading = false;
    },

    async createBackup() {
      if (!App.confirm("Tạo bản sao lưu mới?")) return;
      this.creating = true;
      try {
        await apiPost("/backups", {});
        await this.loadBackups();
        $store.app.flashSuccess("Tạo bản sao lưu thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được bản sao lưu");
      }
      this.creating = false;
    },

    formatSize(bytes) {
      if (!bytes) return '—';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    },

    fmtDateTime(s) {
      if (!s) return '—';
      try { return new Date(s).toLocaleString('vi-VN'); } catch { return s; }
    },
  };
}
</script>

</body>
</html>
