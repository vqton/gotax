<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đối chiếu thuế · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <h1 class="text-xl font-bold text-gray-900 mb-6">Đối chiếu thuế</h1>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- VAT Reconciliation -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">Đối chiếu VAT</h2>
          <div class="grid grid-cols-3 gap-3 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Loại kỳ</label>
              <select x-model="vatForm.period_type" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="QUARTERLY">Quý</option>
                <option value="MONTHLY">Tháng</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
              <input type="number" x-model.number="vatForm.period_year" min="2024" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Số kỳ</label>
              <input type="number" x-model.number="vatForm.period_number" min="1" :max="vatForm.period_type === 'QUARTERLY' ? 4 : 12" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <button @click="reconcileVAT()" :disabled="vatLoading" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50">
            <span x-show="!vatLoading">Đối chiếu</span>
            <span x-show="vatLoading">Đang xử lý...</span>
          </button>

          <!-- VAT result -->
          <template x-if="vatResult">
            <div class="mt-4 p-4 rounded-lg" :class="vatResult.matched ? 'bg-green-50 border border-green-200' : 'bg-amber-50 border border-amber-200'">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-lg" x-text="vatResult.matched ? '✅' : '⚠️'"></span>
                <span class="font-semibold" :class="vatResult.matched ? 'text-green-800' : 'text-amber-800'" x-text="vatResult.matched ? 'Đã khớp' : 'Chênh lệch'"></span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <div><span class="text-gray-500">Tổng khai báo:</span> <span class="font-medium" x-text="fmtVND(vatResult.declaration_total)"></span></div>
                <div><span class="text-gray-500">Tổng hóa đơn:</span> <span class="font-medium" x-text="fmtVND(vatResult.invoice_total)"></span></div>
                <div><span class="text-gray-500">Số hóa đơn:</span> <span class="font-medium" x-text="vatResult.invoice_count"></span></div>
                <div><span class="text-gray-500">Chênh lệch:</span> <span class="font-medium" :class="vatResult.variance === 0 ? 'text-green-700' : 'text-red-700'" x-text="fmtVND(vatResult.variance)"></span></div>
              </div>
            </div>
          </template>
        </div>

        <!-- CIT Reconciliation -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">Đối chiếu CIT (TNDN)</h2>
          <div class="grid grid-cols-3 gap-3 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Loại kỳ</label>
              <select x-model="citForm.period_type" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="QUARTERLY">Quý</option>
                <option value="MONTHLY">Tháng</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
              <input type="number" x-model.number="citForm.period_year" min="2024" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Số kỳ</label>
              <input type="number" x-model.number="citForm.period_number" min="1" :max="citForm.period_type === 'QUARTERLY' ? 4 : 12" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <button @click="reconcileCIT()" :disabled="citLoading" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50">
            <span x-show="!citLoading">Đối chiếu</span>
            <span x-show="citLoading">Đang xử lý...</span>
          </button>

          <!-- CIT result -->
          <template x-if="citResult">
            <div class="mt-4 p-4 rounded-lg" :class="citResult.matched ? 'bg-green-50 border border-green-200' : 'bg-amber-50 border border-amber-200'">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-lg" x-text="citResult.matched ? '✅' : '⚠️'"></span>
                <span class="font-semibold" :class="citResult.matched ? 'text-green-800' : 'text-amber-800'" x-text="citResult.matched ? 'Đã khớp' : 'Chênh lệch'"></span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <div><span class="text-gray-500">Doanh thu tính thuế:</span> <span class="font-medium" x-text="fmtVND(citResult.declared_taxable)"></span></div>
                <div><span class="text-gray-500">Thuế TNDN khai:</span> <span class="font-medium" x-text="fmtVND(citResult.declared_tax)"></span></div>
                <div><span class="text-gray-500">Thuế TNDN tính:</span> <span class="font-medium" x-text="fmtVND(citResult.calculated_tax)"></span></div>
                <div><span class="text-gray-500">Chênh lệch:</span> <span class="font-medium" :class="citResult.variance === 0 ? 'text-green-700' : 'text-red-700'" x-text="fmtVND(citResult.variance)"></span></div>
                <div><span class="text-gray-500">Tỷ lệ thuế:</span> <span class="font-medium" x-text="citResult.tax_rate + '%'"></span></div>
              </div>
              <template x-if="citResult.notes && citResult.notes.length">
                <div class="mt-3 text-sm text-amber-700">
                  <template x-for="note in citResult.notes" :key="note">
                    <p x-text="'• ' + note"></p>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Penalty Calculator -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">Tính tiền phạt</h2>
          <p class="text-sm text-gray-500 mb-4">Nghị định 310/2025/NĐ-CP — Phạt tiền trễ hạn nộp tờ khai</p>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hạn nộp tờ khai</label>
            <input type="date" x-model="penaltyForm.declaration_due" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button @click="calculatePenalty()" :disabled="penaltyLoading" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50">
            <span x-show="!penaltyLoading">Tính phạt</span>
            <span x-show="penaltyLoading">Đang xử lý...</span>
          </button>

          <!-- Penalty result -->
          <template x-if="penaltyResult">
            <div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-lg">⚠️</span>
                <span class="font-semibold text-red-800" x-text="'Trễ ' + penaltyResult.daysLate + ' ngày'"></span>
              </div>
              <p class="text-sm text-red-700 mb-2" x-text="penaltyResult.description"></p>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <div><span class="text-gray-500">Phạt tối thiểu:</span> <span class="font-semibold text-red-700" x-text="fmtVND(penaltyResult.penaltyMin) + ' ₫'"></span></div>
                <div><span class="text-gray-500">Phạt tối đa:</span> <span class="font-semibold text-red-700" x-text="fmtVND(penaltyResult.penaltyMax) + ' ₫'"></span></div>
              </div>
            </div>
          </template>
        </div>

        <!-- Scan Overdue -->
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">Quét lịch quá hạn</h2>
          <p class="text-sm text-gray-500 mb-4">Cập nhật trạng thái các lịch thuế quá hạn thành OVERDUE</p>
          <button @click="scanOverdue()" :disabled="scanLoading" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700 disabled:opacity-50">
            <span x-show="!scanLoading">Quét quá hạn</span>
            <span x-show="scanLoading">Đang quét...</span>
          </button>

          <template x-if="scanResult !== null">
            <div class="mt-4 p-4 rounded-lg" :class="scanResult > 0 ? 'bg-amber-50 border border-amber-200' : 'bg-green-50 border border-green-200'">
              <p class="text-sm font-medium" :class="scanResult > 0 ? 'text-amber-800' : 'text-green-800'" x-text="scanResult > 0 ? 'Phát hiện ' + scanResult + ' lịch quá hạn mới' : 'Không có lịch quá hạn mới'"></p>
            </div>
          </template>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    vatForm: { period_type: "QUARTERLY", period_year: new Date().getFullYear(), period_number: 1 },
    citForm: { period_type: "QUARTERLY", period_year: new Date().getFullYear(), period_number: 1 },
    penaltyForm: { declaration_due: "" },
    vatResult: null,
    citResult: null,
    penaltyResult: null,
    vatLoading: false,
    citLoading: false,
    penaltyLoading: false,
    scanLoading: false,
    scanResult: null,

    async init() {
      mountAppShell("Đối chiếu thuế", "/app/tax-reconciliation.html");
    },

    async reconcileVAT() {
      this.vatLoading = true;
      this.vatResult = null;
      try {
        const cid = App.companyId();
        this.vatResult = await apiPost(`/tax/reconcile/vat?company_id=${cid}`, { company_id: cid, period: this.vatForm });
      } catch (e) {
        $store.app.flashError(e.error || "Không thể đối chiếu VAT");
      } finally {
        this.vatLoading = false;
      }
    },

    async reconcileCIT() {
      this.citLoading = true;
      this.citResult = null;
      try {
        const cid = App.companyId();
        this.citResult = await apiPost(`/tax/reconcile/cit?company_id=${cid}`, { company_id: cid, period: this.citForm });
      } catch (e) {
        $store.app.flashError(e.error || "Không thể đối chiếu CIT");
      } finally {
        this.citLoading = false;
      }
    },

    async calculatePenalty() {
      if (!this.penaltyForm.declaration_due) {
        $store.app.flashError("Vui lòng chọn hạn nộp tờ khai");
        return;
      }
      this.penaltyLoading = true;
      this.penaltyResult = null;
      try {
        this.penaltyResult = await apiPost(`/tax/penalty/calculate`, { declaration_due: this.penaltyForm.declaration_due });
      } catch (e) {
        $store.app.flashError(e.error || "Không tính được tiền phạt");
      } finally {
        this.penaltyLoading = false;
      }
    },

    async scanOverdue() {
      this.scanLoading = true;
      this.scanResult = null;
      try {
        const cid = App.companyId();
        const res = await apiPost(`/tax/calendar/scan-overdue?company_id=${cid}`, {});
        this.scanResult = res.overdue_count;
        $store.app.flashSuccess("Quét hoàn tất");
      } catch (e) {
        $store.app.flashError(e.error || "Không quét được");
      } finally {
        this.scanLoading = false;
      }
    },
  };
}
</script>

</body>
</html>
