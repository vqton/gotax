<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công cụ dụng cụ (CCDC) · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="ccdc()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Tabs -->
      <div class="flex gap-1 border-b border-gray-200 mb-6">
        <button @click="tab='items'" :class="tab==='items' ? 'border-blue-700 text-blue-700' : 'border-transparent text-gray-500'" class="px-4 py-2 text-sm font-medium border-b-2 -mb-px">CCDC / Công cụ</button>
        <button @click="tab='categories'" :class="tab==='categories' ? 'border-blue-700 text-blue-700' : 'border-transparent text-gray-500'" class="px-4 py-2 text-sm font-medium border-b-2 -mb-px">Nhóm CCDC</button>
      </div>

      <!-- Items tab -->
      <template x-if="tab==='items'">
        <div>
          <!-- Summary -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl border border-gray-200 p-5">
              <p class="text-sm text-gray-500 mb-1">Tổng CCDC</p>
              <p class="text-2xl font-bold text-gray-900" x-text="items.length"></p>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-5">
              <p class="text-sm text-gray-500 mb-1">Đang hoạt động</p>
              <p class="text-2xl font-bold text-green-700" x-text="items.filter(i=>i.status==='ACTIVE').length"></p>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-5">
              <p class="text-sm text-gray-500 mb-1">Tổng nguyên giá</p>
              <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(items.reduce((s,i)=>s+i.purchase_cost,0)) + ' ₫'"></p>
            </div>
          </div>

          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
              <input type="text" x-model="search" placeholder="Tìm mã, tên CCDC..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <select x-model="filterStatus" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Tất cả trạng thái</option>
                <option value="ACTIVE">Đang hoạt động</option>
                <option value="DISPOSED">Đã thanh lý</option>
                <option value="LOST">Đã mất</option>
              </select>
            </div>
            <button @click="showCreateItem = true; itemForm = {code:'',name:'',category:'',purchase_date:'',purchase_cost:0,status:'ACTIVE',description:''}" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Thêm CCDC</button>
          </div>

          <!-- Items table -->
          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Mã</th>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Tên</th>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Nhóm</th>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Ngày mua</th>
                  <th class="px-4 py-3 text-right font-medium text-gray-600">Giá mua</th>
                  <th class="px-4 py-3 text-right font-medium text-gray-600">Giá trị hiện tại</th>
                  <th class="px-4 py-3 text-center font-medium text-gray-600">Trạng thái</th>
                  <th class="px-4 py-3 text-right font-medium text-gray-600">Thao tác</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <template x-for="item in filteredItems" :key="item.id">
                  <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-900" x-text="item.code"></td>
                    <td class="px-4 py-3 text-gray-700" x-text="item.name"></td>
                    <td class="px-4 py-3 text-gray-500" x-text="item.category || '-'"></td>
                    <td class="px-4 py-3 text-gray-500" x-text="item.purchase_date || '-'"></td>
                    <td class="px-4 py-3 text-right text-gray-700" x-text="fmtVND(item.purchase_cost)"></td>
                    <td class="px-4 py-3 text-right text-gray-700" x-text="fmtVND(item.current_cost)"></td>
                    <td class="px-4 py-3 text-center">
                      <span :class="statusClass(item.status)" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" x-text="statusLabel(item.status)"></span>
                    </td>
                    <td class="px-4 py-3 text-right">
                      <button @click="editItem(item)" class="text-blue-600 hover:text-blue-800 text-xs mr-2">Sửa</button>
                      <button @click="deleteItem(item.id)" class="text-red-600 hover:text-red-800 text-xs">Xóa</button>
                    </td>
                  </tr>
                </template>
                <template x-if="filteredItems.length===0">
                  <tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">Không có CCDC nào</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Categories tab -->
      <template x-if="tab==='categories'">
        <div>
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-gray-900">Nhóm CCDC</h2>
            <button @click="showCreateCat = true; catForm = {code:'',name:'',description:''}" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Thêm nhóm</button>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Mã</th>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Tên nhóm</th>
                  <th class="px-4 py-3 text-left font-medium text-gray-600">Mô tả</th>
                  <th class="px-4 py-3 text-right font-medium text-gray-600">Thao tác</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <template x-for="cat in categories" :key="cat.id">
                  <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-900" x-text="cat.code"></td>
                    <td class="px-4 py-3 text-gray-700" x-text="cat.name"></td>
                    <td class="px-4 py-3 text-gray-500" x-text="cat.description || '-'"></td>
                    <td class="px-4 py-3 text-right">
                      <button @click="editCat(cat)" class="text-blue-600 hover:text-blue-800 text-xs mr-2">Sửa</button>
                      <button @click="deleteCat(cat.id)" class="text-red-600 hover:text-red-800 text-xs">Xóa</button>
                    </td>
                  </tr>
                </template>
                <template x-if="categories.length===0">
                  <tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">Chưa có nhóm CCDC</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Create/Edit Item Modal -->
      <template x-if="showCreateItem">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreateItem=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg" @click.stop>
            <h2 class="text-lg font-bold mb-4" x-text="itemForm.id ? 'Sửa CCDC' : 'Thêm CCDC mới'"></h2>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mã CCDC</label>
                <input type="text" x-model="itemForm.code" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên CCDC</label>
                <input type="text" x-model="itemForm.name" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhóm</label>
                <select x-model="itemForm.category" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">Chọn nhóm</option>
                  <template x-for="cat in categories" :key="cat.id">
                    <option :value="cat.code" x-text="cat.name"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày mua</label>
                <input type="date" x-model="itemForm.purchase_date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Giá mua</label>
                <input type="number" x-model.number="itemForm.purchase_cost" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                <select x-model="itemForm.status" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="ACTIVE">Đang hoạt động</option>
                  <option value="DISPOSED">Đã thanh lý</option>
                  <option value="LOST">Đã mất</option>
                </select>
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                <textarea x-model="itemForm.description" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreateItem=false" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 hover:bg-gray-50">Hủy</button>
              <button @click="saveItem()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">Lưu</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Create/Edit Category Modal -->
      <template x-if="showCreateCat">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreateCat=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md" @click.stop>
            <h2 class="text-lg font-bold mb-4" x-text="catForm.id ? 'Sửa nhóm CCDC' : 'Thêm nhóm CCDC mới'"></h2>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mã nhóm</label>
                <input type="text" x-model="catForm.code" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên nhóm</label>
                <input type="text" x-model="catForm.name" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                <textarea x-model="catForm.description" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreateCat=false" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 hover:bg-gray-50">Hủy</button>
              <button @click="saveCat()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">Lưu</button>
            </div>
          </div>
        </div>
      </template>

    </main>
  </div>

  <script>
  function ccdc() {
    return {
      tab: 'items',
      search: '',
      filterStatus: '',
      categories: [],
      items: [],
      showCreateItem: false,
      showCreateCat: false,
      itemForm: {},
      catForm: {},

      async init() {
        mountAppShell('Công cụ dụng cụ (CCDC)', '/app/ccdc.html');
        const cid = this.getCompanyId();
        await Promise.all([this.loadCats(cid), this.loadItems(cid)]);
      },

      getCompanyId() {
        try { return JSON.parse(localStorage.getItem('company') || '{}').id || 'CMP001'; } catch { return 'CMP001'; }
      },

      async loadCats(cid) {
        this.categories = await apiGet(`/api/v1/ccdc/categories?company_id=${cid}`) || [];
      },

      async loadItems(cid) {
        this.items = await apiGet(`/api/v1/ccdc?company_id=${cid}`) || [];
      },

      get filteredItems() {
        let list = this.items;
        if (this.filterStatus) list = list.filter(i => i.status === this.filterStatus);
        if (this.search) {
          const q = this.search.toLowerCase();
          list = list.filter(i => i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q));
        }
        return list;
      },

      editItem(item) {
        this.itemForm = { ...item };
        this.showCreateItem = true;
      },

      editCat(cat) {
        this.catForm = { ...cat };
        this.showCreateCat = true;
      },

      async saveItem() {
        const cid = this.getCompanyId();
        const url = this.itemForm.id
          ? `/api/v1/ccdc/${this.itemForm.id}`
          : `/api/v1/ccdc?company_id=${cid}`;
        const method = this.itemForm.id ? 'PUT' : 'POST';
        const res = await apiPost(url, this.itemForm, method);
        if (res && res.error) { $store.app.error = res.error; return; }
        $store.app.success = this.itemForm.id ? 'Đã cập nhật CCDC' : 'Đã thêm CCDC';
        this.showCreateItem = false;
        await this.loadItems(cid);
        setTimeout(() => $store.app.success = '', 2000);
      },

      async deleteItem(id) {
        if (!confirm('Xóa CCDC này?')) return;
        const res = await apiPost(`/api/v1/ccdc/${id}`, {}, 'DELETE');
        if (res && res.error) { $store.app.error = res.error; return; }
        $store.app.success = 'Đã xóa CCDC';
        await this.loadItems(this.getCompanyId());
        setTimeout(() => $store.app.success = '', 2000);
      },

      async saveCat() {
        const cid = this.getCompanyId();
        const url = this.catForm.id
          ? `/api/v1/ccdc/categories/${this.catForm.id}`
          : `/api/v1/ccdc/categories?company_id=${cid}`;
        const method = this.catForm.id ? 'PUT' : 'POST';
        const res = await apiPost(url, this.catForm, method);
        if (res && res.error) { $store.app.error = res.error; return; }
        $store.app.success = this.catForm.id ? 'Đã cập nhật nhóm' : 'Đã thêm nhóm';
        this.showCreateCat = false;
        await this.loadCats(cid);
        setTimeout(() => $store.app.success = '', 2000);
      },

      async deleteCat(id) {
        if (!confirm('Xóa nhóm này?')) return;
        const res = await apiPost(`/api/v1/ccdc/categories/${id}`, {}, 'DELETE');
        if (res && res.error) { $store.app.error = res.error; return; }
        $store.app.success = 'Đã xóa nhóm';
        await this.loadCats(this.getCompanyId());
        setTimeout(() => $store.app.success = '', 2000);
      },

      statusClass(s) {
        return { ACTIVE: 'bg-green-100 text-green-800', DISPOSED: 'bg-yellow-100 text-yellow-800', LOST: 'bg-red-100 text-red-800' }[s] || 'bg-gray-100 text-gray-800';
      },

      statusLabel(s) {
        return { ACTIVE: 'Đang hoạt động', DISPOSED: 'Đã thanh lý', LOST: 'Đã mất' }[s] || s;
      },

      fmtVND(v) {
        return new Intl.NumberFormat('vi-VN').format(v || 0);
      }
    };
  }
  </script>
</body>
</html>
