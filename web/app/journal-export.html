<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật ký chung · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Nhật ký chung</h2>
      </div>

      <!-- Download card -->
      <div class="bg-white rounded-xl border border-gray-200 p-6 max-w-lg">
        <div class="flex items-start gap-4 mb-6">
          <div class="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
            <svg class="w-6 h-6 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
          <div>
            <h3 class="text-lg font-bold text-gray-900 mb-1">Xuất file Excel</h3>
            <p class="text-sm text-gray-500">Tải nhật ký chung (sổ nhật ký tổng hợp) theo tháng dạng file .xlsx</p>
          </div>
        </div>

        <div class="flex flex-wrap items-end gap-4 mb-6">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Năm</label>
            <select x-model.number="year" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="y in yearOptions" :key="y">
                <option :value="y" x-text="y"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng</label>
            <select x-model.number="month" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="m in 12" :key="m">
                <option :value="m" x-text="'Tháng ' + m"></option>
              </template>
            </select>
          </div>
          <button @click="download()" :disabled="downloading" class="px-4 py-2 bg-green-700 text-white rounded-lg text-sm font-medium hover:bg-green-800 transition disabled:opacity-50 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span x-show="!downloading">Tải file</span>
            <span x-show="downloading">Đang tải...</span>
          </button>
        </div>

        <div class="text-xs text-gray-400 border-t border-gray-100 pt-4">
          <p>• File bao gồm: Số hiệu CT, ngày CT, tài khoản Nợ/Có, diễn giải, số tiền</p>
          <p>• Dữ liệu theo kỳ kế toán đã chọn</p>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  const now = new Date();
  return {
    downloading: false,
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    yearOptions: Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i),

    async init() {
      mountAppShell("Nhật ký chung", "/app/journal-export.html");
    },

    async download() {
      this.downloading = true;
      try {
        const companyId = $store.app.companyId();
        const resp = await apiFetch(`/reports/journal-export?company_id=${encodeURIComponent(companyId)}&year=${this.year}&month=${this.month}`);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: 'Lỗi tải file' }));
          throw err;
        }
        const blob = await resp.blob();
        const disp = resp.headers.get('content-disposition') || '';
        const match = disp.match(/filename=([^;]+)/);
        const filename = match ? match[1] : `nhat-ky-${this.year}-${String(this.month).padStart(2,'0')}.xlsx`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
        $store.app.flashSuccess("Đã tải file thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được file");
      }
      this.downloading = false;
    },
  };
}
</script>

</body>
</html>
