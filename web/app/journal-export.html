{{define "content"}}
      <div class="page-head">
        <div>
          <h1>Nhật ký chung</h1>
          <p class="ph-sub">Xuất sổ nhật ký chung theo kỳ dạng file Excel</p>
        </div>
      </div>

      <div class="card" style="max-width:640px">
        <div class="card-body">
          <div class="flex items-start gap-4 mb-6">
            <div class="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-6 h-6 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <h3 class="text-lg font-bold mb-1">Xuất file Excel</h3>
              <p class="text-sm text-muted">Tải nhật ký chung (sổ nhật ký tổng hợp) theo tháng dạng file .xlsx</p>
            </div>
          </div>

          <div class="filters-row">
            <div class="f-col">
              <label class="f-label">Năm</label>
              <select id="je-year" class="form-input">
                {{ range $y := yearRange }}
                <option value="{{ $y }}" {{ if eq $.Data.Year $y }}selected{{ end }}>{{ $y }}</option>
                {{ end }}
              </select>
            </div>
            <div class="f-col">
              <label class="f-label">Tháng</label>
              <select id="je-month" class="form-input">
                {{ range $m := monthRange }}
                <option value="{{ $m }}" {{ if eq $.Data.Month $m }}selected{{ end }}>Tháng {{ $m }}</option>
                {{ end }}
              </select>
            </div>
            <div class="f-col self-end">
              <button type="button" class="btn btn-primary" onclick="downloadJournal()">Tải file</button>
            </div>
          </div>

          <div class="text-xs text-muted border-t pt-4 mt-6">
            <p>• File bao gồm: Số hiệu CT, ngày CT, tài khoản Nợ/Có, diễn giải, số tiền</p>
            <p>• Dữ liệu theo kỳ kế toán đã chọn</p>
          </div>
        </div>
      </div>

      <script>
      async function downloadJournal() {
        const year = document.getElementById("je-year").value;
        const month = document.getElementById("je-month").value;
        const resp = await fetch("/app/journal-export/download", {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: new URLSearchParams({year: year, month: month}),
        });
        if (!resp.ok) { alert("Không tải được file"); return; }
        const blob = await resp.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "chung-tu-" + year + "-" + month.padStart(2, "0") + ".xlsx";
        a.click();
        URL.revokeObjectURL(a.href);
      }
      </script>
{{end}}
