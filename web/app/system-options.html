<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tùy chọn hệ thống · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Tùy chọn hệ thống</h2>
        <button @click="saveAll()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="saving">
          <span x-show="!saving">Lưu tất cả</span>
          <span x-show="saving">Đang lưu...</span>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex gap-1 mb-6 border-b border-gray-200">
        <template x-for="tab in tabs" :key="tab.key">
          <button @click="activeTab = tab.key" class="px-4 py-2.5 text-sm font-medium border-b-2 transition"
            :class="activeTab === tab.key ? 'border-blue-700 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700'" x-text="tab.label"></button>
        </template>
      </div>

      <!-- Chung -->
      <div x-show="activeTab === 'global'" class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Tùy chọn chung</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Chế độ kế toán</label>
            <select x-model="opts.accounting_standard" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="circular99">Thông tư 99/2025/TT-BTC</option>
              <option value="circular200">Thông tư 200/2014/TT-BTC</option>
              <option value="circular133">Thông tư 133/2016/TT-BTC</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng bắt đầu năm tài chính</label>
            <select x-model.number="opts.fiscal_year_start" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="1">Tháng 1 (Jan)</option>
              <option value="4">Tháng 4 (Apr)</option>
              <option value="7">Tháng 7 (Jul)</option>
              <option value="10">Tháng 10 (Oct)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Đồng tiền hạch toán</label>
            <select x-model="opts.base_currency" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="VND">VND — Việt Nam Đồng</option>
              <option value="USD">USD — US Dollar</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Đa tiền tệ</label>
            <select x-model="opts.multi_currency_enabled" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="false">Tắt</option>
              <option value="true">Bật</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Ngày bắt đầu dữ liệu</label>
            <input type="date" x-model="opts.accounting_start_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
        </div>
      </div>

      <!-- Kho hàng -->
      <div x-show="activeTab === 'inventory'" class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Tùy chọn vật tư hàng hóa</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Phương pháp tính giá xuất kho</label>
            <select x-model="opts.costing_method" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="weighted_avg">Bình quân tức thời</option>
              <option value="fifo">Nhập trước xuất trước (FIFO)</option>
              <option value="specific">Đích danh</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tính giá theo chi nhánh</label>
            <select x-model="opts.branch_costing" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="shared">Chung toàn công ty</option>
              <option value="separate">Riêng từng chi nhánh</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Cho phép tồn kho âm</label>
            <select x-model="opts.negative_inventory" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="false">Không</option>
              <option value="true">Có</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Định dạng số -->
      <div x-show="activeTab === 'number_format'" class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="text-sm font-semibold text-gray-700 mb-4">Định dạng số</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Dấu ngăn cách hàng nghìn</label>
            <select x-model="opts.thousands_separator" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value=".">Dấu chấm (.)</option>
              <option value=",">Dấu phẩy (,)</option>
              <option value=" ">Khoảng trắng</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Dấu ngăn cách phần thập phân</label>
            <select x-model="opts.decimal_separator" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value=",">Dấu phẩy (,)</option>
              <option value=".">Dấu chấm (.)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Số chữ số thập phân</label>
            <select x-model.number="opts.decimal_places" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Hiển thị số âm</label>
            <select x-model="opts.negative_display" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="parentheses">Trong ngoặc ()</option>
              <option value="minus">Dấu trừ (-)</option>
            </select>
          </div>
        </div>
        <div class="mt-6 p-4 bg-gray-50 rounded-lg">
          <p class="text-xs text-gray-500 mb-2">Xem trước:</p>
          <p class="text-lg font-mono text-gray-900" x-text="previewNumber()"></p>
        </div>
      </div>

    </main>
  </div>

<script>
function comp() {
  return {
    activeTab: 'global',
    saving: false,
    tabs: [
      { key: 'global', label: 'Chung' },
      { key: 'inventory', label: 'Vật tư hàng hóa' },
      { key: 'number_format', label: 'Định dạng số' },
    ],
    opts: {
      accounting_standard: 'circular99',
      fiscal_year_start: '1',
      base_currency: 'VND',
      multi_currency_enabled: 'false',
      accounting_start_date: new Date().toISOString().slice(0, 10),
      costing_method: 'weighted_avg',
      branch_costing: 'shared',
      negative_inventory: 'false',
      thousands_separator: '.',
      decimal_separator: ',',
      decimal_places: 0,
      negative_display: 'parentheses',
    },

    async init() {
      mountAppShell("Tùy chọn hệ thống", "/app/system-options.html");
      await this.loadAll();
    },

    async loadAll() {
      try {
        const data = await apiGet("/system-options");
        if (Array.isArray(data)) {
          data.forEach(opt => {
            if (opt.category === 'global' || opt.category === 'inventory' || opt.category === 'number_format') {
              this.opts[opt.key] = opt.value;
            }
          });
        }
      } catch (e) {
        // Options may not exist yet — use defaults
      }
    },

    async saveAll() {
      this.saving = true;
      try {
        for (const [key, value] of Object.entries(this.opts)) {
          let category = 'global';
          if (['costing_method', 'branch_costing', 'negative_inventory'].includes(key)) category = 'inventory';
          if (['thousands_separator', 'decimal_separator', 'decimal_places', 'negative_display'].includes(key)) category = 'number_format';
          await apiPut("/system-options", { category, key, value: String(value) });
        }
        $store.app.flashSuccess("Đã lưu tùy chọn hệ thống");
      } catch (e) {
        $store.app.flashError(e.error || "Không lưu được tùy chọn");
      }
      this.saving = false;
    },

    previewNumber() {
      const sep = this.opts.thousands_separator;
      const dec = this.opts.decimal_separator;
      const places = this.opts.decimal_places;
      const neg = this.opts.negative_display;
      let num = 1234567.89;
      let intPart = Math.floor(num);
      let decPart = (num - intPart).toFixed(places).slice(places > 0 ? 1 : 0);
      let intStr = String(intPart).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
      let result = places > 0 ? intStr + dec + decPart : intStr;
      if (neg === 'parentheses') return '(' + result + ')';
      return result;
    },
  };
}
</script>

</body>
</html>
