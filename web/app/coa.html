<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống tài khoản · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="coaPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <template x-if="$store.app.success">
      <div class="mb-4 mx-6 mt-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
    </template>
    <template x-if="$store.app.error">
      <div class="mb-4 mx-6 mt-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
    </template>

    <!-- ── MISA SME 2026 layout: left category tree + right grid ── -->
    <div class="p-4 lg:p-6">

      <!-- Breadcrumb + page title -->
      <div class="mb-3">
        <p class="text-xs text-gray-400">Danh mục <span class="mx-1">›</span> Hệ thống tài khoản</p>
        <div class="flex items-center justify-between mt-1">
          <h2 class="text-lg font-bold text-gray-900">Hệ thống tài khoản</h2>
          <span class="text-xs text-gray-500" x-text="treeCount + ' tài khoản'"></span>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-[17rem_1fr] gap-4 items-start">

        <!-- ═══ LEFT: Danh mục tài khoản (loại tree) ═══ -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden lg:sticky lg:top-20">
          <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Danh mục tài khoản</h3>
            <button @click="selectedLoai = null" class="text-[11px] text-blue-600 hover:text-blue-800 font-medium">Tất cả</button>
          </div>
          <div class="max-h-[70vh] overflow-y-auto py-1" x-data="{}">
            <template x-for="loai in loaiNodes" :key="loai.code">
              <div>
                <!-- loại header -->
                <button class="w-full flex items-center gap-1.5 px-3 py-2 text-left text-[13px] font-semibold text-gray-700 hover:bg-gray-50 transition"
                        :class="selectedLoai === loai.code ? 'bg-blue-50 text-blue-800' : ''"
                        @click="selectedLoai = selectedLoai === loai.code ? null : loai.code">
                  <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" :class="treeCollapsed[loai.code] ? '' : 'rotate-90'" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
                  <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                  <span x-text="loai.code"></span>
                  <span class="text-gray-600 font-normal" x-text="loai.name"></span>
                  <span class="ml-auto text-[11px] text-gray-400" x-text="loai.count"></span>
                </button>
                <!-- children -->
                <template x-if="!treeCollapsed[loai.code]">
                  <div>
                    <template x-for="kid in loai.children" :key="kid.code">
                      <button class="w-full flex items-center gap-1.5 pl-8 pr-3 py-1.5 text-left text-[13px] text-gray-600 hover:bg-gray-50 transition"
                              :class="selectedLoai === kid.code ? 'bg-blue-50 text-blue-800 font-medium' : ''"
                              @click="selectedLoai = selectedLoai === kid.code ? null : kid.code">
                        <svg class="w-3.5 h-3.5 text-gray-300 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                        <span x-text="kid.code"></span>
                        <span class="truncate" x-text="kid.name"></span>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- ═══ RIGHT: toolbar + grid ═══ -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
          <!-- toolbar -->
          <div class="flex flex-wrap items-center gap-1.5 px-3 py-2.5 border-b border-gray-200 print:hidden">
            <button @click="openCreate()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-700 text-white rounded-md text-[13px] font-medium hover:bg-blue-800 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Thêm
            </button>
            <button @click="openEdit(selected)" :disabled="!selected" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Sửa
            </button>
            <button @click="deleteAccount(selected)" :disabled="!selected" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              Xóa
            </button>
            <span class="w-px h-5 bg-gray-200 mx-1"></span>
            <button @click="duplicate(selected)" :disabled="!selected" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              Nhân bản
            </button>
            <button @click="openFreeze()" :disabled="!selected || selected.status === 'INACTIVE'" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition"
                    x-text="selected?.status === 'FROZEN' ? 'Mở khóa' : 'Ngừng theo dõi'"></button>
            <span class="flex-1"></span>
            <div class="relative">
              <input type="text" x-model="search" placeholder="Tìm mã hoặc tên TK..."
                     class="w-56 pl-8 pr-3 py-1.5 text-[13px] border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <button @click="exportCSV()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 transition">Xuất Excel</button>
            <button @click="printTable()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-[13px] text-gray-700 hover:bg-gray-50 transition">In</button>
          </div>

          <!-- grid -->
          <div class="overflow-x-auto">
            <table class="w-full text-[13px]">
              <thead class="bg-gray-50 border-b border-gray-200 text-gray-500">
                <tr>
                  <th class="text-left px-4 py-2.5 font-semibold whitespace-nowrap">Số hiệu TK</th>
                  <th class="text-left px-4 py-2.5 font-semibold">Tên tài khoản</th>
                  <th class="text-left px-4 py-2.5 font-semibold whitespace-nowrap">Tên tiếng Anh</th>
                  <th class="text-left px-4 py-2.5 font-semibold">Loại TK</th>
                  <th class="text-left px-4 py-2.5 font-semibold">Tính chất</th>
                  <th class="text-left px-4 py-2.5 font-semibold whitespace-nowrap">Theo dõi chi tiết</th>
                  <th class="text-left px-4 py-2.5 font-semibold whitespace-nowrap">Ngoại tệ</th>
                  <th class="text-left px-4 py-2.5 font-semibold">Trạng thái</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="a in filtered" :key="a.code">
                  <tr class="border-b border-gray-100 hover:bg-blue-50/50 cursor-pointer"
                      :class="selected?.code === a.code ? 'bg-blue-50 border-l-2 border-l-blue-600' : ''"
                      @click="selected = a"
                      @dblclick="openEdit(a)">
                    <td class="px-4 py-2.5 font-medium text-blue-700 whitespace-nowrap" :style="'padding-left:' + (16 + (a._depth || 0) * 18) + 'px'">
                      <span x-show="a._children.length" @click.stop="toggleCollapse(a)" class="inline-flex items-center justify-center w-4 text-gray-400 hover:text-gray-600 cursor-pointer mr-1">
                        <svg x-show="!isCollapsed(a)" class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
                        <svg x-show="isCollapsed(a)" class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
                      </span>
                      <span class="ml-1" x-text="a.code"></span>
                    </td>
                    <td class="px-4 py-2.5 text-gray-900">
                      <span x-text="a.name"></span>
                      <span x-show="a.is_parent" class="ml-1.5 text-[10px] text-gray-400 border border-gray-200 rounded px-1 py-px" title="Tài khoản tổng hợp">TH</span>
                    </td>
                    <td class="px-4 py-2.5 text-gray-500" x-text="a.name2 || '—'"></td>
                    <td class="px-4 py-2.5">
                      <span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-medium" :class="typeColor(a.type)" x-text="typeLabel(a.type)"></span>
                    </td>
                    <td class="px-4 py-2.5">
                      <span class="inline-block px-2 py-0.5 rounded text-[11px] font-medium" :class="normalBalance(a.type) === 'DEBIT' ? 'bg-gray-100 text-gray-700' : 'bg-gray-100 text-gray-700'" x-text="normalBalance(a.type) === 'DEBIT' ? 'Nợ' : 'Có'"></span>
                    </td>
                    <td class="px-4 py-2.5 text-gray-500" x-text="detailByLabel(a.detail_by)"></td>
                    <td class="px-4 py-2.5">
                      <span x-show="a.is_foreign" class="inline-block px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-700">Ngoại tệ</span>
                      <span x-show="!a.is_foreign" class="text-gray-300">—</span>
                    </td>
                    <td class="px-4 py-2.5" x-html="statusBadge(a.status || 'ACTIVE')"></td>
                  </tr>
                </template>
                <tr x-show="!filtered.length">
                  <td colspan="8" class="px-4 py-16 text-center text-gray-400">
                    <span class="text-3xl block mb-2">📂</span>
                    Không có tài khoản nào
                  </td>
                </tr>
              </tbody>
              <tfoot>
                <tr class="bg-gray-50 border-t border-gray-200">
                  <td colspan="8" class="px-4 py-2 text-xs text-gray-500">
                    <span class="font-medium" x-text="filtered.length"></span> tài khoản
                    <template x-if="selectedLoai"><span> · danh mục <span class="font-medium" x-text="loaiName(selectedLoai)"></span></span></template>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900" x-text="editing ? 'Sửa tài khoản' : (duplicating ? 'Nhân bản tài khoản' : 'Thêm tài khoản mới')"></h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Mã tài khoản <span class="text-red-500">*</span></label>
              <input type="text" x-model="form.code" :disabled="editing" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100" placeholder="111, 1111, 511...">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tên tài khoản <span class="text-red-500">*</span></label>
              <input type="text" x-model="form.name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tiền mặt, Hàng tồn kho...">
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-500 mb-1">Tên tiếng Anh</label>
              <input type="text" x-model="form.name2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Cash on hand, Inventories...">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Loại tài khoản <span class="text-red-500">*</span></label>
              <select x-model="form.type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="ASSET">Tài sản (Asset)</option>
                <option value="LIABILITY">Nợ phải trả (Liability)</option>
                <option value="EQUITY">Vốn chủ sở hữu (Equity)</option>
                <option value="REVENUE">Thu nhập (Revenue)</option>
                <option value="EXPENSE">Chi phí (Expense)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tài khoản cha</label>
              <select x-model="form.parent_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Không có</option>
                <template x-for="p in parentOptions" :key="p.code">
                  <option :value="p.code" x-text="p.code + ' — ' + p.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Theo dõi chi tiết theo</label>
              <select x-model="form.detail_by" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Không theo dõi</option>
                <option value="OBJECT">Đối tượng</option>
                <option value="PROJECT">Công trình</option>
                <option value="CONTRACT">Hợp đồng</option>
                <option value="COST_ITEM">Khoản mục chi phí</option>
                <option value="DEPARTMENT">Đơn vị</option>
              </select>
            </div>
            <div class="flex items-end pb-1">
              <div class="flex items-center gap-2">
                <input type="checkbox" x-model="form.is_foreign" :disabled="isForcedForeign" id="is_foreign" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 disabled:bg-gray-100">
                <label for="is_foreign" class="text-sm text-gray-700">Hạch toán ngoại tệ</label>
              </div>
            </div>
          </div>
          <p x-show="isForcedForeign" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-3 py-2">
            Tài khoản <span class="font-semibold" x-text="form.code"></span> bắt buộc hạch toán ngoại tệ theo quy định TT99/2025/TT-BTC.
          </p>
          <p x-show="form.parent_code" class="text-xs text-gray-500 bg-gray-50 border border-gray-100 rounded-md px-3 py-2">
            Lưu ý: TK tổng hợp không hạch toán trực tiếp. Chỉ hạch toán trên tài khoản chi tiết cấp con.
          </p>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveAccount()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving" x-text="editing ? 'Cập nhật' : 'Thêm mới'"></span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Delete confirmation -->
  <template x-if="showDeleteConfirm">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showDeleteConfirm=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Xác nhận xóa</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn xóa tài khoản <span class="font-medium" x-text="deletingAccount?.code"></span> — <span class="font-medium" x-text="deletingAccount?.name"></span>?</p>
        <div class="flex justify-end gap-3">
          <button @click="showDeleteConfirm=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmDelete()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Xóa</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Freeze/Unfreeze modal -->
  <template x-if="showFreezeModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showFreezeModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2" x-text="freezingAccount?.status === 'FROZEN' ? 'Mở khóa tài khoản' : 'Ngừng theo dõi tài khoản'"></h3>
        <p class="text-sm text-gray-600 mb-4">
          <span class="font-medium" x-text="freezingAccount?.code"></span> — <span class="font-medium" x-text="freezingAccount?.name"></span>
        </p>
        <label class="block text-xs font-medium text-gray-500 mb-1">Lý do <span class="text-red-500">*</span></label>
        <textarea x-model="freezeReason" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ghi rõ lý do ngừng theo dõi / mở khóa..."></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button @click="showFreezeModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmFreeze()" :disabled="saving || !freezeReason.trim()"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving" x-text="freezingAccount?.status === 'FROZEN' ? 'Mở khóa' : 'Ngừng theo dõi'"></span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

<style>
  @media print {
    body { background: white; }
    #sidebar, #topbar, .print\:hidden { display: none !important; }
    .lg\:ml-60 { margin-left: 0 !important; }
    main { padding: 0 !important; }
    .rounded-lg { border-radius: 0 !important; border: none !important; box-shadow: none !important; }
    table { font-size: 12px; }
    thead { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
const TYPE_COLORS = {
  ASSET: "bg-blue-100 text-blue-700",
  LIABILITY: "bg-red-100 text-red-700",
  EQUITY: "bg-purple-100 text-purple-700",
  REVENUE: "bg-green-100 text-green-700",
  EXPENSE: "bg-orange-100 text-orange-700",
};
const TYPE_LABELS = {
  ASSET: "Tài sản",
  LIABILITY: "Nợ phải trả",
  EQUITY: "Vốn CSH",
  REVENUE: "Thu nhập",
  EXPENSE: "Chi phí",
};
const DETAIL_BY_LABELS = {
  OBJECT: "Đối tượng",
  PROJECT: "Công trình",
  CONTRACT: "Hợp đồng",
  COST_ITEM: "Khoản mục CP",
  DEPARTMENT: "Đơn vị",
};
// TT99/2025/TT-BTC: tài khoản tiền gửi ngoại tệ bắt buộc hạch toán ngoại tệ
const FORCED_FOREIGN_CODES = ["1112", "1122", "1132"];

function coaPage() {
  return {
    accounts: [],
    search: "",
    showModal: false,
    showDeleteConfirm: false,
    showFreezeModal: false,
    editing: false,
    duplicating: false,
    saving: false,
    selected: null,
    deletingAccount: null,
    freezingAccount: null,
    freezeReason: "",
    collapsed: {},      // grid subtree collapse state
    treeCollapsed: {},  // left panel loại collapse state
    selectedLoai: null, // loại code or cấp 1 code filter; null = all
    form: { code: "", name: "", name2: "", type: "ASSET", parent_code: "", detail_by: "", is_foreign: false, is_active: true },

    /* ── LEFT tree: loại nodes + their direct cấp 1 children ── */
    get loaiNodes() {
      const byCode = {};
      this.accounts.forEach(a => { byCode[a.code] = a; });
      return this.accounts
        .filter(a => !a.parent_code && a.code.length <= 2)
        .map(loai => ({
          code: loai.code,
          name: loai.name,
          count: this.accounts.filter(a => (a.parent_code || "").startsWith(loai.code) || a.code === loai.code).length,
          children: this.accounts
            .filter(a => a.parent_code === loai.code)
            .map(kid => ({ code: kid.code, name: kid.name })),
        }))
        .sort((a, b) => a.code.localeCompare(b.code, "vi", { numeric: true }));
    },

    get treeCount() { return this.accounts.length; },

    loaiName(code) {
      const a = this.accounts.find(x => x.code === code);
      return a ? a.name : "";
    },

    /* ── RIGHT grid: filtered by selection + search, tree-walked ── */
    get filtered() {
      const q = this.search.toLowerCase();
      let list = this.accounts;
      if (this.selectedLoai) {
        const root = this.selectedLoai;
        list = list.filter(a => a.code === root || (a.parent_code || "").startsWith(root));
      }
      if (q) {
        const matched = new Set();
        list.forEach(a => {
          if (a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || (a.name2 || "").toLowerCase().includes(q)) {
            matched.add(a.code);
          }
        });
        list = list.filter(a => {
          if (matched.has(a.code)) return true;
          for (const m of matched) {
            if (m.startsWith(a.code)) return true;
          }
          return false;
        });
      }
      const byCode = {};
      list.forEach(a => { byCode[a.code] = { ...a, _depth: 0, _children: [] }; });
      const roots = [];
      list.forEach(a => {
        const node = byCode[a.code];
        if (a.parent_code && byCode[a.parent_code]) {
          byCode[a.parent_code]._children.push(node);
          node._depth = (byCode[a.parent_code]._depth || 0) + 1;
        } else {
          roots.push(node);
        }
      });
      const flat = [];
      const walk = (nodes) => {
        nodes.forEach(n => {
          flat.push(n);
          if (q || !this.isCollapsed(n)) walk(n._children);
        });
      };
      walk(roots);
      return flat;
    },

    isCollapsed(a) { return !!this.collapsed[a.code]; },
    toggleCollapse(a) {
      if (this.collapsed[a.code]) {
        delete this.collapsed[a.code];
      } else {
        this.collapsed[a.code] = true;
      }
    },

    typeColor(t) { return TYPE_COLORS[t] || "bg-gray-100 text-gray-700"; },
    typeLabel(t) { return TYPE_LABELS[t] || t; },
    detailByLabel(d) { return DETAIL_BY_LABELS[d] || "—"; },
    normalBalance(t) { return (t === "ASSET" || t === "EXPENSE") ? "DEBIT" : "CREDIT"; },
    statusBadge(s) {
      const map = {
        ACTIVE: "bg-green-100 text-green-700",
        FROZEN: "bg-red-100 text-red-700",
        INACTIVE: "bg-gray-200 text-gray-600",
      };
      const label = { ACTIVE: "Đang sử dụng", FROZEN: "Ngừng theo dõi", INACTIVE: "Không dùng" };
      return `<span class="inline-block px-2 py-0.5 rounded-full text-[11px] font-medium ${map[s] || map.ACTIVE}">${label[s] || s}</span>`;
    },

    get isForcedForeign() {
      return FORCED_FOREIGN_CODES.includes(this.form.code);
    },

    get parentOptions() {
      const excluded = new Set([this.form.code]);
      if (this.editing) {
        const walk = (code) => {
          this.accounts.forEach(a => {
            if (a.parent_code === code && !excluded.has(a.code)) {
              excluded.add(a.code);
              walk(a.code);
            }
          });
        };
        walk(this.form.code);
      }
      return this.accounts.filter(a => !excluded.has(a.code));
    },

    async init() {
      mountAppShell("Hệ thống tài khoản", "/app/coa.html");
      try {
        const res = await apiGet("/accounts");
        this.accounts = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        console.error("coa init:", e);
        this.$store.app.flashError(e.error || "Không thể tải danh sách tài khoản");
      }
    },

    emptyForm() {
      return { code: "", name: "", name2: "", type: "ASSET", parent_code: "", detail_by: "", is_foreign: false };
    },

    openCreate() {
      this.editing = false;
      this.duplicating = false;
      this.form = this.emptyForm();
      this.showModal = true;
    },

    duplicate(a) {
      if (!a) return;
      this.editing = false;
      this.duplicating = true;
      this.form = {
        code: "",
        name: a.name,
        name2: a.name2 || "",
        type: a.type || "ASSET",
        parent_code: a.parent_code || "",
        detail_by: a.detail_by || "",
        is_foreign: !!a.is_foreign,
        is_active: a.is_active !== false,
      };
      this.showModal = true;
    },

    openEdit(a) {
      if (!a) return;
      this.editing = true;
      this.duplicating = false;
      this.form = {
        code: a.code,
        name: a.name,
        name2: a.name2 || "",
        type: a.type || "ASSET",
        parent_code: a.parent_code || "",
        detail_by: a.detail_by || "",
        is_foreign: !!a.is_foreign,
        is_active: a.is_active !== false,
      };
      if (this.isForcedForeign) this.form.is_foreign = true;
      this.showModal = true;
    },

    async saveAccount() {
      if (this.isForcedForeign) this.form.is_foreign = true;
      if (!this.form.code || !this.form.name) {
        this.$store.app.flashError("Vui lòng nhập mã và tên tài khoản");
        return;
      }
      this.saving = true;
      try {
        if (this.editing) {
          await apiPut(`/accounts/${this.form.code}`, this.form);
          this.$store.app.flashSuccess("Đã cập nhật tài khoản");
        } else {
          await apiPost("/accounts", this.form);
          this.$store.app.flashSuccess("Đã thêm tài khoản mới");
        }
        this.showModal = false;
        await this.reload();
      } catch (e) {
        this.$store.app.flashError(e.error || "Lỗi lưu tài khoản");
      } finally {
        this.saving = false;
      }
    },

    deleteAccount(a) {
      if (!a) return;
      this.deletingAccount = a;
      this.showDeleteConfirm = true;
    },

    async confirmDelete() {
      if (!this.deletingAccount) return;
      try {
        await apiDelete(`/accounts/${this.deletingAccount.code}`);
        this.showDeleteConfirm = false;
        this.deletingAccount = null;
        this.selected = null;
        await this.reload();
        this.$store.app.flashSuccess("Đã xóa tài khoản");
      } catch (e) {
        this.$store.app.flashError(e.error || "Không thể xóa tài khoản");
      }
    },

    openFreeze() {
      if (!this.selected) return;
      this.freezingAccount = this.selected;
      this.freezeReason = "";
      this.showFreezeModal = true;
    },

    async confirmFreeze() {
      if (!this.freezingAccount || !this.freezeReason.trim()) return;
      this.saving = true;
      const code = this.freezingAccount.code;
      const frozen = this.freezingAccount.status === "FROZEN";
      try {
        const res = await apiPost(`/coa/accounts/${code}/${frozen ? "unfreeze" : "freeze"}`, { reason: this.freezeReason.trim() });
        this.showFreezeModal = false;
        this.freezingAccount = null;
        this.freezeReason = "";
        await this.reload();
        this.$store.app.flashSuccess(frozen ? "Đã mở khóa tài khoản" : "Đã ngừng theo dõi tài khoản");
      } catch (e) {
        this.$store.app.flashError(e.error || "Lỗi cập nhật trạng thái");
      } finally {
        this.saving = false;
      }
    },

    exportCSV() {
      const rows = this.filtered.map(a => [
        a.code,
        a.name,
        a.name2 || "",
        TYPE_LABELS[a.type] || a.type,
        this.normalBalance(a.type) === "DEBIT" ? "Nợ" : "Có",
        a.parent_code || "",
        a.is_foreign ? "Có" : "",
        a.detail_by ? (DETAIL_BY_LABELS[a.detail_by] || a.detail_by) : "",
        a.status === "FROZEN" ? "Ngừng theo dõi" : (a.status === "INACTIVE" ? "Không dùng" : "Đang sử dụng"),
      ]);
      const csv = "\uFEFF" + ["Số hiệu TK", "Tên tài khoản", "Tên tiếng Anh", "Loại", "Tính chất", "TK cha", "Ngoại tệ", "Theo dõi chi tiết", "Trạng thái"]
        .concat(rows.map(r => r.map(v => '"' + (v || "").replace(/"/g, '""') + '"').join(","))).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const aEl = document.createElement("a");
      aEl.href = url;
      aEl.download = "he-thong-tai-khoan.csv";
      aEl.click();
      URL.revokeObjectURL(url);
    },

    printTable() {
      window.print();
    },

    async reload() {
      const res = await apiGet("/accounts");
      this.accounts = Array.isArray(res) ? res : (res?.data || []);
      if (this.selected) {
        this.selected = this.accounts.find(a => a.code === this.selected.code) || null;
      }
    },
  };
}
</script>

</body>
</html>
