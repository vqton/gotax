<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hàng hóa kho · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="itemsPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Hàng hóa kho</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm hàng
        </button>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" x-model="search" placeholder="Tìm mã hàng, tên hàng..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-80 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách hàng hóa</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' hàng'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Loại</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Đơn vị</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Phương pháp tính giá</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tồn kho tối thiểu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tồn kho tối đa</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in filtered" :key="item.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="item.code"></td>
                  <td class="px-5 py-3 text-gray-900" x-text="item.name"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="categoryName(item.category_id)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="item.unit || '—'"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="valuationLabel(item.valuation_method)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="item.min_stock != null ? item.min_stock : '—'"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="item.max_stock != null ? item.max_stock : '—'"></td>
                  <td class="px-5 py-3 text-right space-x-3">
                    <button @click="openEdit(item)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Sửa</button>
                    <button @click="deleteItem(item)" class="text-red-600 hover:text-red-800 text-xs font-medium">Xóa</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="8" class="px-5 py-12 text-center text-gray-400">
                  <span class="text-3xl block mb-2">📦</span>
                  Không có hàng hóa nào
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900" x-text="editing ? 'Sửa hàng hóa' : 'Thêm hàng hóa mới'"></h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Mã hàng <span class="text-red-500">*</span></label>
              <input type="text" x-model="form.code" :disabled="editing" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100" placeholder="HH001">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tên hàng <span class="text-red-500">*</span></label>
              <input type="text" x-model="form.name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tên hàng hóa">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Loại hàng</label>
              <select x-model="form.category_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">— Chọn loại —</option>
                <template x-for="cat in categories" :key="cat.id">
                  <option :value="cat.id" x-text="cat.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Đơn vị</label>
              <input type="text" x-model="form.unit" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="cái, kg, thùng...">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Phương pháp tính giá</label>
              <select x-model="form.valuation_method" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="FIFO">FIFO</option>
                <option value="LIFO">LIFO</option>
                <option value="WEIGHTED_AVG">Trung bình cộng</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tồn kho tối thiểu</label>
              <input type="number" x-model.number="form.min_stock" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tồn kho tối đa</label>
              <input type="number" x-model.number="form.max_stock" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0">
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveItem()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving" x-text="editing ? 'Cập nhật' : 'Thêm mới'"></span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Delete confirmation -->
  <template x-if="showDeleteConfirm">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showDeleteConfirm=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Xác nhận xóa</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn xóa hàng <span class="font-medium" x-text="deletingItem?.code"></span> — <span class="font-medium" x-text="deletingItem?.name"></span>?</p>
        <div class="flex justify-end gap-3">
          <button @click="showDeleteConfirm=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmDelete()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Xóa</button>
        </div>
      </div>
    </div>
  </template>

<script>
function itemsPage() {
  return {
    search: "",
    showModal: false,
    showDeleteConfirm: false,
    editing: false,
    saving: false,
    deletingItem: null,
    items: [],
    categories: [],
    form: { code: "", name: "", category_id: "", unit: "", valuation_method: "FIFO", min_stock: null, max_stock: null },
    editId: null,

    get filtered() {
      const q = this.search.toLowerCase();
      if (!q) return this.items;
      return this.items.filter(i =>
        i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)
      );
    },

    categoryName(id) {
      if (!id) return "—";
      const cat = this.categories.find(c => c.id === id);
      return cat ? cat.name : "—";
    },

    valuationLabel(m) {
      if (m === "WEIGHTED_AVG") return "Trung bình cộng";
      return m || "FIFO";
    },

    async init() {
      mountAppShell("Hàng hóa kho", "/app/warehouse-items.html");
      try {
        const cid = App.companyId();
        const [itemsRes, catsRes] = await Promise.all([
          apiGet(`/warehouse/items?company_id=${cid}`),
          apiGet(`/warehouse/categories?company_id=${cid}`)
        ]);
        this.items = Array.isArray(itemsRes) ? itemsRes : (itemsRes?.data || []);
        this.categories = Array.isArray(catsRes) ? catsRes : (catsRes?.data || []);
      } catch (e) {
        console.error("items init:", e);
        $store.app.flashError(e.error || "Không thể tải danh sách hàng hóa");
      }
    },

    openCreate() {
      this.editing = false;
      this.editId = null;
      this.form = { code: "", name: "", category_id: "", unit: "", valuation_method: "FIFO", min_stock: null, max_stock: null };
      this.showModal = true;
    },

    openEdit(item) {
      this.editing = true;
      this.editId = item.id;
      this.form = {
        code: item.code,
        name: item.name,
        category_id: item.category_id || "",
        unit: item.unit || "",
        valuation_method: item.valuation_method || "FIFO",
        min_stock: item.min_stock,
        max_stock: item.max_stock
      };
      this.showModal = true;
    },

    async saveItem() {
      if (!this.form.code || !this.form.name) {
        $store.app.flashError("Vui lòng nhập mã và tên hàng");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        const payload = { ...this.form };
        if (this.editing) {
          await apiPut(`/warehouse/items/${this.editId}?company_id=${cid}`, payload);
          $store.app.flashSuccess("Đã cập nhật hàng hóa");
        } else {
          await apiPost(`/warehouse/items?company_id=${cid}`, payload);
          $store.app.flashSuccess("Đã thêm hàng hóa mới");
        }
        this.showModal = false;
        const res = await apiGet(`/warehouse/items?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi lưu hàng hóa");
      } finally {
        this.saving = false;
      }
    },

    deleteItem(item) {
      this.deletingItem = item;
      this.showDeleteConfirm = true;
    },

    async confirmDelete() {
      if (!this.deletingItem) return;
      try {
        const cid = App.companyId();
        await apiDelete(`/warehouse/items/${this.deletingItem.id}?company_id=${cid}`);
        this.showDeleteConfirm = false;
        this.deletingItem = null;
        const res = await apiGet(`/warehouse/items?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
        $store.app.flashSuccess("Đã xóa hàng hóa");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể xóa hàng hóa");
      }
    },
  };
}
</script>

</body>
</html>
