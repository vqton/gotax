{{define "content"}}
      <!-- Page header -->
      <div class="page-head">
        <div>
          <h1>Thông tin công ty</h1>
          <p class="ph-sub">Thông tin pháp lý của doanh nghiệp</p>
        </div>
      </div>

      <!-- Company form (htmx swap target) -->
      <div id="company-form" class="mt-16">{{template "company-form" .}}</div>
{{end}}

{{define "company-form"}}
      <div class="card">
        <div class="card-head">
          <h3>Thông tin chung</h3>
        </div>
        <div class="card-body">
          <form hx-post="/app/company/save" hx-target="#company-form" hx-swap="innerHTML">
            <div class="form-grid">
              <div class="f-col span2">
                <label class="f-label" for="co-legal-vn">Tên công ty (tiếng Việt) <span class="f-req">*</span></label>
                <input type="text" id="co-legal-vn" name="legal_name_vn" required value="{{.Data.Company.LegalNameVN}}" placeholder="Công ty TNHH...">
              </div>
              <div class="f-col span2">
                <label class="f-label" for="co-legal-en">Tên công ty (tiếng Anh)</label>
                <input type="text" id="co-legal-en" name="legal_name_en" value="{{.Data.Company.LegalNameEN}}" placeholder="Company Limited...">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-tax">Mã số thuế <span class="f-req">*</span></label>
                <input type="text" id="co-tax" name="tax_code" required value="{{.Data.Company.TaxCode}}" placeholder="0123456789">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-phone">Điện thoại</label>
                <input type="tel" id="co-phone" name="phone" value="{{.Data.Company.Phone}}" placeholder="024 1234 5678">
              </div>
              <div class="f-col span2">
                <label class="f-label" for="co-address">Địa chỉ đăng ký</label>
                <input type="text" id="co-address" name="reg_address" value="{{.Data.Company.RegAddress}}" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-email">Email</label>
                <input type="email" id="co-email" name="email" value="{{.Data.Company.Email}}" placeholder="contact@company.vn">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-website">Website</label>
                <input type="text" id="co-website" name="website" value="{{.Data.Company.Website}}" placeholder="https://company.vn">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-rep-name">Người đại diện pháp luật</label>
                <input type="text" id="co-rep-name" name="legal_rep_name" value="{{.Data.Company.LegalRepName}}" placeholder="Nguyễn Văn A">
              </div>
              <div class="f-col">
                <label class="f-label" for="co-rep-title">Chức danh</label>
                <input type="text" id="co-rep-title" name="legal_rep_title" value="{{.Data.Company.LegalRepTitle}}" placeholder="Giám đốc, Tổng giám đốc...">
              </div>
            </div>
            <div class="form-foot">
              <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            </div>
          </form>
        </div>
      </div>
{{end}}
