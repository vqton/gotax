<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóa đơn điện tử · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng hóa đơn</p>
          <p class="text-2xl font-bold text-gray-900" x-text="invoices.length"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Đã phát hành</p>
          <p class="text-2xl font-bold text-green-700" x-text="issuedCount"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Chờ xử lý</p>
          <p class="text-2xl font-bold text-amber-700" x-text="draftCount"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng tiền</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(totalAmount) + ' ₫'"></p>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold text-gray-900">Hóa đơn điện tử</h1>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Tạo hóa đơn</button>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-[500px]" @click.stop>
            <h2 class="text-lg font-bold mb-4">Tạo hóa đơn điện tử</h2>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mẫu số</label>
                <input x-model="form.pattern" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="01GTKT">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ký hiệu</label>
                <input x-model="form.serial" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="C23GHH">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Loại hóa đơn</label>
                <select x-model="form.invoice_type" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="ORIGINAL">Gốc</option>
                  <option value="ADJUSTMENT">Điều chỉnh</option>
                  <option value="REPLACEMENT">Thay thế</option>
                  <option value="CANCELLATION_NOTE">Hủy</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày lập</label>
                <input type="date" x-model="form.issue_date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên khách hàng</label>
                <input x-model="form.buyer_name" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mã số thuế</label>
                <input x-model="form.buyer_tax_code" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input x-model="form.buyer_email" type="email" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Chi tiết hàng hóa</label>
              <template x-for="(line, i) in form.lines" :key="i">
                <div class="flex gap-2 mb-2">
                  <input x-model="line.description" placeholder="Mô tả" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="line.quantity" placeholder="SL" class="w-16 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="line.unit_price" placeholder="Đơn giá" class="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="line.vat_rate" placeholder="VAT%" class="w-16 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <button @click="form.lines.splice(i,1)" class="text-red-500 hover:text-red-700 text-sm">✕</button>
                </div>
              </template>
              <button @click="form.lines.push({description:'',quantity:1,unit_price:0,vat_rate:10,unit:'Chiếc',line_total:0,vat_amount:0})" class="text-sm text-blue-600 hover:text-blue-800">+ Thêm dòng</button>
            </div>
            <div class="flex justify-end gap-2 mt-4">
              <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createInvoice()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Tạo hóa đơn</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Filter -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
            <select x-model="filterStatus" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả</option>
              <option value="DRAFT">Nháp</option>
              <option value="SUBMITTED">Đã gửi</option>
              <option value="ISSUED">Đã phát hành</option>
              <option value="CANCELLED">Đã hủy</option>
            </select>
          </div>
          <button @click="filterStatus=''" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700">Xoá lọc</button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách hóa đơn</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' hóa đơn'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mẫu/Ký hiệu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Khách hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày lập</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng tiền</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="inv in filtered" :key="inv.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-gray-900" x-text="inv.pattern + '/' + inv.serial"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="inv.buyer_name"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(inv.issue_date)"></td>
                  <td class="px-5 py-3" x-html="invStatusBadge(inv.status)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(inv.grand_total) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right">
                    <template x-if="inv.status === 'DRAFT' || inv.status === 'VALIDATED'">
                      <button @click="issueInvoice(inv.id)" class="text-xs text-green-600 hover:text-green-800 font-medium">Phát hành</button>
                    </template>
                    <template x-if="inv.status === 'ISSUED'">
                      <button @click="cancelInvoice(inv.id)" class="text-xs text-red-600 hover:text-red-800 font-medium ml-2">Hủy</button>
                    </template>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Không có hóa đơn nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    invoices: [],
    filterStatus: "",
    showCreate: false,
    form: {
      pattern: "01GTKT", serial: "C23GHH", invoice_type: "ORIGINAL",
      issue_date: new Date().toISOString().slice(0,10),
      buyer_name: "", buyer_tax_code: "", buyer_email: "",
      currency_code: "VND", exchange_rate: 1,
      lines: [{description:"",quantity:1,unit_price:0,vat_rate:10,unit:"Chiếc",line_total:0,vat_amount:0}],
    },

    get filtered() {
      if (!this.filterStatus) return this.invoices;
      return this.invoices.filter(i => i.status === this.filterStatus);
    },
    get issuedCount() { return this.invoices.filter(i => i.status === "ISSUED").length; },
    get draftCount() { return this.invoices.filter(i => i.status === "DRAFT" || i.status === "SUBMITTED").length; },
    get totalAmount() { return this.invoices.reduce((s, i) => s + (i.grand_total || 0), 0); },

    async init() {
      mountAppShell("Hóa đơn điện tử", "/app/tax-einvoices.html");
      try {
        const cid = App.companyId();
        this.invoices = await apiGet(`/tax/e-invoices?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("e-invoices init:", e);
      }
    },

    async createInvoice() {
      if (!this.form.buyer_name) {
        $store.app.flashError("Vui lòng nhập tên khách hàng");
        return;
      }
      const cid = App.companyId();
      for (let l of this.form.lines) {
        l.line_total = l.quantity * l.unit_price;
        l.vat_amount = l.line_total * l.vat_rate / 100;
      }
      const subtotal = this.form.lines.reduce((s,l) => s + l.line_total, 0);
      const vat = this.form.lines.reduce((s,l) => s + l.vat_amount, 0);
      const payload = {...this.form, company_id: cid, subtotal, vat_amount: vat, grand_total: subtotal + vat};
      try {
        await apiPost("/tax/e-invoices", payload);
        this.showCreate = false;
        this.invoices = await apiGet(`/tax/e-invoices?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Tạo hóa đơn thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được hóa đơn");
      }
    },

    async issueInvoice(id) {
      try {
        await apiPost(`/tax/e-invoices/${id}/issue`);
        const cid = App.companyId();
        this.invoices = await apiGet(`/tax/e-invoices?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Đã gửi hóa đơn lên GDT");
      } catch (e) {
        $store.app.flashError(e.error || "Không phát hành được");
      }
    },

    async cancelInvoice(id) {
      const reason = prompt("Lý do hủy:");
      if (!reason) return;
      try {
        await apiPost(`/tax/e-invoices/${id}/cancel`, {reason});
        const cid = App.companyId();
        this.invoices = await apiGet(`/tax/e-invoices?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Đã hủy hóa đơn");
      } catch (e) {
        $store.app.flashError(e.error || "Không hủy được");
      }
    },
  };
}

function invStatusBadge(s) {
  const m = {
    DRAFT: "bg-gray-100 text-gray-700",
    SIGNED: "bg-blue-100 text-blue-700",
    SUBMITTED: "bg-amber-100 text-amber-700",
    VALIDATED: "bg-red-100 text-red-700",
    ISSUED: "bg-green-100 text-green-700",
    CANCELLED: "bg-red-100 text-red-700",
    REPLACED: "bg-purple-100 text-purple-700",
  };
  return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${m[s]||m.DRAFT}">${s}</span>`;
}
</script>

</body>
</html>
