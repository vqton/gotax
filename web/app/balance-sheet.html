<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng cân đối kế toán · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Bảng cân đối kế toán</h2>
        <button @click="window.print()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          In báo cáo
        </button>
      </div>

      <!-- Year/Month selectors -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Năm</label>
            <select x-model.number="year" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="y in yearOptions" :key="y">
                <option :value="y" x-text="y"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng</label>
            <select x-model.number="month" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="m in 12" :key="m">
                <option :value="m" x-text="'Tháng ' + m"></option>
              </template>
            </select>
          </div>
          <button @click="loadReport()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">Xem báo cáo</button>
        </div>
      </div>

      <!-- Two-column layout -->
      <div x-show="assets.length || liabilities.length" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Assets -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-200 bg-blue-50">
            <h3 class="text-sm font-bold text-blue-900">I. TÀI SẢN</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="text-left px-4 py-2 font-semibold text-gray-600">Mã TK</th>
                  <th class="text-left px-4 py-2 font-semibold text-gray-600">Tên tài khoản</th>
                  <th class="text-right px-4 py-2 font-semibold text-gray-600">Số dư</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="a in assets" :key="a.account_code">
                  <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-medium text-blue-700" x-text="a.account_code"></td>
                    <td class="px-4 py-2.5 text-gray-700" x-text="a.account_name"></td>
                    <td class="px-4 py-2.5 text-right tabular-nums font-medium" x-text="fmtVND(a.balance)"></td>
                  </tr>
                </template>
              </tbody>
              <tfoot class="bg-blue-50 border-t-2 border-blue-200">
                <tr>
                  <td colspan="2" class="px-4 py-3 text-sm font-bold text-blue-900">Tổng tài sản</td>
                  <td class="px-4 py-3 text-right text-sm font-bold tabular-nums text-blue-900" x-text="fmtVND(totalAssets)"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <!-- Liabilities + Equity -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-200 bg-green-50">
            <h3 class="text-sm font-bold text-green-900">II. NỢ PHẢI TRẢ + VỐN CHỦ SỞ HỮU</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                  <th class="text-left px-4 py-2 font-semibold text-gray-600">Mã TK</th>
                  <th class="text-left px-4 py-2 font-semibold text-gray-600">Tên tài khoản</th>
                  <th class="text-right px-4 py-2 font-semibold text-gray-600">Số dư</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="l in liabilities" :key="l.account_code">
                  <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="px-4 py-2.5 font-medium text-green-700" x-text="l.account_code"></td>
                    <td class="px-4 py-2.5 text-gray-700" x-text="l.account_name"></td>
                    <td class="px-4 py-2.5 text-right tabular-nums font-medium" x-text="fmtVND(l.balance)"></td>
                  </tr>
                </template>
              </tbody>
              <tfoot class="bg-green-50 border-t-2 border-green-200">
                <tr>
                  <td colspan="2" class="px-4 py-3 text-sm font-bold text-green-900">Tổng nợ phải trả + VCSH</td>
                  <td class="px-4 py-3 text-right text-sm font-bold tabular-nums text-green-900" x-text="fmtVND(totalLiabilities)"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>

      <!-- Balance check -->
      <div x-show="assets.length || liabilities.length" class="mt-4 bg-white rounded-xl border border-gray-200 p-4">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-500">Kiểm tra cân đối:</span>
          <span :class="totalAssets === totalLiabilities ? 'text-green-700 font-bold' : 'text-red-700 font-bold'"
            x-text="totalAssets === totalLiabilities ? '✓ Cân đối (' + fmtVND(totalAssets) + ' ₫)' : '✗ Chưa cân đối — TS: ' + fmtVND(totalAssets) + ' ≠ NPT: ' + fmtVND(totalLiabilities)"></span>
        </div>
      </div>

      <div x-show="!assets.length && !liabilities.length && !loading" class="text-center text-gray-400 py-12">
        Chọn năm và tháng để xem báo cáo
      </div>
    </main>
  </div>

<script>
function comp() {
  const now = new Date();
  return {
    assets: [],
    liabilities: [],
    loading: false,
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    yearOptions: Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i),

    get totalAssets() { return this.assets.reduce((s, a) => s + (a.balance || 0), 0); },
    get totalLiabilities() { return this.liabilities.reduce((s, l) => s + (l.balance || 0), 0); },

    async init() {
      mountAppShell("Bảng cân đối kế toán", "/app/balance-sheet.html");
    },

    async loadReport() {
      this.loading = true;
      this.assets = [];
      this.liabilities = [];
      try {
        const data = await apiGet(`/reports/balance-sheet?year=${this.year}&month=${this.month}`);
        const rows = Array.isArray(data) ? data : data.items || data.rows || [];
        this.assets = rows.filter(r => r.account_code && r.account_code.startsWith("1"));
        this.liabilities = rows.filter(r => r.account_code && (r.account_code.startsWith("2") || r.account_code.startsWith("3") || r.account_code.startsWith("4")));
        if (this.assets.length === 0 && this.liabilities.length === 0 && rows.length > 0) {
          this.assets = rows.filter(r => r.type === "asset" || r.group === "asset");
          this.liabilities = rows.filter(r => r.type === "liability" || r.type === "equity" || r.group === "liability" || r.group === "equity");
        }
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được báo cáo");
      }
      this.loading = false;
    },
  };
}
</script>

</body>
</html>
