<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tỷ giá ngoại tệ · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Tỷ giá ngoại tệ</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Thêm tỷ giá</button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Bảng tỷ giá</h3>
          <span class="text-xs text-gray-400" x-text="rates.length + ' tỷ giá'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã tiền tệ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tỷ giá mua</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tỷ giá bán</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tỷ giá chuyển khoản</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày áp dụng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ghi chú</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in rates" :key="r.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3">
                    <span class="inline-flex items-center gap-2">
                      <span class="w-7 h-7 rounded bg-blue-100 flex items-center justify-center text-xs font-bold text-blue-700" x-text="r.currency_code"></span>
                      <span class="font-medium" x-text="r.currency_code"></span>
                    </span>
                  </td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(r.buying_rate)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(r.selling_rate)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(r.transfer_rate)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(r.rate_date)"></td>
                  <td class="px-5 py-3 text-gray-500 max-w-xs truncate" x-text="r.notes || '—'"></td>
                </tr>
              </template>
              <tr x-show="!rates.length && !loading">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chưa có tỷ giá ngoại tệ nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6" @click.stop>
        <h3 class="text-lg font-bold text-gray-900 mb-4">Thêm tỷ giá mới</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Mã tiền tệ <span class="text-red-500">*</span></label>
            <select x-model="form.currency_code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Chọn tiền tệ</option>
              <option value="USD">USD — US Dollar</option>
              <option value="EUR">EUR — Euro</option>
              <option value="JPY">JPY — Japanese Yen</option>
              <option value="KRW">KRW — Korean Won</option>
              <option value="CNY">CNY — Chinese Yuan</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Ngày áp dụng <span class="text-red-500">*</span></label>
            <input type="date" x-model="form.rate_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tỷ giá mua <span class="text-red-500">*</span></label>
            <input type="number" x-model.number="form.buying_rate" min="0" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="25,450">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tỷ giá bán <span class="text-red-500">*</span></label>
            <input type="number" x-model.number="form.selling_rate" min="0" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="25,550">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tỷ giá chuyển khoản</label>
            <input type="number" x-model.number="form.transfer_rate" min="0" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="25,500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Ghi chú</label>
            <input type="text" x-model="form.notes" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Nguồn: NHNN">
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createRate()" class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition" :disabled="saving">
            <span x-show="!saving">Thêm tỷ giá</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

<script>
function comp() {
  return {
    rates: [],
    loading: true,
    showCreate: false,
    saving: false,
    form: {
      currency_code: "",
      rate_date: new Date().toISOString().slice(0, 10),
      buying_rate: 0,
      selling_rate: 0,
      transfer_rate: 0,
      notes: "",
    },

    async init() {
      mountAppShell("Tỷ giá ngoại tệ", "/app/exchange-rates.html");
      await this.loadRates();
    },

    async loadRates() {
      this.loading = true;
      try {
        const data = await apiGet("/exchange-rates");
        this.rates = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách tỷ giá");
      }
      this.loading = false;
    },

    async createRate() {
      if (!this.form.currency_code || !this.form.rate_date) {
        $store.app.flashError("Vui lòng chọn tiền tệ và ngày áp dụng");
        return;
      }
      if (!this.form.buying_rate || !this.form.selling_rate) {
        $store.app.flashError("Vui lòng nhập tỷ giá mua và bán");
        return;
      }
      this.saving = true;
      try {
        await apiPost("/exchange-rates", this.form);
        this.showCreate = false;
        this.form = {
          currency_code: "",
          rate_date: new Date().toISOString().slice(0, 10),
          buying_rate: 0,
          selling_rate: 0,
          transfer_rate: 0,
          notes: "",
        };
        await this.loadRates();
        $store.app.flashSuccess("Thêm tỷ giá thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không thêm được tỷ giá");
      }
      this.saving = false;
    },
  };
}
</script>

</body>
</html>
