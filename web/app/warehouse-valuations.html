<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Định giá tồn kho · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="valuationsPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Detail view -->
      <template x-if="detailItem">
        <div>
          <div class="flex items-center gap-3 mb-6">
            <button @click="detailItem=null" class="text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h2 class="text-xl font-bold text-gray-900" x-text="'Định giá #' + detailItem.id"></h2>
            <span x-html="statusBadge(detailItem.status)"></span>
          </div>

          <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
              <div class="text-xs text-gray-400 mb-1">Phương pháp</div>
              <div class="text-sm font-semibold text-gray-900" x-text="methodLabel(detailItem.method)"></div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
              <div class="text-xs text-gray-400 mb-1">Ngày định giá</div>
              <div class="text-sm font-semibold text-gray-900" x-text="detailItem.valuation_date || '—'"></div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
              <div class="text-xs text-gray-400 mb-1">Hoàn thành</div>
              <div class="text-sm font-semibold text-gray-900" x-text="detailItem.completed_at || '—'"></div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
              <div class="text-xs text-gray-400 mb-1">Tổng giá trị</div>
              <div class="text-sm font-semibold text-blue-700" x-text="formatCurrency(detailTotal)"></div>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-sm font-semibold text-gray-700">Chi tiết tồn kho</h3>
              <span class="text-xs text-gray-400" x-text="detailItems.length + ' mặt hàng'"></span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-200">
                  <tr>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã hàng</th>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên hàng</th>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho</th>
                    <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số lượng</th>
                    <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Đơn giá</th>
                    <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng giá trị</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="it in detailItems" :key="it.id">
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                      <td class="px-5 py-3 font-medium text-blue-700" x-text="it.item_id"></td>
                      <td class="px-5 py-3 text-gray-900" x-text="it.item_name || '—'"></td>
                      <td class="px-5 py-3 text-gray-500" x-text="it.warehouse_id"></td>
                      <td class="px-5 py-3 text-right text-gray-900" x-text="Number(it.quantity).toLocaleString()"></td>
                      <td class="px-5 py-3 text-right text-gray-900" x-text="formatCurrency(it.unit_cost)"></td>
                      <td class="px-5 py-3 text-right font-medium text-blue-700" x-text="formatCurrency(it.total_cost)"></td>
                    </tr>
                  </template>
                  <tr x-show="!detailItems.length">
                    <td colspan="6" class="px-5 py-12 text-center text-gray-400">Chưa có dữ liệu tồn kho</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- List view -->
      <template x-if="!detailItem">
        <div>
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-900">Định giá tồn kho</h2>
            <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Tạo đợt định giá
            </button>
          </div>

          <!-- Table -->
          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-sm font-semibold text-gray-700">Danh sách đợt định giá</h3>
              <span class="text-xs text-gray-400" x-text="items.length + ' đợt'"></span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-200">
                  <tr>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã đợt</th>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Phương pháp</th>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                    <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày tạo</th>
                    <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="v in items" :key="v.id">
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                      <td class="px-5 py-3 font-medium text-blue-700 cursor-pointer" @click="viewDetail(v)" x-text="v.id.slice(0,8)"></td>
                      <td class="px-5 py-3 text-gray-900" x-text="methodLabel(v.method)"></td>
                      <td class="px-5 py-3" x-html="statusBadge(v.status)"></td>
                      <td class="px-5 py-3 text-gray-500" x-text="v.created_at ? new Date(v.created_at).toLocaleDateString('vi-VN') : '—'"></td>
                      <td class="px-5 py-3 text-right space-x-3">
                        <button x-show="v.status==='PENDING'" @click="runValuation(v)" class="text-green-600 hover:text-green-800 text-xs font-medium">Chạy</button>
                        <button @click="viewDetail(v)" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Chi tiết</button>
                        <button @click="deleteItem(v)" class="text-red-600 hover:text-red-800 text-xs font-medium">Xóa</button>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="!items.length">
                    <td colspan="5" class="px-5 py-12 text-center text-gray-400">
                      <span class="text-3xl block mb-2">📦</span>
                      Chưa có đợt định giá nào
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showModal">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showModal=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4" @click.stop>
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Tạo đợt định giá mới</h3>
          <button @click="showModal=false" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="px-6 py-4 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Kho <span class="text-red-500">*</span></label>
              <select x-model="form.warehouse_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">— Chọn kho —</option>
                <template x-for="wh in warehouses" :key="wh.id">
                  <option :value="wh.id" x-text="wh.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Phương pháp <span class="text-red-500">*</span></label>
              <select x-model="form.method" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="weighted_average">Trung bình gia quyền</option>
                <option value="fifo">FIFO</option>
                <option value="lifo">LIFO</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ngày định giá <span class="text-red-500">*</span></label>
              <input type="date" x-model="form.valuation_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Ghi chú</label>
              <input type="text" x-model="form.notes" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ghi chú...">
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
          <button @click="showModal=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="saveItem()" :disabled="saving"
            class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition">
            <span x-show="!saving">Tạo mới</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Delete confirmation -->
  <template x-if="showDeleteConfirm">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showDeleteConfirm=false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Xác nhận xóa</h3>
        <p class="text-sm text-gray-600 mb-4">Bạn có chắc chắn muốn xóa đợt định giá <span class="font-medium" x-text="deletingItem?.id?.slice(0,8)"></span>?</p>
        <div class="flex justify-end gap-3">
          <button @click="showDeleteConfirm=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 transition">Hủy</button>
          <button @click="confirmDelete()" class="px-5 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition">Xóa</button>
        </div>
      </div>
    </div>
  </template>

<script>
function valuationsPage() {
  return {
    showModal: false,
    showDeleteConfirm: false,
    saving: false,
    deletingItem: null,
    items: [],
    warehouses: [],
    detailItem: null,
    detailItems: [],
    detailTotal: 0,
    form: { warehouse_id: "", method: "weighted_average", valuation_date: "", notes: "" },

    async init() {
      mountAppShell("Định giá tồn kho", "/app/warehouse-valuations.html");
      try {
        const cid = App.companyId();
        const [res, whRes] = await Promise.all([
          apiGet(`/warehouse/valuations?company_id=${cid}`),
          apiGet(`/warehouse/warehouses?company_id=${cid}`)
        ]);
        this.items = Array.isArray(res) ? res : (res?.data || []);
        this.warehouses = Array.isArray(whRes) ? whRes : (whRes?.data || []);
      } catch (e) {
        console.error("valuations init:", e);
        $store.app.flashError(e.error || "Không thể tải danh sách định giá");
      }
    },

    methodLabel(m) {
      const labels = { weighted_average: "Trung bình gia quyền", fifo: "FIFO", lifo: "LIFO", specific_id: "Theo mã cụ thể", standard: "Tiêu chuẩn" };
      return labels[m] || m || "—";
    },

    formatCurrency(v) {
      if (v == null) return "—";
      return new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND", maximumFractionDigits: 0 }).format(v);
    },

    openCreate() {
      const today = new Date().toISOString().slice(0, 10);
      this.form = { warehouse_id: "", method: "weighted_average", valuation_date: today, notes: "" };
      this.showModal = true;
    },

    async saveItem() {
      if (!this.form.valuation_date) {
        $store.app.flashError("Vui lòng chọn ngày định giá");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        const body = {
          valuation_date: this.form.valuation_date,
          method: this.form.method,
          notes: this.form.notes
        };
        await apiPost(`/warehouse/valuations?company_id=${cid}`, body);
        this.showModal = false;
        $store.app.flashSuccess("Đã tạo đợt định giá mới");
        const res = await apiGet(`/warehouse/valuations?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi tạo đợt định giá");
      } finally {
        this.saving = false;
      }
    },

    async runValuation(v) {
      if (!confirm("Chạy định giá đợt này?")) return;
      try {
        const cid = App.companyId();
        await apiPost(`/warehouse/valuations/${v.id}/run?company_id=${cid}`, {});
        $store.app.flashSuccess("Định giá hoàn thành");
        const res = await apiGet(`/warehouse/valuations?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi chạy định giá");
      }
    },

    async viewDetail(v) {
      try {
        const cid = App.companyId();
        const data = await apiGet(`/warehouse/valuations/${v.id}?company_id=${cid}`);
        this.detailItem = data;
        const balances = await apiGet(`/warehouse/balances?company_id=${cid}&warehouse_id=${v.warehouse_id || ""}`);
        const list = Array.isArray(balances) ? balances : (balances?.data || []);
        this.detailItems = list;
        this.detailTotal = list.reduce((sum, it) => sum + (it.total_cost || 0), 0);
      } catch (e) {
        $store.app.flashError(e.error || "Không thể tải chi tiết");
      }
    },

    deleteItem(v) {
      this.deletingItem = v;
      this.showDeleteConfirm = true;
    },

    async confirmDelete() {
      if (!this.deletingItem) return;
      try {
        const cid = App.companyId();
        await apiDelete(`/warehouse/valuations/${this.deletingItem.id}?company_id=${cid}`);
        this.showDeleteConfirm = false;
        this.deletingItem = null;
        const res = await apiGet(`/warehouse/valuations?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res?.data || []);
        $store.app.flashSuccess("Đã xóa đợt định giá");
      } catch (e) {
        $store.app.flashError(e.error || "Không thể xóa đợt định giá");
      }
    },
  };
}
</script>

</body>
</html>
