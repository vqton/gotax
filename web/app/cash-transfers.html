<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển quỹ · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="cashTransfers()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Danh sách chuyển quỹ</h2>
          <p class="text-sm text-gray-500 mt-1" x-text="'Tổng: ' + (items.length) + ' lệnh chuyển'"></p>
        </div>
        <button @click="showForm = true; resetForm()" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Lệnh chuyển quỹ
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số CC</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Từ quỹ</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Đến quỹ</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số tiền</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="t in items" :key="t.id">
              <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-5 py-3 font-medium" x-text="t.id?.slice(0, 8) || '—'"></td>
                <td class="px-5 py-3 text-gray-500" x-text="fmtDate(t.transfer_date)"></td>
                <td class="px-5 py-3 text-gray-700" x-text="t.from_account_id"></td>
                <td class="px-5 py-3 text-gray-700" x-text="t.to_account_id"></td>
                <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(t.amount)"></td>
                <td class="px-5 py-3" x-html="statusBadge(t.status)"></td>
              </tr>
            </template>
            <tr x-show="!items.length && !loading">
              <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chưa có lệnh chuyển quỹ nào</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div x-show="showForm" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" x-transition>
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg" @click.outside="showForm = false">
          <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
            <h3 class="text-lg font-semibold text-gray-900">Lệnh chuyển quỹ</h3>
            <button @click="showForm = false" class="text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <form @submit.prevent="create()" class="px-6 py-4 space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày chuyển</label>
                <input type="date" x-model="form.transfer_date" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền</label>
                <input type="number" x-model.number="form.amount" required min="1" step="1" placeholder="0" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Từ quỹ</label>
                <input type="text" x-model="form.from_account_id" required placeholder="Tài khoản tiền gửi đi" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Đến quỹ</label>
                <input type="text" x-model="form.to_account_id" required placeholder="Tài khoản tiền nhận" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Diễn giải</label>
              <input type="text" x-model="form.reason" required placeholder="Nhập diễn giải" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
              <button type="button" @click="showForm = false" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded-lg transition">Hủy</button>
              <button type="submit" :disabled="saving" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 transition">
                <span x-show="!saving">Tạo lệnh chuyển</span>
                <span x-show="saving">Đang lưu...</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

<script>
function cashTransfers() {
  return {
    items: [],
    loading: false,
    showForm: false,
    saving: false,
    form: {
      transfer_date: new Date().toISOString().slice(0, 10),
      from_account_id: "",
      to_account_id: "",
      amount: 0,
      reason: "",
      currency: "VND",
      exchange_rate: 1,
      transfer_type: "BANK_WITHDRAWAL",
    },

    async init() {
      mountAppShell("Chuyển quỹ", "/app/cash-transfers.html");
      await this.load();
    },

    async load() {
      this.loading = true;
      try {
        const cid = App.companyId();
        const res = await apiGet(`/cash/transfers?company_id=${cid}`);
        this.items = Array.isArray(res) ? res : (res.data || []);
      } catch (e) {
        console.error("load transfers:", e);
      } finally {
        this.loading = false;
      }
    },

    resetForm() {
      this.form = {
        transfer_date: new Date().toISOString().slice(0, 10),
        from_account_id: "",
        to_account_id: "",
        amount: 0,
        reason: "",
        currency: "VND",
        exchange_rate: 1,
        transfer_type: "BANK_WITHDRAWAL",
      };
    },

    async create() {
      this.saving = true;
      try {
        const cid = App.companyId();
        this.form.company_id = cid;
        await apiPost(`/cash/transfers?company_id=${cid}`, this.form);
        this.showForm = false;
        $store.app.flashSuccess("Tạo lệnh chuyển quỹ thành công");
        await this.load();
      } catch (e) {
        $store.app.flashError(e.error || "Lỗi tạo lệnh chuyển quỹ");
      } finally {
        this.saving = false;
      }
    },
  };
}
</script>

</body>
</html>
