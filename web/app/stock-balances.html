<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tồn kho · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng mặt hàng</p>
          <p class="text-2xl font-bold text-gray-900" x-text="balances.length"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng số lượng tồn</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(totalQty)"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng giá trị tồn</p>
          <p class="text-2xl font-bold text-green-700" x-text="fmtVND(totalValue) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Số kho</p>
          <p class="text-2xl font-bold text-purple-700" x-text="warehouseCount"></p>
        </div>
      </div>

      <!-- Filter -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kho</label>
            <select x-model="filterWarehouse" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả kho</option>
              <option value="KHO-01">Kho chính</option>
              <option value="KHO-02">Kho phụ</option>
              <option value="KHO-03">Kho TP.HCM</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tìm kiếm</label>
            <input type="text" x-model="search" placeholder="Mã hoặc tên hàng..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button @click="filterWarehouse=''; search='''" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700">Xoá lọc</button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách tồn kho</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' mục'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kho</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Đơn vị</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số lượng tồn</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Giá trị</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="b in filtered" :key="b.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="b.code"></td>
                  <td class="px-5 py-3 text-gray-900" x-text="b.name"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="b.warehouse"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="b.unit"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(b.quantity)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(b.value) + ' ₫'"></td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Không có dữ liệu tồn kho</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    balances: [],
    search: "",
    filterWarehouse: "",

    get filtered() {
      return this.balances.filter(b => {
        if (this.filterWarehouse && b.warehouse !== this.filterWarehouse) return false;
        if (this.search) {
          const q = this.search.toLowerCase();
          return b.code.toLowerCase().includes(q) || b.name.toLowerCase().includes(q);
        }
        return true;
      });
    },

    get totalQty() { return this.filtered.reduce((s, b) => s + (b.quantity || 0), 0); },
    get totalValue() { return this.filtered.reduce((s, b) => s + (b.value || 0), 0); },
    get warehouseCount() { return [...new Set(this.balances.map(b => b.warehouse))].length; },

    async init() {
      mountAppShell("Tồn kho", "/app/stock-balances.html");
      try {
        const cid = App.companyId();
        this.balances = await apiGet(`/warehouse/stock-balances?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("stock-balances init:", e);
      }
      if (!this.balances.length) {
        this.balances = [
          { id: "1", code: "PHAP-001", name: "Pháp quyển", warehouse: "KHO-01", unit: "Quyển", quantity: 120, value: 600000 },
          { id: "2", code: "BUT-002", name: "Bút bi", warehouse: "KHO-01", unit: "Cây", quantity: 350, value: 175000 },
          { id: "3", code: "SO-003", name: "Sổ tay", warehouse: "KHO-02", unit: "Quyển", quantity: 85, value: 425000 },
          { id: "4", code: "GIAY-004", name: "Giấy A4", warehouse: "KHO-01", unit: "Ream", quantity: 200, value: 1200000 },
          { id: "5", code: "MUC-005", name: "Mực in", warehouse: "KHO-03", unit: "Chai", quantity: 45, value: 900000 },
        ];
      }
    },
  };
}
</script>

</body>
</html>
