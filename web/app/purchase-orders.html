<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn đặt hàng mua · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Đơn đặt hàng mua</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Tạo PO</button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số PO</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Nhà cung cấp</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng tiền</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in items" :key="item.id">
              <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-5 py-3 font-medium text-blue-700" x-text="item.po_number"></td>
                <td class="px-5 py-3 text-gray-500" x-text="fmtDate(item.po_date)"></td>
                <td class="px-5 py-3 text-gray-700" x-text="item.supplier_name"></td>
                <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(item.total_amount)"></td>
                <td class="px-5 py-3" x-html="statusBadge(item.status)"></td>
                <td class="px-5 py-3 text-right">
                  <button @click="viewItem(item)" class="text-blue-700 hover:underline text-sm">Xem</button>
                </td>
              </tr>
            </template>
            <tr x-show="!items.length && !loading">
              <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chưa có đơn đặt hàng nào</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6" @click.stop>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Tạo đơn đặt hàng mua</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số PO</label>
                <input type="text" x-model="form.po_number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tự động">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày đặt</label>
                <input type="date" x-model="form.po_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhà cung cấp</label>
                <input type="text" x-model="form.supplier_name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tên nhà cung cấp">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Diễn giải</label>
                <input type="text" x-model="form.description" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Ghi chú">
              </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createItem()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="saving">
                <span x-show="!saving">Tạo</span>
                <span x-show="saving">Đang lưu...</span>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- View modal -->
      <template x-if="viewing">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="viewing = null">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6" @click.stop>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Chi tiết PO</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><span class="text-gray-500">Số PO:</span> <span class="font-medium" x-text="viewing.po_number"></span></div>
              <div><span class="text-gray-500">Ngày:</span> <span class="font-medium" x-text="fmtDate(viewing.po_date)"></span></div>
              <div class="col-span-2"><span class="text-gray-500">Nhà cung cấp:</span> <span class="font-medium" x-text="viewing.supplier_name"></span></div>
              <div class="col-span-2"><span class="text-gray-500">Diễn giải:</span> <span class="font-medium" x-text="viewing.description"></span></div>
              <div><span class="text-gray-500">Tổng tiền:</span> <span class="font-bold text-blue-700" x-text="fmtVND(viewing.total_amount) + ' ₫'"></span></div>
              <div><span class="text-gray-500">Trạng thái:</span> <span x-html="statusBadge(viewing.status)"></span></div>
            </div>
            <div class="flex justify-end mt-6">
              <button @click="viewing = null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Đóng</button>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

<script>
function comp() {
  return {
    items: [],
    loading: true,
    showCreate: false,
    viewing: null,
    saving: false,
    form: { po_number: "", po_date: "", supplier_name: "", description: "" },

    async init() {
      mountAppShell("Đơn đặt hàng mua", "/app/purchase-orders.html");
      await this.loadItems();
    },

    async loadItems() {
      this.loading = true;
      try {
        const cid = App.companyId();
        const data = await apiGet(`/purchase/orders?company_id=${cid}`);
        this.items = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách");
      }
      this.loading = false;
    },

    async createItem() {
      this.saving = true;
      try {
        const cid = App.companyId();
        const body = { ...this.form, company_id: cid };
        await apiPost(`/purchase/orders?company_id=${cid}`, body);
        this.showCreate = false;
        this.form = { po_number: "", po_date: "", supplier_name: "", description: "" };
        await this.loadItems();
        $store.app.flashSuccess("Tạo PO thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được PO");
      }
      this.saving = false;
    },

    viewItem(item) {
      this.viewing = item;
    },
  };
}
</script>

</body>
</html>
