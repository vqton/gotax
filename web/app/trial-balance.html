<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng cân đối phát sinh · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Bảng cân đối phát sinh</h2>
        <button @click="window.print()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          In báo cáo
        </button>
      </div>

      <!-- Year/Month selectors -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Năm</label>
            <select x-model.number="year" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="y in yearOptions" :key="y">
                <option :value="y" x-text="y"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng</label>
            <select x-model.number="month" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <template x-for="m in 12" :key="m">
                <option :value="m" x-text="'Tháng ' + m"></option>
              </template>
            </select>
          </div>
          <button @click="loadReport()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">Xem báo cáo</button>
        </div>
      </div>

      <!-- Report table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Bảng cân đối phát sinh — Tháng <span x-text="month"></span>/<span x-text="year"></span></h3>
          <span class="text-xs text-gray-400" x-text="rows.length + ' tài khoản'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã TK</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên tài khoản</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Phát sinh nợ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Phát sinh có</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số dư nợ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số dư có</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in rows" :key="r.account_code">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="r.account_code"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.account_name"></td>
                  <td class="px-5 py-3 text-right tabular-nums" x-text="fmtVND(r.debit_turnover)"></td>
                  <td class="px-5 py-3 text-right tabular-nums" x-text="fmtVND(r.credit_turnover)"></td>
                  <td class="px-5 py-3 text-right font-medium tabular-nums text-gray-900" x-text="fmtVND(r.debit_balance)"></td>
                  <td class="px-5 py-3 text-right font-medium tabular-nums text-gray-900" x-text="fmtVND(r.credit_balance)"></td>
                </tr>
              </template>
              <tr x-show="!rows.length && !loading">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chọn năm và tháng để xem báo cáo</td>
              </tr>
            </tbody>
            <tfoot x-show="rows.length" class="bg-gray-100 border-t-2 border-gray-300">
              <tr>
                <td colspan="2" class="px-5 py-3 text-sm font-bold text-gray-900">Tổng cộng</td>
                <td class="px-5 py-3 text-right text-sm font-bold tabular-nums" x-text="fmtVND(totalDebitTurnover)"></td>
                <td class="px-5 py-3 text-right text-sm font-bold tabular-nums" x-text="fmtVND(totalCreditTurnover)"></td>
                <td class="px-5 py-3 text-right text-sm font-bold tabular-nums" x-text="fmtVND(totalDebitBalance)"></td>
                <td class="px-5 py-3 text-right text-sm font-bold tabular-nums" x-text="fmtVND(totalCreditBalance)"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  const now = new Date();
  return {
    rows: [],
    loading: false,
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    yearOptions: Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i),

    get totalDebitTurnover() { return this.rows.reduce((s, r) => s + (r.debit_turnover || 0), 0); },
    get totalCreditTurnover() { return this.rows.reduce((s, r) => s + (r.credit_turnover || 0), 0); },
    get totalDebitBalance() { return this.rows.reduce((s, r) => s + (r.debit_balance || 0), 0); },
    get totalCreditBalance() { return this.rows.reduce((s, r) => s + (r.credit_balance || 0), 0); },

    async init() {
      mountAppShell("Bảng cân đối phát sinh", "/app/trial-balance.html");
    },

    async loadReport() {
      this.loading = true;
      this.rows = [];
      try {
        const data = await apiGet(`/reports/trial-balance?year=${this.year}&month=${this.month}`);
        this.rows = Array.isArray(data) ? data : data.items || data.rows || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được báo cáo");
      }
      this.loading = false;
    },
  };
}
</script>

</body>
</html>
