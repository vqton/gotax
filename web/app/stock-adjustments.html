<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều chỉnh tồn kho · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold text-gray-900">Điều chỉnh tồn kho</h1>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Lập phiếu điều chỉnh</button>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg" @click.stop>
            <h2 class="text-lg font-bold mb-4">Phiếu điều chỉnh mới</h2>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Lý do điều chỉnh</label>
              <select x-model="form.reason" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Chọn lý do</option>
                <option value="Kiểm kê">Kiểm kê</option>
                <option value="Hư hỏng">Hư hỏng</option>
                <option value="Mất cắp">Mất cắp</option>
                <option value="Điều chỉnh">Điều chỉnh</option>
              </select>
            </div>
            <div class="mb-4">
              <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-medium text-gray-700">Chi tiết mặt hàng</label>
                <button @click="form.items.push({product: '', qty: 0, note: ''})" class="text-sm text-blue-700 hover:underline">+ Thêm dòng</button>
              </div>
              <template x-for="(item, idx) in form.items" :key="idx">
                <div class="flex items-center gap-2 mb-2">
                  <input type="text" x-model="item.product" placeholder="Mặt hàng" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="number" x-model.number="item.qty" placeholder="SL +/-" class="w-24 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <input type="text" x-model="item.note" placeholder="Ghi chú" class="w-32 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <button @click="form.items.splice(idx, 1)" class="text-red-400 hover:text-red-600 text-sm">✕</button>
                </div>
              </template>
              <p x-show="!form.items.length" class="text-sm text-gray-400">Chưa có mặt hàng</p>
            </div>
            <div class="flex justify-end gap-2">
              <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createAdjustment()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Tạo phiếu</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách phiếu điều chỉnh</h3>
          <span class="text-xs text-gray-400" x-text="adjustments.length + ' phiếu'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số phiếu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Lý do</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số mặt hàng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="a in adjustments" :key="a.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="a.adjustment_number || a.number"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(a.date || a.created_at)"></td>
                  <td class="px-5 py-3">
                    <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-blue-100 text-blue-700': a.reason === 'Kiểm kê',
                        'bg-red-100 text-red-700': a.reason === 'Hư hỏng',
                        'bg-amber-100 text-amber-700': a.reason === 'Mất cắp',
                        'bg-gray-100 text-gray-700': a.reason === 'Điều chỉnh',
                      }" x-text="a.reason"></span>
                  </td>
                  <td class="px-5 py-3 text-right font-medium" x-text="a.item_count || (a.items ? a.items.length : 0)"></td>
                  <td class="px-5 py-3" x-html="statusBadge(a.status || 'DRAFT')"></td>
                </tr>
              </template>
              <tr x-show="!adjustments.length">
                <td colspan="5" class="px-5 py-8 text-center text-gray-400">Chưa có phiếu điều chỉnh nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    adjustments: [],
    showCreate: false,
    form: {
      reason: "",
      items: [{ product: "", qty: 0, note: "" }],
    },

    async init() {
      mountAppShell("Điều chỉnh tồn kho", "/app/stock-adjustments.html");
      try {
        const cid = App.companyId();
        this.adjustments = await apiGet(`/warehouse/stock-adjustments?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("stock-adjustments init:", e);
      }
      if (!this.adjustments.length) {
        this.adjustments = [
          { id: "1", adjustment_number: "DC-001/25", date: "2025-07-10", reason: "Kiểm kê", item_count: 5, status: "POSTED" },
          { id: "2", adjustment_number: "DC-002/25", date: "2025-07-25", reason: "Hư hỏng", item_count: 2, status: "DRAFT" },
          { id: "3", adjustment_number: "DC-003/25", date: "2025-08-02", reason: "Mất cắp", item_count: 1, status: "DRAFT" },
        ];
      }
    },

    async createAdjustment() {
      if (!this.form.reason) {
        $store.app.flashError("Vui lòng chọn lý do điều chỉnh");
        return;
      }
      if (!this.form.items.length) {
        $store.app.flashError("Vui lòng thêm ít nhất một mặt hàng");
        return;
      }
      try {
        const cid = App.companyId();
        await apiPost(`/warehouse/stock-adjustments?company_id=${cid}`, this.form);
        this.showCreate = false;
        this.form = { reason: "", items: [{ product: "", qty: 0, note: "" }] };
        this.adjustments = await apiGet(`/warehouse/stock-adjustments?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Tạo phiếu điều chỉnh thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được phiếu");
      }
    },
  };
}
</script>

</body>
</html>
