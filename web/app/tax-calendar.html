<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch thuế · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Quá hạn</p>
          <p class="text-2xl font-bold text-red-700" x-text="overdueCount"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Sắp đến hạn</p>
          <p class="text-2xl font-bold text-amber-700" x-text="upcomingCount"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Đã hoàn thành</p>
          <p class="text-2xl font-bold text-green-700" x-text="completedCount"></p>
        </div>
      </div>

      <!-- Legend -->
      <div class="flex items-center gap-4 mb-4 text-sm">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500"></span> Quá hạn</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> Sắp đến hạn</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-green-500"></span> Đã nộp</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-gray-300"></span> Chưa đến hạn</div>
      </div>

      <!-- Filter -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
            <input type="number" x-model.number="filterYear" min="2024" class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Loại thuế</label>
            <select x-model="filterTax" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả</option>
              <option value="VAT">Thuế GTGT</option>
              <option value="CIT">Thuế TNDN</option>
              <option value="PIT">Thuế TNCN</option>
            </select>
          </div>
          <button @click="filterYear = new Date().getFullYear(); filterTax=''" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700">Đặt lại</button>
        </div>
      </div>

      <!-- Calendar table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100">
          <h3 class="text-sm font-semibold text-gray-700">Lịch thuế năm <span x-text="filterYear"></span></h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Loại thuế</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kỳ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Hạn nộp</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ghi chú</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in filtered" :key="item.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3">
                    <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-blue-100 text-blue-700': item.tax_type === 'VAT',
                        'bg-green-100 text-green-700': item.tax_type === 'CIT',
                        'bg-purple-100 text-purple-700': item.tax_type === 'PIT',
                      }" x-text="item.tax_type"></span>
                  </td>
                  <td class="px-5 py-3 font-medium" x-text="item.period_label"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="fmtDate(item.due_date)"></td>
                  <td class="px-5 py-3">
                    <div class="flex items-center gap-2">
                      <span class="w-2.5 h-2.5 rounded-full flex-shrink-0"
                        :class="{
                          'bg-red-500': item.status === 'overdue',
                          'bg-amber-500': item.status === 'upcoming',
                          'bg-green-500': item.status === 'done',
                          'bg-gray-300': item.status === 'pending',
                        }"></span>
                      <span x-text="item.status_label"></span>
                    </div>
                  </td>
                  <td class="px-5 py-3 text-gray-500 text-xs" x-text="item.note || '—'"></td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="5" class="px-5 py-8 text-center text-gray-400">Không có dữ liệu lịch thuế</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    calendar: [],
    filterYear: new Date().getFullYear(),
    filterTax: "",

    get filtered() {
      return this.calendar.filter(c => {
        if (c.year !== this.filterYear) return false;
        if (this.filterTax && c.tax_type !== this.filterTax) return false;
        return true;
      });
    },

    get overdueCount() { return this.filtered.filter(c => c.status === "overdue").length; },
    get upcomingCount() { return this.filtered.filter(c => c.status === "upcoming").length; },
    get completedCount() { return this.filtered.filter(c => c.status === "done").length; },

    async init() {
      mountAppShell("Lịch thuế", "/app/tax-calendar.html");
      try {
        const cid = App.companyId();
        this.calendar = await apiGet(`/tax/calendar?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("tax-calendar init:", e);
      }
      if (!this.calendar.length) {
        const now = new Date();
        const year = now.getFullYear();
        this.calendar = [
          { id: "1",  tax_type: "VAT", period_label: "Quý I/" + year, year: year, due_date: `${year}-04-30`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "2",  tax_type: "VAT", period_label: "Quý II/" + year, year: year, due_date: `${year}-07-30`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "3",  tax_type: "VAT", period_label: "Quý III/" + year, year: year, due_date: `${year}-10-30`, status: "upcoming", status_label: "Sắp đến hạn", note: "03 tháng 7-9" },
          { id: "4",  tax_type: "VAT", period_label: "Quý IV/" + year, year: year, due_date: `${year + 1}-01-30`, status: "pending", status_label: "Chưa đến hạn", note: "" },
          { id: "5",  tax_type: "CIT", period_label: "Quý I/" + year, year: year, due_date: `${year}-04-30`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "6",  tax_type: "CIT", period_label: "Quý II/" + year, year: year, due_date: `${year}-07-30`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "7",  tax_type: "CIT", period_label: "Quý III/" + year, year: year, due_date: `${year}-10-30`, status: "upcoming", status_label: "Sắp đến hạn", note: "" },
          { id: "8",  tax_type: "CIT", period_label: "Quý IV/" + year, year: year, due_date: `${year + 1}-01-30`, status: "pending", status_label: "Chưa đến hạn", note: "" },
          { id: "9",  tax_type: "PIT", period_label: "Tháng 1-" + year, year: year, due_date: `${year}-02-20`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "10", tax_type: "PIT", period_label: "Tháng 6/" + year, year: year, due_date: `${year}-07-20`, status: "done", status_label: "Đã nộp", note: "" },
          { id: "11", tax_type: "PIT", period_label: "Năm " + year, year: year, due_date: `${year + 1}-03-31`, status: "pending", status_label: "Chưa đến hạn", note: "TNCN quyết toán năm" },
        ];
      }
    },
  };
}
</script>

</body>
</html>
