<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiếu xuất kho · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Phiếu xuất kho</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Tạo PXK</button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số PXK</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Đơn hàng</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Khách hàng</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng tiền</th>
              <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
              <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in items" :key="item.id">
              <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-5 py-3 font-medium text-blue-700" x-text="item.delivery_note_number"></td>
                <td class="px-5 py-3 text-gray-500" x-text="fmtDate(item.delivery_date)"></td>
                <td class="px-5 py-3 text-gray-700" x-text="item.so_number || item.so_id"></td>
                <td class="px-5 py-3 text-gray-700" x-text="item.customer_name"></td>
                <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(item.total_amount)"></td>
                <td class="px-5 py-3" x-html="statusBadge(item.status)"></td>
                <td class="px-5 py-3 text-right space-x-2">
                  <template x-if="item.status === 'DRAFT'">
                    <button @click="postItem(item)" class="text-green-700 hover:underline text-sm">Ghi sổ</button>
                  </template>
                  <button @click="viewItem(item)" class="text-blue-700 hover:underline text-sm">Xem</button>
                </td>
              </tr>
            </template>
            <tr x-show="!items.length && !loading">
              <td colspan="7" class="px-5 py-8 text-center text-gray-400">Chưa có phiếu xuất kho nào</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-6" @click.stop>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Tạo phiếu xuất kho</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số PXK</label>
                <input type="text" x-model="form.delivery_note_number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Tự động">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày xuất kho</label>
                <input type="date" x-model="form.delivery_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Đơn hàng bán (SO)</label>
                <select x-model="form.so_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">-- Chọn đơn hàng --</option>
                  <template x-for="so in salesOrders" :key="so.id">
                    <option :value="so.id" x-text="so.order_number + ' — ' + so.customer_name"></option>
                  </template>
                </select>
              </div>
            </div>

            <!-- Lines -->
            <div class="mt-4">
              <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-medium text-gray-700">Chi tiết xuất kho</label>
                <button @click="addLine()" type="button" class="text-blue-700 hover:underline text-sm">+ Thêm dòng</button>
              </div>
              <div class="border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full text-sm">
                  <thead class="bg-gray-50">
                    <tr>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">Sản phẩm</th>
                      <th class="text-right px-3 py-2 font-medium text-gray-600">Số lượng</th>
                      <th class="text-right px-3 py-2 font-medium text-gray-600">Đơn giá</th>
                      <th class="text-right px-3 py-2 font-medium text-gray-600">Thành tiền</th>
                      <th class="w-10"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(line, idx) in form.lines" :key="idx">
                      <tr class="border-t border-gray-100">
                        <td class="px-3 py-2">
                          <input type="text" x-model="line.product_name" class="w-full border border-gray-200 rounded px-2 py-1 text-sm" placeholder="Tên sản phẩm">
                        </td>
                        <td class="px-3 py-2">
                          <input type="number" x-model.number="line.quantity" min="0" class="w-full border border-gray-200 rounded px-2 py-1 text-sm text-right">
                        </td>
                        <td class="px-3 py-2">
                          <input type="number" x-model.number="line.unit_price" min="0" class="w-full border border-gray-200 rounded px-2 py-1 text-sm text-right">
                        </td>
                        <td class="px-3 py-2 text-right text-sm font-medium" x-text="fmtVND((line.quantity || 0) * (line.unit_price || 0))"></td>
                        <td class="px-3 py-2 text-center">
                          <button @click="form.lines.splice(idx, 1)" class="text-red-400 hover:text-red-600" type="button">&times;</button>
                        </td>
                      </tr>
                    </template>
                    <tr x-show="!form.lines.length">
                      <td colspan="5" class="px-3 py-4 text-center text-gray-400 text-sm">Chưa có dòng nào</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="text-right mt-2 text-sm font-bold text-gray-900">
                Tổng cộng: <span x-text="fmtVND(lineTotal())"></span> ₫
              </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createItem()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition" :disabled="saving">
                <span x-show="!saving">Tạo</span>
                <span x-show="saving">Đang lưu...</span>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- View modal -->
      <template x-if="viewing">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="viewing = null">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6" @click.stop>
            <h3 class="text-lg font-bold text-gray-900 mb-4">Chi tiết phiếu xuất kho</h3>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div><span class="text-gray-500">Số PXK:</span> <span class="font-medium" x-text="viewing.delivery_note_number"></span></div>
              <div><span class="text-gray-500">Ngày:</span> <span class="font-medium" x-text="fmtDate(viewing.delivery_date)"></span></div>
              <div><span class="text-gray-500">Đơn hàng:</span> <span class="font-medium" x-text="viewing.so_number || viewing.so_id"></span></div>
              <div><span class="text-gray-500">Khách hàng:</span> <span class="font-medium" x-text="viewing.customer_name"></span></div>
              <div class="col-span-2"><span class="text-gray-500">Tổng tiền:</span> <span class="font-bold text-blue-700" x-text="fmtVND(viewing.total_amount) + ' ₫'"></span></div>
              <div><span class="text-gray-500">Trạng thái:</span> <span x-html="statusBadge(viewing.status)"></span></div>
            </div>
            <div class="flex justify-end mt-6">
              <button @click="viewing = null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Đóng</button>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

<script>
function comp() {
  return {
    items: [],
    salesOrders: [],
    loading: true,
    showCreate: false,
    viewing: null,
    saving: false,
    form: { delivery_note_number: "", delivery_date: "", so_id: "", lines: [] },

    async init() {
      mountAppShell("Phiếu xuất kho", "/app/delivery-notes.html");
      await Promise.all([this.loadItems(), this.loadSOs()]);
    },

    async loadItems() {
      this.loading = true;
      try {
        const cid = App.companyId();
        const data = await apiGet(`/sale/delivery-notes?company_id=${cid}`);
        this.items = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách");
      }
      this.loading = false;
    },

    async loadSOs() {
      try {
        const cid = App.companyId();
        const data = await apiGet(`/sale/orders?company_id=${cid}`);
        this.salesOrders = Array.isArray(data) ? data : data.items || [];
      } catch (e) { /* silent */ }
    },

    openCreate() {
      this.form = { delivery_note_number: "", delivery_date: "", so_id: "", lines: [] };
      this.showCreate = true;
    },

    addLine() {
      this.form.lines.push({ product_name: "", quantity: 1, unit_price: 0 });
    },

    lineTotal() {
      return this.form.lines.reduce((s, l) => s + (l.quantity || 0) * (l.unit_price || 0), 0);
    },

    async createItem() {
      this.saving = true;
      try {
        const cid = App.companyId();
        const body = {
          delivery_note_number: this.form.delivery_note_number,
          delivery_date: this.form.delivery_date,
          so_id: this.form.so_id || null,
          lines: this.form.lines.map(l => ({
            product_name: l.product_name,
            quantity: l.quantity,
            unit_price: l.unit_price,
          })),
          total_amount: this.lineTotal(),
        };
        await apiPost(`/sale/delivery-notes?company_id=${cid}`, body);
        this.showCreate = false;
        await this.loadItems();
        $store.app.flashSuccess("Tạo PXK thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được PXK");
      }
      this.saving = false;
    },

    async postItem(item) {
      if (!App.confirm(`Ghi sổ PXK ${item.delivery_note_number}?`)) return;
      try {
        const cid = App.companyId();
        await apiPut(`/sale/delivery-notes/${item.id}/post?company_id=${cid}`, {});
        await this.loadItems();
        $store.app.flashSuccess(`Đã ghi sổ ${item.delivery_note_number}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không ghi sổ được");
      }
    },

    viewItem(item) {
      this.viewing = item;
    },
  };
}
</script>

</body>
</html>
