<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chứng từ kế toán · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Chứng từ kế toán</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Lập chứng từ</button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Trạng thái</label>
            <select x-model="filterStatus" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả</option>
              <option value="DRAFT">Nháp</option>
              <option value="SUBMITTED">Đã gửi</option>
              <option value="APPROVED">Đã duyệt</option>
              <option value="POSTED">Đã ghi sổ</option>
              <option value="CANCELLED">Đã hủy</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Từ ngày</label>
            <input type="date" x-model="filterFrom" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Đến ngày</label>
            <input type="date" x-model="filterTo" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button @click="loadEntries()" class="px-3 py-2 text-sm text-blue-700 hover:bg-blue-50 rounded-lg transition">Lọc</button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách chứng từ</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' chứng từ'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số CT</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Diễn giải</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng nợ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng có</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="e in filtered" :key="e.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700 cursor-pointer hover:underline" @click="viewEntry(e)" x-text="e.entry_number"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(e.entry_date)"></td>
                  <td class="px-5 py-3 text-gray-700 max-w-xs truncate" x-text="e.description"></td>
                  <td class="px-5 py-3" x-html="statusBadge(e.status)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(e.total_debit)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(e.total_credit)"></td>
                  <td class="px-5 py-3 text-right space-x-2">
                    <template x-if="e.status === 'DRAFT'">
                      <button @click="submitEntry(e)" class="text-amber-700 hover:underline text-xs">Gửi</button>
                    </template>
                    <template x-if="e.status === 'SUBMITTED'">
                      <button @click="approveEntry(e)" class="text-green-700 hover:underline text-xs">Duyệt</button>
                    </template>
                    <template x-if="e.status === 'APPROVED'">
                      <button @click="postEntry(e)" class="text-blue-700 hover:underline text-xs">Ghi sổ</button>
                    </template>
                    <template x-if="e.status !== 'POSTED' && e.status !== 'CANCELLED'">
                      <button @click="cancelEntry(e)" class="text-red-600 hover:underline text-xs">Hủy</button>
                    </template>
                    <button @click="viewEntry(e)" class="text-gray-500 hover:underline text-xs">Xem</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length && !loading">
                <td colspan="7" class="px-5 py-8 text-center text-gray-400">Chưa có chứng từ nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6" @click.stop>
        <h3 class="text-lg font-bold text-gray-900 mb-4">Lập chứng từ mới</h3>
        <div class="grid grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Ngày chứng từ <span class="text-red-500">*</span></label>
            <input type="date" x-model="form.entry_date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Loại chứng từ</label>
            <select x-model="form.voucher_type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="General">Chung</option>
              <option value="Sales">Bán hàng</option>
              <option value="Purchase">Mua hàng</option>
              <option value="Cash">Tiền mặt</option>
              <option value="Bank">Ngân hàng</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Diễn giải</label>
            <input type="text" x-model="form.description" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Diễn giải chứng từ">
          </div>
        </div>

        <!-- Lines -->
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <h4 class="text-sm font-semibold text-gray-700">Hạch toán</h4>
            <button @click="addLine()" class="text-xs text-blue-700 hover:underline">+ Thêm dòng</button>
          </div>
          <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-3 py-2 font-medium text-gray-600 w-28">Mã TK</th>
                <th class="text-left px-3 py-2 font-medium text-gray-600">Diễn giải</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600 w-32">Nợ</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600 w-32">Có</th>
                <th class="w-10"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(line, idx) in form.lines" :key="idx">
                <tr class="border-t border-gray-100">
                  <td class="px-3 py-1.5"><input type="text" x-model="line.account_code" class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:ring-2 focus:ring-blue-500" placeholder="1111"></td>
                  <td class="px-3 py-1.5"><input type="text" x-model="line.description" class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:ring-2 focus:ring-blue-500"></td>
                  <td class="px-3 py-1.5"><input type="number" x-model.number="line.debit" min="0" class="w-full border border-gray-200 rounded px-2 py-1 text-xs text-right focus:ring-2 focus:ring-blue-500" placeholder="0"></td>
                  <td class="px-3 py-1.5"><input type="number" x-model.number="line.credit" min="0" class="w-full border border-gray-200 rounded px-2 py-1 text-xs text-right focus:ring-2 focus:ring-blue-500" placeholder="0"></td>
                  <td class="px-3 py-1.5 text-center">
                    <button @click="removeLine(idx)" class="text-red-400 hover:text-red-600 text-xs" x-show="form.lines.length > 2">&times;</button>
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200">
              <tr>
                <td colspan="2" class="px-3 py-2 text-xs font-semibold text-gray-600 text-right">Tổng cộng</td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(totalDebit)"></td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(totalCredit)"></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
          <p class="text-xs mt-2" :class="totalDebit === totalCredit ? 'text-green-600' : 'text-red-600'" x-show="totalDebit > 0 || totalCredit > 0"
             x-text="totalDebit === totalCredit ? '✓ Cân đối' : '✗ Chưa cân đối'"></p>
        </div>

        <div class="flex justify-end gap-2">
          <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createEntry()" class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition" :disabled="saving">
            <span x-show="!saving">Tạo chứng từ</span>
            <span x-show="saving">Đang lưu...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- View modal -->
  <template x-if="viewing">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="viewing = null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6" @click.stop>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-gray-900">Chi tiết chứng từ</h3>
          <span x-html="statusBadge(viewing.status)"></span>
        </div>
        <div class="grid grid-cols-3 gap-3 text-sm mb-4">
          <div><span class="text-gray-500">Số CT:</span> <span class="font-medium" x-text="viewing.entry_number"></span></div>
          <div><span class="text-gray-500">Ngày:</span> <span class="font-medium" x-text="fmtDate(viewing.entry_date)"></span></div>
          <div><span class="text-gray-500">Loại:</span> <span class="font-medium" x-text="viewing.voucher_type || 'Chung'"></span></div>
          <div class="col-span-3"><span class="text-gray-500">Diễn giải:</span> <span class="font-medium" x-text="viewing.description"></span></div>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-semibold text-gray-700 mb-2">Chi tiết hạch toán</h4>
          <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-3 py-2 font-medium text-gray-600">Mã TK</th>
                <th class="text-left px-3 py-2 font-medium text-gray-600">Diễn giải</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600">Nợ</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600">Có</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="line in (viewing.lines || [])" :key="line.id || line.account_code">
                <tr class="border-t border-gray-100">
                  <td class="px-3 py-2 font-medium" x-text="line.account_code"></td>
                  <td class="px-3 py-2 text-gray-600" x-text="line.description"></td>
                  <td class="px-3 py-2 text-right" x-text="fmtVND(line.debit)"></td>
                  <td class="px-3 py-2 text-right" x-text="fmtVND(line.credit)"></td>
                </tr>
              </template>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200">
              <tr>
                <td colspan="2" class="px-3 py-2 text-xs font-semibold text-right">Tổng</td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(viewing.total_debit)"></td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(viewing.total_credit)"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="flex justify-end">
          <button @click="viewing = null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Đóng</button>
        </div>
      </div>
    </div>
  </template>

<script>
function comp() {
  return {
    entries: [],
    loading: true,
    showCreate: false,
    viewing: null,
    saving: false,
    filterStatus: "",
    filterFrom: "",
    filterTo: "",
    form: {
      entry_date: new Date().toISOString().slice(0, 10),
      description: "",
      voucher_type: "General",
      lines: [
        { account_code: "", description: "", debit: 0, credit: 0 },
        { account_code: "", description: "", debit: 0, credit: 0 },
      ],
    },

    get filtered() {
      return this.entries.filter(e => {
        if (this.filterStatus && e.status !== this.filterStatus) return false;
        return true;
      });
    },

    get totalDebit() { return this.form.lines.reduce((s, l) => s + (l.debit || 0), 0); },
    get totalCredit() { return this.form.lines.reduce((s, l) => s + (l.credit || 0), 0); },

    async init() {
      mountAppShell("Chứng từ kế toán", "/app/journal-entries.html");
      await this.loadEntries();
    },

    async loadEntries() {
      this.loading = true;
      try {
        let url = "/journal-entries";
        const params = [];
        if (this.filterFrom && this.filterTo) {
          params.push(`from=${this.filterFrom}`, `to=${this.filterTo}`);
        } else if (this.filterStatus) {
          params.push(`status=${this.filterStatus}`);
        }
        if (params.length) url += "?" + params.join("&");
        const data = await apiGet(url);
        this.entries = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách chứng từ");
      }
      this.loading = false;
    },

    openCreate() {
      this.form = {
        entry_date: new Date().toISOString().slice(0, 10),
        description: "",
        voucher_type: "General",
        lines: [
          { account_code: "", description: "", debit: 0, credit: 0 },
          { account_code: "", description: "", debit: 0, credit: 0 },
        ],
      };
      this.showCreate = true;
    },

    addLine() {
      this.form.lines.push({ account_code: "", description: "", debit: 0, credit: 0 });
    },

    removeLine(idx) {
      if (this.form.lines.length > 2) this.form.lines.splice(idx, 1);
    },

    async createEntry() {
      if (!this.form.entry_date) {
        $store.app.flashError("Ngày chứng từ là bắt buộc");
        return;
      }
      const validLines = this.form.lines.filter(l => l.account_code);
      if (validLines.length < 2) {
        $store.app.flashError("Cần ít nhất 2 dòng hạch toán");
        return;
      }
      this.saving = true;
      try {
        await apiPost("/journal-entries", { ...this.form, lines: validLines });
        this.showCreate = false;
        await this.loadEntries();
        $store.app.flashSuccess("Tạo chứng từ thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được chứng từ");
      }
      this.saving = false;
    },

    async submitEntry(e) {
      if (!App.confirm(`Gửi chứng từ ${e.entry_number} để duyệt?`)) return;
      try {
        await apiPost(`/journal-entries/${e.id}/submit`, {});
        await this.loadEntries();
        $store.app.flashSuccess(`Đã gửi ${e.entry_number}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không gửi được");
      }
    },

    async approveEntry(e) {
      if (!App.confirm(`Duyệt chứng từ ${e.entry_number}?`)) return;
      try {
        await apiPost(`/journal-entries/${e.id}/approve`, {});
        await this.loadEntries();
        $store.app.flashSuccess(`Đã duyệt ${e.entry_number}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không duyệt được");
      }
    },

    async postEntry(e) {
      if (!App.confirm(`Ghi sổ chứng từ ${e.entry_number}?`)) return;
      try {
        await apiPost(`/journal-entries/${e.id}/post`, {});
        await this.loadEntries();
        $store.app.flashSuccess(`Đã ghi sổ ${e.entry_number}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không ghi sổ được");
      }
    },

    async cancelEntry(e) {
      if (!App.confirm(`Hủy chứng từ ${e.entry_number}?`)) return;
      try {
        await apiPost(`/journal-entries/${e.id}/cancel`, {});
        await this.loadEntries();
        $store.app.flashSuccess(`Đã hủy ${e.entry_number}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không hủy được");
      }
    },

    async viewEntry(e) {
      try {
        const data = await apiGet(`/journal-entries/${e.id}`);
        this.viewing = data;
      } catch (err) {
        this.viewing = e;
      }
    },
  };
}
</script>

</body>
</html>
