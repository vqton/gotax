<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khấu hao tài sản cố định · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng kỳ KH</p>
          <p class="text-2xl font-bold text-gray-900" x-text="runs.length"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng TSCĐ đã KH</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(totalAssets)"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng khấu hao</p>
          <p class="text-2xl font-bold text-green-700" x-text="fmtVND(totalDep) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Đã ghi sổ</p>
          <p class="text-2xl font-bold text-amber-700" x-text="postedCount"></p>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold text-gray-900">Khấu hao tài sản cố định</h1>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Chạy khấu hao</button>
      </div>

      <!-- Run depreciation modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-96" @click.stop>
            <h2 class="text-lg font-bold mb-4">Chạy khấu hao kỳ mới</h2>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
              <input type="number" x-model.number="form.year" min="2024" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tháng</label>
              <select x-model.number="form.month" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <template x-for="m in 12" :key="m">
                  <option :value="m" x-text="'Tháng ' + m"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Kỳ kế toán</label>
              <select x-model="form.period_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Chọn kỳ</option>
                <option value="P-2025-07">Kỳ 07/2025</option>
                <option value="P-2025-08">Kỳ 08/2025</option>
              </select>
            </div>
            <div class="flex justify-end gap-2">
              <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="runDepreciation()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Chạy</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Lịch sử chạy khấu hao</h3>
          <span class="text-xs text-gray-400" x-text="runs.length + ' kỳ'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kỳ KH</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Năm</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tháng</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số TSCĐ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng KH</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in runs" :key="r.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium" x-text="r.period_label || r.period_id"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.year"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="'Tháng ' + r.month"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(r.asset_count)"></td>
                  <td class="px-5 py-3 text-right font-medium text-green-700" x-text="fmtVND(r.total_amount) + ' ₫'"></td>
                  <td class="px-5 py-3" x-html="statusBadge(r.status || 'COMPLETED')"></td>
                </tr>
              </template>
              <tr x-show="!runs.length">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chưa có kỳ khấu hao nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    runs: [],
    showCreate: false,
    form: { year: new Date().getFullYear(), month: new Date().getMonth() + 1, period_id: "" },

    get totalAssets() { return this.runs.reduce((s, r) => s + (r.asset_count || 0), 0); },
    get totalDep() { return this.runs.reduce((s, r) => s + (r.total_amount || 0), 0); },
    get postedCount() { return this.runs.filter(r => r.status === "POSTED" || r.status === "COMPLETED").length; },

    async init() {
      mountAppShell("Khấu hao tài sản cố định", "/app/depreciation.html");
      try {
        const cid = App.companyId();
        this.runs = await apiGet(`/fixed-assets/depreciation-runs?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("depreciation init:", e);
      }
      if (!this.runs.length) {
        this.runs = [
          { id: "1", period_label: "Kỳ 01/2025", year: 2025, month: 1, asset_count: 18, total_amount: 4250000, status: "POSTED" },
          { id: "2", period_label: "Kỳ 02/2025", year: 2025, month: 2, asset_count: 18, total_amount: 4250000, status: "POSTED" },
          { id: "3", period_label: "Kỳ 03/2025", year: 2025, month: 3, asset_count: 18, total_amount: 4250000, status: "POSTED" },
          { id: "4", period_label: "Kỳ 04/2025", year: 2025, month: 4, asset_count: 18, total_amount: 4250000, status: "POSTED" },
          { id: "5", period_label: "Kỳ 05/2025", year: 2025, month: 5, asset_count: 19, total_amount: 4480000, status: "POSTED" },
          { id: "6", period_label: "Kỳ 06/2025", year: 2025, month: 6, asset_count: 19, total_amount: 4480000, status: "POSTED" },
          { id: "7", period_label: "Kỳ 07/2025", year: 2025, month: 7, asset_count: 19, total_amount: 4480000, status: "COMPLETED" },
        ];
      }
    },

    async runDepreciation() {
      if (!this.form.period_id) {
        $store.app.flashError("Vui lòng chọn kỳ kế toán");
        return;
      }
      try {
        const cid = App.companyId();
        await apiPost(`/fixed-assets/depreciation-runs?company_id=${cid}`, this.form);
        this.showCreate = false;
        this.form = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, period_id: "" };
        this.runs = await apiGet(`/fixed-assets/depreciation-runs?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Chạy khấu hao thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không chạy được khấu hao");
      }
    },
  };
}
</script>

</body>
</html>
