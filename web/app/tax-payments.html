<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán thuế · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng thanh toán</p>
          <p class="text-2xl font-bold text-gray-900" x-text="summary.total_payments"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng khai báo</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(summary.total_declared) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Đã nộp</p>
          <p class="text-2xl font-bold text-green-700" x-text="fmtVND(summary.total_paid) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Chưa nộp</p>
          <p class="text-2xl font-bold text-amber-700" x-text="fmtVND(summary.total_outstanding) + ' ₫'"></p>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold text-gray-900">Thanh toán thuế</h1>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Tạo thanh toán</button>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-96" @click.stop>
            <h2 class="text-lg font-bold mb-4">Tạo thanh toán mới</h2>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Loại thuế</label>
              <select x-model="form.tax_type" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="VAT">Thuế GTGT</option>
                <option value="CIT">Thuế TNDN</option>
                <option value="PIT">Thuế TNCN</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
                <input type="number" x-model.number="form.period_year" min="2024" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kỳ</label>
                <input type="number" x-model.number="form.period_number" min="1" max="13" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền khai báo</label>
                <input type="number" x-model.number="form.declared_amount" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Hạn nộp</label>
                <input type="date" x-model="form.due_date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
              <input type="text" x-model="form.notes" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tuỳ chọn">
            </div>
            <div class="flex justify-end gap-2">
              <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createPayment()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Tạo</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Record payment modal -->
      <template x-if="showRecord">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showRecord=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-96" @click.stop>
            <h2 class="text-lg font-bold mb-4">Ghi nhận nộp thuế</h2>
            <p class="text-sm text-gray-500 mb-4">Phải thu: <span class="font-semibold" x-text="fmtVND(recordTarget.declared_amount) + ' ₫'"></span></p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền nộp</label>
              <input type="number" x-model.number="recordForm.amount" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Ngày nộp</label>
              <input type="date" x-model="recordForm.date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Mã giao dịch</label>
              <input type="text" x-model="recordForm.reference" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tuỳ chọn">
            </div>
            <div class="flex justify-end gap-2">
              <button @click="showRecord=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="recordPayment()" class="px-4 py-2 bg-green-700 text-white rounded-lg text-sm font-medium">Ghi nhận</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Filter -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Loại thuế</label>
            <select x-model="filterTax" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả</option>
              <option value="VAT">Thuế GTGT</option>
              <option value="CIT">Thuế TNDN</option>
              <option value="PIT">Thuế TNCN</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
            <select x-model="filterStatus" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Tất cả</option>
              <option value="PENDING">Chờ nộp</option>
              <option value="PAID">Đã nộp</option>
              <option value="PARTIAL">Nộp một phần</option>
              <option value="OVERPAID">Nộp thừa</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
            <input type="number" x-model.number="filterYear" min="2024" class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button @click="filterTax=''; filterStatus=''; filterYear=0" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700">Xoá lọc</button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách thanh toán</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' bản ghi'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Loại thuế</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kỳ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Khai báo</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Đã nộp</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Hạn nộp</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số ngày trễ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Phải nộp</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Sổ cái</th>
                <th class="text-center px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="p in filtered" :key="p.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3">
                    <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-blue-100 text-blue-700': p.tax_type === 'VAT',
                        'bg-green-100 text-green-700': p.tax_type === 'CIT',
                        'bg-purple-100 text-purple-700': p.tax_type === 'PIT',
                      }" x-text="p.tax_type"></span>
                  </td>
                  <td class="px-5 py-3 text-gray-700" x-text="p.period_number + '/' + p.period_year"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(p.declared_amount)"></td>
                  <td class="px-5 py-3 text-right" :class="p.paid_amount >= p.declared_amount ? 'text-green-700 font-medium' : 'text-gray-700'" x-text="fmtVND(p.paid_amount)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(p.due_date)"></td>
                  <td class="px-5 py-3" x-html="statusBadge(p.status)"></td>
                  <td class="px-5 py-3" :class="p.late_days > 0 ? 'text-red-600 font-medium' : 'text-gray-400'" x-text="p.late_days > 0 ? p.late_days + ' ngày' : '—'"></td>
                  <td class="px-5 py-3 text-right text-gray-700" x-text="p.late_interest > 0 ? fmtVND(p.late_interest) : '—'"></td>
                  <td class="px-5 py-3 text-gray-500 text-xs" x-text="p.gl_journal_id ? p.gl_journal_id.substring(0, 8) : '—'"></td>
                  <td class="px-5 py-3 text-center">
                    <button x-show="p.status !== 'PAID' && p.status !== 'OVERPAID'" @click="openRecord(p)" class="px-3 py-1 bg-green-600 text-white rounded text-xs font-medium hover:bg-green-700">Nộp thuế</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="10" class="px-5 py-8 text-center text-gray-400">Không có dữ liệu thanh toán</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    payments: [],
    summary: { total_payments: 0, total_declared: 0, total_paid: 0, total_outstanding: 0, by_status: {} },
    filterTax: "",
    filterStatus: "",
    filterYear: 0,
    showCreate: false,
    showRecord: false,
    recordTarget: {},
    form: { tax_type: "VAT", period_year: new Date().getFullYear(), period_number: 1, declared_amount: 0, due_date: "", notes: "" },
    recordForm: { amount: 0, date: "", reference: "" },

    get filtered() {
      return this.payments.filter(p => {
        if (this.filterTax && p.tax_type !== this.filterTax) return false;
        if (this.filterStatus && p.status !== this.filterStatus) return false;
        if (this.filterYear && p.period_year !== this.filterYear) return false;
        return true;
      });
    },

    async init() {
      mountAppShell("Thanh toán thuế", "/app/tax-payments.html");
      try {
        const cid = App.companyId();
        const [payments, summary] = await Promise.all([
          apiGet(`/tax/payments?company_id=${cid}`),
          apiGet(`/tax/payments/summary?company_id=${cid}`),
        ]);
        this.payments = payments || [];
        this.summary = summary || this.summary;
      } catch (e) {
        console.error("tax-payments init:", e);
      }
    },

    async createPayment() {
      if (!this.form.declared_amount || !this.form.due_date) {
        $store.app.flashError("Vui lòng nhập số tiền và hạn nộp");
        return;
      }
      try {
        const cid = App.companyId();
        await apiPost(`/tax/payments?company_id=${cid}`, this.form);
        this.showCreate = false;
        this.form = { tax_type: "VAT", period_year: new Date().getFullYear(), period_number: 1, declared_amount: 0, due_date: "", notes: "" };
        await this.refresh();
        $store.app.flashSuccess("Tạo thanh toán thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được thanh toán");
      }
    },

    openRecord(p) {
      this.recordTarget = p;
      this.recordForm = { amount: p.declared_amount, date: new Date().toISOString().split("T")[0], reference: "" };
      this.showRecord = true;
    },

    async recordPayment() {
      if (!this.recordForm.amount || !this.recordForm.date) {
        $store.app.flashError("Vui lòng nhập số tiền và ngày nộp");
        return;
      }
      try {
        const cid = App.companyId();
        await apiPost(`/tax/payments/${this.recordTarget.id}/record?company_id=${cid}`, this.recordForm);
        this.showRecord = false;
        await this.refresh();
        $store.app.flashSuccess("Ghi nhận nộp thuế thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không ghi nhận được");
      }
    },

    async refresh() {
      const cid = App.companyId();
      const [payments, summary] = await Promise.all([
        apiGet(`/tax/payments?company_id=${cid}`),
        apiGet(`/tax/payments/summary?company_id=${cid}`),
      ]);
      this.payments = payments || [];
      this.summary = summary || this.summary;
    },
  };
}
</script>

</body>
</html>
