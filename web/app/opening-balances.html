<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Số dư đầu kỳ · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Số dư đầu kỳ</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Tạo số dư đầu kỳ</button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách số dư đầu kỳ</h3>
          <span class="text-xs text-gray-400" x-text="items.length + ' bản ghi'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Năm</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kỳ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng nợ</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng có</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in items" :key="item.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium" x-text="item.year"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="item.period || ('Tháng ' + item.month)"></td>
                  <td class="px-5 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-gray-100 text-gray-600': item.status === 'DRAFT',
                        'bg-amber-100 text-amber-700': item.status === 'SUBMITTED',
                        'bg-green-100 text-green-700': item.status === 'APPROVED',
                      }" x-text="item.status"></span>
                  </td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(item.total_debit)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(item.total_credit)"></td>
                  <td class="px-5 py-3 text-right space-x-2">
                    <template x-if="item.status === 'DRAFT'">
                      <button @click="submitItem(item)" class="text-amber-700 hover:underline text-xs">Gửi duyệt</button>
                    </template>
                    <template x-if="item.status === 'SUBMITTED'">
                      <button @click="approveItem(item)" class="text-green-700 hover:underline text-xs">Duyệt</button>
                    </template>
                    <button @click="viewDetails(item)" class="text-blue-700 hover:underline text-xs">Xem</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!items.length && !loading">
                <td colspan="6" class="px-5 py-8 text-center text-gray-400">Chưa có số dư đầu kỳ nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6" @click.stop>
        <h3 class="text-lg font-bold text-gray-900 mb-4">Tạo số dư đầu kỳ</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Năm <span class="text-red-500">*</span></label>
            <input type="number" x-model.number="form.year" min="2020" max="2030" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" :placeholder="new Date().getFullYear()">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng <span class="text-red-500">*</span></label>
            <select x-model.number="form.month" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <template x-for="m in 12" :key="m">
                <option :value="m" x-text="'Tháng ' + m"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createItem()" class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition" :disabled="saving">
            <span x-show="!saving">Tạo</span>
            <span x-show="saving">Đang tạo...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- View details modal -->
  <template x-if="viewing">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="viewing = null">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6" @click.stop>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-gray-900">Chi tiết số dư đầu kỳ</h3>
          <span class="text-sm text-gray-500" x-text="'Năm ' + viewing.year + ' - Tháng ' + viewing.month"></span>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-semibold text-gray-700 mb-2">Chi tiết theo tài khoản</h4>
          <table class="w-full text-sm border border-gray-200 rounded-lg overflow-hidden">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-3 py-2 font-medium text-gray-600">Mã TK</th>
                <th class="text-left px-3 py-2 font-medium text-gray-600">Diễn giải</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600">Nợ</th>
                <th class="text-right px-3 py-2 font-medium text-gray-600">Có</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="d in (viewing.details || [])" :key="d.id || d.account_code">
                <tr class="border-t border-gray-100">
                  <td class="px-3 py-2 font-medium" x-text="d.account_code"></td>
                  <td class="px-3 py-2 text-gray-600" x-text="d.description || '—'"></td>
                  <td class="px-3 py-2 text-right" x-text="fmtVND(d.debit)"></td>
                  <td class="px-3 py-2 text-right" x-text="fmtVND(d.credit)"></td>
                </tr>
              </template>
              <tr x-show="!viewing.details || !viewing.details.length">
                <td colspan="4" class="px-3 py-4 text-center text-gray-400">Chưa có chi tiết</td>
              </tr>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200">
              <tr>
                <td colspan="2" class="px-3 py-2 text-xs font-semibold text-right">Tổng</td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(viewing.total_debit)"></td>
                <td class="px-3 py-2 text-xs font-bold text-right" x-text="fmtVND(viewing.total_credit)"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="flex justify-end">
          <button @click="viewing = null" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Đóng</button>
        </div>
      </div>
    </div>
  </template>

<script>
function comp() {
  return {
    items: [],
    loading: true,
    showCreate: false,
    viewing: null,
    saving: false,
    form: { year: new Date().getFullYear(), month: 1 },

    async init() {
      mountAppShell("Số dư đầu kỳ", "/app/opening-balances.html");
      await this.loadItems();
    },

    async loadItems() {
      this.loading = true;
      try {
        const cid = App.companyId();
        const data = await apiGet(`/opening-balances?company_id=${cid}`);
        this.items = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách số dư đầu kỳ");
      }
      this.loading = false;
    },

    async createItem() {
      if (!this.form.year) {
        $store.app.flashError("Vui lòng nhập năm");
        return;
      }
      this.saving = true;
      try {
        const cid = App.companyId();
        await apiPost(`/opening-balances?company_id=${cid}`, this.form);
        this.showCreate = false;
        this.form = { year: new Date().getFullYear(), month: 1 };
        await this.loadItems();
        $store.app.flashSuccess("Tạo số dư đầu kỳ thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được số dư đầu kỳ");
      }
      this.saving = false;
    },

    async submitItem(item) {
      if (!App.confirm("Gửi số dư đầu kỳ để duyệt?")) return;
      try {
        const cid = App.companyId();
        await apiPost(`/opening-balances/${item.id}/submit?company_id=${cid}`, {});
        await this.loadItems();
        $store.app.flashSuccess("Đã gửi số dư đầu kỳ");
      } catch (e) {
        $store.app.flashError(e.error || "Không gửi được");
      }
    },

    async approveItem(item) {
      if (!App.confirm("Duyệt số dư đầu kỳ?")) return;
      try {
        const cid = App.companyId();
        await apiPost(`/opening-balances/${item.id}/approve?company_id=${cid}`, {});
        await this.loadItems();
        $store.app.flashSuccess("Đã duyệt số dư đầu kỳ");
      } catch (e) {
        $store.app.flashError(e.error || "Không duyệt được");
      }
    },

    async viewDetails(item) {
      try {
        const cid = App.companyId();
        const data = await apiGet(`/opening-balances/${item.id}?company_id=${cid}`);
        this.viewing = data;
      } catch (err) {
        this.viewing = item;
      }
    },
  };
}
</script>

</body>
</html>
