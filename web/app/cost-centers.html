<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung tâm chi phí · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="costCenterPage()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Trung tâm chi phí</h2>
        <button @click="openCreate()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm trung tâm chi phí
        </button>
      </div>

      <!-- Filters -->
      <div class="flex items-center gap-4 mb-4">
        <input type="text" x-model="search" placeholder="Tìm mã, tên..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" x-model="showInactive" class="rounded">
          Hiển thị đã ngừng hoạt động
        </label>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Mã</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Tên</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Trung tâm cha</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">Trạng thái</th>
              <th class="text-right px-4 py-3 font-medium text-gray-600">Thao tác</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-for="cc in filteredList" :key="cc.id">
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium text-gray-900" x-text="cc.code"></td>
                <td class="px-4 py-3 text-gray-700" :style="'padding-left:' + (16 + (cc._depth || 0) * 24) + 'px'" x-text="cc.name"></td>
                <td class="px-4 py-3 text-gray-500" x-text="getParentName(cc.parent_id)"></td>
                <td class="px-4 py-3">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                    :class="cc.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'"
                    x-text="cc.is_active ? 'Hoạt động' : 'Ngừng HĐ'"></span>
                </td>
                <td class="px-4 py-3 text-right">
                  <button @click="openEdit(cc)" class="text-blue-600 hover:text-blue-800 text-xs mr-2">Sửa</button>
                  <button @click="deleteCC(cc)" class="text-red-600 hover:text-red-800 text-xs">Xóa</button>
                </td>
              </tr>
            </template>
            <template x-if="filteredList.length === 0">
              <tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">Không có dữ liệu</td></tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Modal -->
      <template x-if="showModal">
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4" @click.outside="showModal=false">
            <div class="px-6 py-4 border-b border-gray-200">
              <h3 class="text-lg font-bold text-gray-900" x-text="editing ? 'Sửa trung tâm chi phí' : 'Thêm trung tâm chi phí'"></h3>
            </div>
            <div class="px-6 py-4 space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mã <span class="text-red-500">*</span></label>
                <input type="text" x-model="form.code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="VD: CC01">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên <span class="text-red-500">*</span></label>
                <input type="text" x-model="form.name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="VD: Phòng Kế toán">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Trung tâm cha</label>
                <select x-model="form.parent_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">-- Không có cha --</option>
                  <template x-for="cc in items" :key="cc.id">
                    <option :value="cc.id" x-text="cc.code + ' - ' + cc.name" :disabled="cc.id === editing?.id"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                <textarea x-model="form.description" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </div>
              <div class="flex items-center gap-2">
                <input type="checkbox" x-model="form.is_active" id="isActive" class="rounded">
                <label for="isActive" class="text-sm text-gray-700">Hoạt động</label>
              </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
              <button @click="showModal=false" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Hủy</button>
              <button @click="save()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">Lưu</button>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>

  <script>
  function costCenterPage() {
    return {
      items: [],
      search: '',
      showInactive: false,
      showModal: false,
      editing: null,
      form: { code: '', name: '', parent_id: '', description: '', is_active: true },

      async init() {
        mountAppShell('Trung tâm chi phí', '/app/cost-centers.html');
        await this.load();
      },

      async load() {
        try {
          const data = await apiGet('/cost-centers?company_id=' + (localStorage.getItem('company_id') || ''));
          this.items = Array.isArray(data) ? data : [];
          this.buildHierarchy();
        } catch (e) {
          this.items = [];
        }
      },

      buildHierarchy() {
        const map = {};
        this.items.forEach(cc => { map[cc.id] = cc; });
        this.items.forEach(cc => {
          cc._depth = 0;
          let p = cc.parent_id;
          while (p && map[p]) { cc._depth++; p = map[p].parent_id; }
        });
        this.items.sort((a, b) => (a._depth - b._depth) || a.code.localeCompare(b.code));
      },

      get filteredList() {
        return this.items.filter(cc => {
          if (!this.showInactive && !cc.is_active) return false;
          if (this.search) {
            const s = this.search.toLowerCase();
            return cc.code.toLowerCase().includes(s) || cc.name.toLowerCase().includes(s);
          }
          return true;
        });
      },

      getParentName(parentId) {
        if (!parentId) return '';
        const p = this.items.find(cc => cc.id === parentId);
        return p ? p.code + ' - ' + p.name : '';
      },

      openCreate() {
        this.editing = null;
        this.form = { code: '', name: '', parent_id: '', description: '', is_active: true };
        this.showModal = true;
      },

      openEdit(cc) {
        this.editing = cc;
        this.form = { code: cc.code, name: cc.name, parent_id: cc.parent_id || '', description: cc.description || '', is_active: cc.is_active };
        this.showModal = true;
      },

      async save() {
        try {
          const body = { ...this.form };
          if (this.editing) {
            await apiPut('/cost-centers/' + this.editing.id + '?company_id=' + (localStorage.getItem('company_id') || ''), body);
          } else {
            await apiPost('/cost-centers?company_id=' + (localStorage.getItem('company_id') || ''), body);
          }
          this.showModal = false;
          await this.load();
          this.$store.app.success = this.editing ? 'Đã cập nhật' : 'Đã tạo mới';
          setTimeout(() => { this.$store.app.success = ''; }, 3000);
        } catch (e) {
          this.$store.app.error = e.message || 'Lỗi';
          setTimeout(() => { this.$store.app.error = ''; }, 3000);
        }
      },

      async deleteCC(cc) {
        if (!confirm('Xóa trung tâm chi phí "' + cc.name + '"?')) return;
        try {
          await apiDelete('/cost-centers/' + cc.id);
          await this.load();
          this.$store.app.success = 'Đã xóa';
          setTimeout(() => { this.$store.app.success = ''; }, 3000);
        } catch (e) {
          this.$store.app.error = e.message || 'Lỗi';
          setTimeout(() => { this.$store.app.error = ''; }, 3000);
        }
      }
    };
  }
  </script>
</body>
</html>
