<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo GTGT · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <h1 class="text-xl font-bold text-gray-900 mb-6">Báo cáo thuế GTGT</h1>

      <!-- Summary cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng doanh thu</p>
          <p class="text-2xl font-bold text-gray-900" x-text="fmtVND(totalRevenue) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng GTGT đầu ra</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(totalOutputVAT) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng GTGT đầu vào</p>
          <p class="text-2xl font-bold text-amber-700" x-text="fmtVND(totalInputVAT) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">GTGT phải nộp</p>
          <p class="text-2xl font-bold text-green-700" x-text="fmtVND(netVAT) + ' ₫'"></p>
        </div>
      </div>

      <!-- Filter -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
            <input type="number" x-model.number="filterYear" min="2024" class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kỳ</label>
            <select x-model.number="filterPeriod" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="1">Quý I</option>
              <option value="2">Quý II</option>
              <option value="3">Quý III</option>
              <option value="4">Quý IV</option>
            </select>
          </div>
          <button @click="filterYear = new Date().getFullYear(); filterPeriod = Math.ceil((new Date().getMonth()+1)/3)" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-700">Đặt lại</button>
        </div>
      </div>

      <!-- Output invoices -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden mb-6">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Hóa đơn bán (GTGT đầu ra)</h3>
          <span class="text-xs text-gray-400" x-text="outputInvoices.length + ' hóa đơn'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số HĐ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Khách hàng</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thành tiền</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">VAT (10%)</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng cộng</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="inv in outputInvoices" :key="inv.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="inv.invoice_number"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(inv.date)"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="inv.customer"></td>
                  <td class="px-5 py-3 text-right" x-text="fmtVND(inv.amount) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right text-blue-700" x-text="fmtVND(inv.vat) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(inv.total) + ' ₫'"></td>
                </tr>
              </template>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200">
              <tr>
                <td colspan="3" class="px-5 py-3 font-semibold text-gray-700">Tổng</td>
                <td class="px-5 py-3 text-right font-semibold" x-text="fmtVND(outputTotal) + ' ₫'"></td>
                <td class="px-5 py-3 text-right font-semibold text-blue-700" x-text="fmtVND(outputVATTotal) + ' ₫'"></td>
                <td class="px-5 py-3 text-right font-bold" x-text="fmtVND(outputGrandTotal) + ' ₫'"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- Input invoices -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Hóa đơn mua (GTGT đầu vào)</h3>
          <span class="text-xs text-gray-400" x-text="inputInvoices.length + ' hóa đơn'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Số HĐ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Nhà cung cấp</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thành tiền</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">VAT (10%)</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Tổng cộng</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="inv in inputInvoices" :key="inv.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="inv.invoice_number"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(inv.date)"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="inv.supplier"></td>
                  <td class="px-5 py-3 text-right" x-text="fmtVND(inv.amount) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right text-amber-700" x-text="fmtVND(inv.vat) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(inv.total) + ' ₫'"></td>
                </tr>
              </template>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200">
              <tr>
                <td colspan="3" class="px-5 py-3 font-semibold text-gray-700">Tổng</td>
                <td class="px-5 py-3 text-right font-semibold" x-text="fmtVND(inputTotal) + ' ₫'"></td>
                <td class="px-5 py-3 text-right font-semibold text-amber-700" x-text="fmtVND(inputVATTotal) + ' ₫'"></td>
                <td class="px-5 py-3 text-right font-bold" x-text="fmtVND(inputGrandTotal) + ' ₫'"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    filterYear: new Date().getFullYear(),
    filterPeriod: Math.ceil((new Date().getMonth() + 1) / 3),

    outputInvoices: [
      { id: "1", invoice_number: "HD-001/25", date: "2025-07-02", customer: "Công ty ABC", amount: 12000000, vat: 1200000, total: 13200000 },
      { id: "2", invoice_number: "HD-002/25", date: "2025-07-10", customer: "Công ty XYZ", amount: 8500000, vat: 850000, total: 9350000 },
      { id: "3", invoice_number: "HD-003/25", date: "2025-07-18", customer: "Doanh nghiệp DEF", amount: 15000000, vat: 1500000, total: 16500000 },
      { id: "4", invoice_number: "HD-004/25", date: "2025-08-01", customer: "Hộ kinh doanh GHI", amount: 5000000, vat: 500000, total: 5500000 },
      { id: "5", invoice_number: "HD-005/25", date: "2025-08-05", customer: "Công ty JKL", amount: 22000000, vat: 2200000, total: 24200000 },
    ],

    inputInvoices: [
      { id: "1", invoice_number: "MHD-001/25", date: "2025-07-03", supplier: "Nhà cung cấp A", amount: 5000000, vat: 500000, total: 5500000 },
      { id: "2", invoice_number: "MHD-002/25", date: "2025-07-12", supplier: "Nhà cung cấp B", amount: 3200000, vat: 320000, total: 3520000 },
      { id: "3", invoice_number: "MHD-003/25", date: "2025-07-22", supplier: "Nhà cung cấp C", amount: 9800000, vat: 980000, total: 10780000 },
      { id: "4", invoice_number: "MHD-004/25", date: "2025-08-02", supplier: "Nhà cung cấp D", amount: 4500000, vat: 450000, total: 4950000 },
      { id: "5", invoice_number: "MHD-005/25", date: "2025-08-04", supplier: "Nhà cung cấp E", amount: 7000000, vat: 700000, total: 7700000 },
    ],

    get totalRevenue() { return this.outputInvoices.reduce((s, i) => s + i.amount, 0); },
    get totalOutputVAT() { return this.outputInvoices.reduce((s, i) => s + i.vat, 0); },
    get totalInputVAT() { return this.inputInvoices.reduce((s, i) => s + i.vat, 0); },
    get netVAT() { return this.totalOutputVAT - this.totalInputVAT; },

    get outputTotal() { return this.outputInvoices.reduce((s, i) => s + i.amount, 0); },
    get outputVATTotal() { return this.outputInvoices.reduce((s, i) => s + i.vat, 0); },
    get outputGrandTotal() { return this.outputInvoices.reduce((s, i) => s + i.total, 0); },

    get inputTotal() { return this.inputInvoices.reduce((s, i) => s + i.amount, 0); },
    get inputVATTotal() { return this.inputInvoices.reduce((s, i) => s + i.vat, 0); },
    get inputGrandTotal() { return this.inputInvoices.reduce((s, i) => s + i.total, 0); },

    init() {
      mountAppShell("Báo cáo GTGT", "/app/vat-report.html");
    },
  };
}
</script>

</body>
</html>
