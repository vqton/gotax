<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài sản cố định · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>
    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <!-- Summary cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng TSCĐ</p>
          <p class="text-2xl font-bold text-gray-900" x-text="assets.length"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Đang sử dụng</p>
          <p class="text-2xl font-bold text-green-700" x-text="activeCount"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Tổng nguyên giá</p>
          <p class="text-2xl font-bold text-blue-700" x-text="fmtVND(totalCost) + ' ₫'"></p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <p class="text-sm text-gray-500 mb-1">Giá trị còn lại</p>
          <p class="text-2xl font-bold text-amber-700" x-text="fmtVND(totalResidual) + ' ₫'"></p>
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2">
          <input type="text" x-model="search" placeholder="Tìm mã, tên TSCĐ..." class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <select x-model="filterStatus" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Tất cả trạng thái</option>
            <option value="ACTIVE">Đang hoạt động</option>
            <option value="DISPOSED">Đã thanh lý</option>
            <option value="TRANSFERRED">Đã chuyển</option>
          </select>
        </div>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Thêm TSCĐ</button>
      </div>

      <!-- Create modal -->
      <template x-if="showCreate">
        <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
          <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg" @click.stop>
            <h2 class="text-lg font-bold mb-4">Thêm tài sản cố định mới</h2>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mã TSCĐ</label>
                <input type="text" x-model="form.code" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên TSCĐ</label>
                <input type="text" x-model="form.name" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhóm TSCĐ</label>
                <select x-model="form.category_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">Chọn nhóm</option>
                  <option value="CAT-01">Nhà xưởng</option>
                  <option value="CAT-02">Máy móc</option>
                  <option value="CAT-03">Phương tiện</option>
                  <option value="CAT-04">Đồ dùng</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ngày mua</label>
                <input type="date" x-model="form.purchase_date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nguyên giá (₫)</label>
                <input type="number" x-model.number="form.cost" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Thời gian KH (tháng)</label>
                <input type="number" x-model.number="form.useful_life_months" min="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Giá trị thanh lý (₫)</label>
                <input type="number" x-model.number="form.salvage_value" min="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
              <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
              <button @click="createAsset()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Thêm</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách tài sản cố định</h3>
          <span class="text-xs text-gray-400" x-text="filtered.length + ' tài sản'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Mã TSCĐ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tên TSCĐ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Nhóm</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày mua</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Nguyên giá</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Giá trị còn lại</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="a in filtered" :key="a.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="a.code"></td>
                  <td class="px-5 py-3 text-gray-900" x-text="a.name"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="a.category_name || a.category_id"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(a.purchase_date)"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(a.cost) + ' ₫'"></td>
                  <td class="px-5 py-3 text-right font-medium" x-text="fmtVND(a.residual_value || a.cost) + ' ₫'"></td>
                  <td class="px-5 py-3" x-html="statusBadge(a.status || 'ACTIVE')"></td>
                </tr>
              </template>
              <tr x-show="!filtered.length">
                <td colspan="7" class="px-5 py-8 text-center text-gray-400">Không có tài sản cố định nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  return {
    assets: [],
    search: "",
    filterStatus: "",
    showCreate: false,
    form: { code: "", name: "", category_id: "", purchase_date: "", cost: 0, useful_life_months: 0, salvage_value: 0 },

    get filtered() {
      return this.assets.filter(a => {
        if (this.filterStatus && a.status !== this.filterStatus) return false;
        if (this.search) {
          const q = this.search.toLowerCase();
          return a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q);
        }
        return true;
      });
    },

    get activeCount() { return this.assets.filter(a => a.status === "ACTIVE").length; },
    get totalCost() { return this.assets.reduce((s, a) => s + (a.cost || 0), 0); },
    get totalResidual() { return this.assets.reduce((s, a) => s + (a.residual_value || a.cost || 0), 0); },

    async init() {
      mountAppShell("Tài sản cố định", "/app/fixed-assets.html");
      try {
        const cid = App.companyId();
        this.assets = await apiGet(`/fixed-assets?company_id=${cid}`).catch(() => []);
      } catch (e) {
        console.error("fixed-assets init:", e);
      }
      if (!this.assets.length) {
        this.assets = [
          { id: "1", code: "TSCD-001", name: "Máy photocopy Canon IR2525", category_name: "Máy móc", purchase_date: "2023-03-15", cost: 45000000, residual_value: 31500000, status: "ACTIVE" },
          { id: "2", code: "TSCD-002", name: "Máy tính Lenovo ThinkCentre", category_name: "Đồ dùng", purchase_date: "2023-06-01", cost: 18000000, residual_value: 10800000, status: "ACTIVE" },
          { id: "3", code: "TSCD-003", name: "Xe tải Hyundai Porter 1.5T", category_name: "Phương tiện", purchase_date: "2022-01-10", cost: 520000000, residual_value: 364000000, status: "ACTIVE" },
          { id: "4", code: "TSCD-004", name: "Máy lạnh Daikin 2HP", category_name: "Đồ dùng", purchase_date: "2024-01-20", cost: 12000000, residual_value: 10800000, status: "ACTIVE" },
          { id: "5", code: "TSCD-005", name: "Bộ bàn ghế văn phòng", category_name: "Đồ dùng", purchase_date: "2022-08-05", cost: 8000000, residual_value: 0, status: "DISPOSED" },
        ];
      }
    },

    async createAsset() {
      if (!this.form.code || !this.form.name) {
        $store.app.flashError("Vui lòng nhập mã và tên TSCĐ");
        return;
      }
      try {
        const cid = App.companyId();
        await apiPost(`/fixed-assets?company_id=${cid}`, this.form);
        this.showCreate = false;
        this.form = { code: "", name: "", category_id: "", purchase_date: "", cost: 0, useful_life_months: 0, salvage_value: 0 };
        this.assets = await apiGet(`/fixed-assets?company_id=${cid}`).catch(() => []);
        $store.app.flashSuccess("Thêm TSCĐ thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không thêm được TSCĐ");
      }
    },
  };
}
</script>

</body>
</html>
