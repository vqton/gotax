<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quy tắc đánh số chứng từ · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Quy tắc đánh số chứng từ</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Thêm quy tắc</button>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách quy tắc</h3>
          <span class="text-xs text-gray-400" x-text="rules.length + ' quy tắc'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Loại chứng từ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tiền tố</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Độ dài số</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Phạm vi</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Quy tắc đặt lại</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Số hiện tại</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in rules" :key="r.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium text-blue-700" x-text="r.voucher_type"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.prefix || '—'"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.number_length"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.scope === 'company' ? 'Công ty' : 'Chi nhánh'"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="r.reset_rule === 'never' ? 'Không' : r.reset_rule === 'yearly' ? 'Hàng năm' : 'Hàng tháng'"></td>
                  <td class="px-5 py-3 text-right font-mono text-gray-900" x-text="r.current_num"></td>
                  <td class="px-5 py-3 text-right">
                    <button @click="deleteRule(r)" class="text-red-600 hover:underline text-xs">Xóa</button>
                  </td>
                </tr>
              </template>
              <tr x-show="!rules.length && !loading">
                <td colspan="7" class="px-5 py-8 text-center text-gray-400">Chưa có quy tắc đánh số nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6" @click.stop>
        <h3 class="text-lg font-bold text-gray-900 mb-4">Thêm quy tắc đánh số</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Loại chứng từ <span class="text-red-500">*</span></label>
            <select x-model="form.voucher_type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Chọn loại...</option>
              <template x-for="vt in voucherTypes" :key="vt.code">
                <option :value="vt.code" x-text="vt.code + ' — ' + vt.name"></option>
              </template>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Tiền tố</label>
              <input type="text" x-model="form.prefix" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="VD: BH">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Độ dài số</label>
              <input type="number" x-model.number="form.number_length" min="3" max="10" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Phạm vi</label>
              <select x-model="form.scope" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="company">Toàn công ty</option>
                <option value="branch">Theo chi nhánh</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Quy tắc đặt lại</label>
              <select x-model="form.reset_rule" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="never">Không đặt lại</option>
                <option value="yearly">Đặt lại hàng năm</option>
                <option value="monthly">Đặt lại hàng tháng</option>
              </select>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createRule()" class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition" :disabled="saving || !form.voucher_type">
            <span x-show="!saving">Thêm</span>
            <span x-show="saving">Đang thêm...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

<script>
function comp() {
  return {
    rules: [],
    loading: true,
    showCreate: false,
    saving: false,
    form: { voucher_type: '', prefix: '', number_length: 5, scope: 'company', reset_rule: 'never' },
    voucherTypes: [
      { code: 'BG', name: 'Bút toán ghi sổ' },
      { code: 'MB', name: 'Mua hàng' },
      { code: 'BH', name: 'Bán hàng' },
      { code: 'TN', name: 'Thu tiền' },
      { code: 'CN', name: 'Chi tiền' },
      { code: 'NK', name: 'Nhập kho' },
      { code: 'XK', name: 'Xuất kho' },
      { code: 'CC', name: 'Công cụ dụng cụ' },
      { code: 'TSCĐ', name: 'Tài sản cố định' },
      { code: 'Lương', name: 'Tiền lương' },
    ],

    async init() {
      mountAppShell("Quy tắc đánh số chứng từ", "/app/numbering-rules.html");
      await this.loadRules();
    },

    async loadRules() {
      this.loading = true;
      try {
        const data = await apiGet("/numbering-rules");
        this.rules = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách quy tắc");
      }
      this.loading = false;
    },

    async createRule() {
      if (!this.form.voucher_type) {
        $store.app.flashError("Vui lòng chọn loại chứng từ");
        return;
      }
      this.saving = true;
      try {
        await apiPost("/numbering-rules", this.form);
        this.showCreate = false;
        this.form = { voucher_type: '', prefix: '', number_length: 5, scope: 'company', reset_rule: 'never' };
        await this.loadRules();
        $store.app.flashSuccess("Thêm quy tắc thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không thêm được quy tắc");
      }
      this.saving = false;
    },

    async deleteRule(r) {
      if (!App.confirm(`Xóa quy tắc đánh số cho "${r.voucher_type}"?`)) return;
      try {
        await apiDelete(`/numbering-rules/${r.id}`);
        await this.loadRules();
        $store.app.flashSuccess("Đã xóa quy tắc");
      } catch (e) {
        $store.app.flashError(e.error || "Không xóa được quy tắc");
      }
    },
  };
}
</script>

</body>
</html>
