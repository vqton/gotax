<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỳ kế toán · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/app-legacy.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Kỳ kế toán</h2>
        <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition">+ Tạo kỳ kế toán</button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Danh sách kỳ kế toán</h3>
          <span class="text-xs text-gray-400" x-text="periods.length + ' kỳ'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Kỳ</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Năm</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Tháng</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày bắt đầu</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Ngày kết thúc</th>
                <th class="text-left px-5 py-2.5 font-semibold text-gray-600">Trạng thái</th>
                <th class="text-right px-5 py-2.5 font-semibold text-gray-600">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="p in periods" :key="p.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-5 py-3 font-medium" x-text="p.label || ('Tháng ' + p.month + '/' + p.year)"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="p.year"></td>
                  <td class="px-5 py-3 text-gray-700" x-text="p.month"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(p.start_date)"></td>
                  <td class="px-5 py-3 text-gray-500" x-text="fmtDate(p.end_date)"></td>
                  <td class="px-5 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="{
                        'bg-green-100 text-green-700': p.status === 'OPEN',
                        'bg-amber-100 text-amber-700': p.status === 'CLOSING',
                        'bg-gray-100 text-gray-600': p.status === 'CLOSED',
                        'bg-red-100 text-red-700': p.status === 'LOCKED',
                      }" x-text="p.status"></span>
                  </td>
                  <td class="px-5 py-3 text-right space-x-2">
                    <template x-if="p.status === 'OPEN'">
                      <button @click="closePeriod(p)" class="text-amber-700 hover:underline text-xs">Đóng kỳ</button>
                    </template>
                    <template x-if="p.status === 'CLOSED'">
                      <button @click="reopenPeriod(p)" class="text-blue-700 hover:underline text-xs">Mở lại</button>
                    </template>
                  </td>
                </tr>
              </template>
              <tr x-show="!periods.length && !loading">
                <td colspan="7" class="px-5 py-8 text-center text-gray-400">Chưa có kỳ kế toán nào</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6" @click.stop>
        <h3 class="text-lg font-bold text-gray-900 mb-4">Tạo kỳ kế toán mới</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Năm <span class="text-red-500">*</span></label>
            <input type="number" x-model.number="form.year" min="2020" max="2030" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" :placeholder="new Date().getFullYear()">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tháng <span class="text-red-500">*</span></label>
            <select x-model.number="form.month" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <template x-for="m in 12" :key="m">
                <option :value="m" x-text="'Tháng ' + m"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button @click="showCreate = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createPeriod()" class="px-5 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50 transition" :disabled="saving">
            <span x-show="!saving">Tạo kỳ</span>
            <span x-show="saving">Đang tạo...</span>
          </button>
        </div>
      </div>
    </div>
  </template>

<script>
function comp() {
  return {
    periods: [],
    loading: true,
    showCreate: false,
    saving: false,
    form: { year: new Date().getFullYear(), month: new Date().getMonth() + 1 },

    async init() {
      mountAppShell("Kỳ kế toán", "/app/periods.html");
      await this.loadPeriods();
    },

    async loadPeriods() {
      this.loading = true;
      try {
        const data = await apiGet("/periods");
        this.periods = Array.isArray(data) ? data : data.items || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được danh sách kỳ kế toán");
      }
      this.loading = false;
    },

    async createPeriod() {
      if (!this.form.year) {
        $store.app.flashError("Vui lòng nhập năm");
        return;
      }
      this.saving = true;
      try {
        await apiPost("/periods", this.form);
        this.showCreate = false;
        this.form = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
        await this.loadPeriods();
        $store.app.flashSuccess("Tạo kỳ kế toán thành công");
      } catch (e) {
        $store.app.flashError(e.error || "Không tạo được kỳ kế toán");
      }
      this.saving = false;
    },

    async closePeriod(p) {
      if (!App.confirm(`Đóng kỳ kế toán tháng ${p.month}/${p.year}?`)) return;
      try {
        await apiPost(`/periods/${p.id}/close`, {});
        await this.loadPeriods();
        $store.app.flashSuccess(`Đã đóng kỳ tháng ${p.month}/${p.year}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không đóng được kỳ");
      }
    },

    async reopenPeriod(p) {
      if (!App.confirm(`Mở lại kỳ kế toán tháng ${p.month}/${p.year}?`)) return;
      try {
        await apiPost(`/periods/${p.id}/reopen`, {});
        await this.loadPeriods();
        $store.app.flashSuccess(`Đã mở lại kỳ tháng ${p.month}/${p.year}`);
      } catch (e) {
        $store.app.flashError(e.error || "Không mở lại được kỳ");
      }
    },
  };
}
</script>

</body>
</html>
