<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch khấu hao · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Lịch khấu hao tài sản cố định</h2>
        <button @click="window.print()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          In báo cáo
        </button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Mã kỳ</label>
            <input x-model="periodId" type="text" placeholder="VD: 2026-07" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-40">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Mã tài sản</label>
            <input x-model="assetId" type="text" placeholder="Xem TS cụ thể" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-40">
          </div>
          <button @click="loadReport()" :disabled="loading" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition disabled:opacity-50">
            <span x-show="!loading">Xem lịch khấu hao</span>
            <span x-show="loading">Đang tải...</span>
          </button>
        </div>
      </div>

      <!-- Summary cards -->
      <div x-show="entries.length" class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Sản phẩm kỳ</div>
          <div class="text-lg font-bold text-gray-900" x-text="entries.length"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Tổng khấu hao kỳ</div>
          <div class="text-lg font-bold text-blue-700 tabular-nums" x-text="fmtVND(totalDepr)"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Lũy kế sau kỳ</div>
          <div class="text-lg font-bold text-orange-700 tabular-nums" x-text="fmtVND(totalAccumAfter)"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Đã ghi sổ NCC</div>
          <div class="text-lg font-bold text-green-700" x-text="postedCount + '/' + entries.length"></div>
        </div>
      </div>

      <!-- Report table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Chi tiết khấu hao — Kỳ <span x-text="periodId || '...'"></span></h3>
          <span class="text-xs text-gray-400" x-text="entries.length + ' tài sản'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-center px-3 py-2.5 font-semibold text-gray-600 w-10">STT</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Mã TS</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Khấu hao kỳ</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Lũy kế sau kỳ</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Giá trị còn lại</th>
                <th class="text-center px-3 py-2.5 font-semibold text-gray-600">Ghi sổ NCC</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Ngày tạo</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Người tạo</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(e, idx) in entries" :key="e.id">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-3 py-3 text-center text-gray-500" x-text="idx + 1"></td>
                  <td class="px-3 py-3 font-medium text-blue-700" x-text="e.fixed_asset_id"></td>
                  <td class="px-3 py-3 text-right font-medium tabular-nums text-red-700" x-text="fmtVND(e.depreciation_amount)"></td>
                  <td class="px-3 py-3 text-right tabular-nums text-orange-700" x-text="fmtVND(e.accumulated_after)"></td>
                  <td class="px-3 py-3 text-right font-medium tabular-nums text-green-700" x-text="fmtVND(e.carrying_amount_after)"></td>
                  <td class="px-3 py-3 text-center">
                    <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="e.gl_posted ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'"
                      x-text="e.gl_posted ? 'Đã ghi' : 'Chưa ghi'"></span>
                  </td>
                  <td class="px-3 py-3 text-gray-600" x-text="fmtDate(e.created_at)"></td>
                  <td class="px-3 py-3 text-gray-600" x-text="e.created_by || '-'"></td>
                </tr>
              </template>
              <tr x-show="!entries.length && !loading">
                <td colspan="8" class="px-5 py-8 text-center text-gray-400">Nhập mã kỳ để xem lịch khấu hao</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  return {
    entries: [],
    loading: false,
    periodId: ym,
    assetId: '',

    get totalDepr() { return this.entries.reduce((s, e) => s + (e.depreciation_amount || 0), 0); },
    get totalAccumAfter() { return this.entries.reduce((s, e) => s + (e.accumulated_after || 0), 0); },
    get postedCount() { return this.entries.filter(e => e.gl_posted).length; },

    async init() {
      mountAppShell("Lịch khấu hao", "/app/depreciation-schedule.html");
    },

    async loadReport() {
      if (!this.periodId) {
        $store.app.flashError("Vui lòng nhập mã kỳ (VD: 2026-07)");
        return;
      }
      this.loading = true;
      this.entries = [];
      try {
        let data;
        if (this.assetId) {
          data = await apiGet(`/fixed-assets/assets/${this.assetId}/depreciation`);
          this.entries = Array.isArray(data) ? data : (data.items || []);
        } else {
          data = await apiGet(`/fixed-assets/depreciation/period/${this.periodId}`);
          this.entries = Array.isArray(data) ? data : (data.items || []);
        }
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được lịch khấu hao");
      }
      this.loading = false;
    },
  };
}
</script>

</body>
</html>
