<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ quỹ tiền mặt · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="comp()" x-init="init()">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-gray-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform"></aside>

  <div class="lg:ml-60">
    <header id="topbar" class="sticky top-0 z-20"></header>

    <main class="p-6">
      <template x-if="$store.app.success">
        <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.app.success"></div>
      </template>
      <template x-if="$store.app.error">
        <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.app.error"></div>
      </template>

      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">Sổ quỹ tiền mặt</h2>
        <button @click="window.print()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          In báo cáo
        </button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Tài khoản quỹ</label>
            <input x-model="accountId" type="text" placeholder="VD: 1111" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-36">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Từ ngày</label>
            <input x-model="fromDate" type="date" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Đến ngày</label>
            <input x-model="toDate" type="date" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">Loại tiền</label>
            <select x-model="currency" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="VND">VND</option>
              <option value="USD">USD</option>
            </select>
          </div>
          <button @click="loadReport()" :disabled="loading" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 transition disabled:opacity-50">
            <span x-show="!loading">Xem sổ quỹ</span>
            <span x-show="loading">Đang tải...</span>
          </button>
        </div>
      </div>

      <!-- Summary cards -->
      <div x-show="data" class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Số dư đầu kỳ</div>
          <div class="text-lg font-bold text-gray-900 tabular-nums" x-text="fmtVND(data?.opening_balance || 0)"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Tổng thu</div>
          <div class="text-lg font-bold text-green-700 tabular-nums" x-text="fmtVND(data?.total_receipts || 0)"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Tổng chi</div>
          <div class="text-lg font-bold text-red-700 tabular-nums" x-text="fmtVND(data?.total_payments || 0)"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="text-xs text-gray-500 mb-1">Số dư cuối kỳ</div>
          <div class="text-lg font-bold text-blue-700 tabular-nums" x-text="fmtVND(data?.closing_balance || 0)"></div>
        </div>
      </div>

      <!-- Report table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-700">Chi tiết sổ quỹ — TK <span x-text="accountId || '...'"></span></h3>
          <span class="text-xs text-gray-400" x-text="entries.length + ' chứng từ'"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="text-center px-3 py-2.5 font-semibold text-gray-600 w-10">STT</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Ngày CT</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Loại CT</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Số CT</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">Diễn giải</th>
                <th class="text-left px-3 py-2.5 font-semibold text-gray-600">TK đối ứng</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Thu (đồng)</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Chi (đồng)</th>
                <th class="text-right px-3 py-2.5 font-semibold text-gray-600">Số dư (đồng)</th>
              </tr>
            </thead>
            <tbody>
              <!-- Opening balance row -->
              <tr x-show="data" class="bg-blue-50">
                <td colspan="6" class="px-3 py-3 font-medium text-blue-800">Số dư đầu kỳ</td>
                <td></td>
                <td></td>
                <td class="px-3 py-3 text-right font-bold tabular-nums text-blue-900" x-text="fmtVND(data?.opening_balance || 0)"></td>
              </tr>
              <template x-for="r in entries" :key="r.line_no">
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                  <td class="px-3 py-3 text-center text-gray-500" x-text="r.line_no"></td>
                  <td class="px-3 py-3 text-gray-700" x-text="r.voucher_date"></td>
                  <td class="px-3 py-3 text-gray-700" x-text="r.voucher_type"></td>
                  <td class="px-3 py-3 font-medium text-blue-700" x-text="r.voucher_no"></td>
                  <td class="px-3 py-3 text-gray-700" x-text="r.description"></td>
                  <td class="px-3 py-3 text-gray-600" x-text="r.counterpart_account"></td>
                  <td class="px-3 py-3 text-right tabular-nums" :class="r.receipt_amount > 0 ? 'text-green-700 font-medium' : 'text-gray-400'" x-text="r.receipt_amount > 0 ? fmtVND(r.receipt_amount) : '-'"></td>
                  <td class="px-3 py-3 text-right tabular-nums" :class="r.payment_amount > 0 ? 'text-red-700 font-medium' : 'text-gray-400'" x-text="r.payment_amount > 0 ? fmtVND(r.payment_amount) : '-'"></td>
                  <td class="px-3 py-3 text-right font-medium tabular-nums text-gray-900" x-text="fmtVND(r.running_balance)"></td>
                </tr>
              </template>
              <tr x-show="!entries.length && !loading">
                <td colspan="9" class="px-5 py-8 text-center text-gray-400">Chọn tài khoản quỹ và khoảng ngày để xem sổ quỹ</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
function comp() {
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  return {
    data: null,
    entries: [],
    loading: false,
    accountId: '1111',
    fromDate: firstDay.toISOString().split('T')[0],
    toDate: lastDay.toISOString().split('T')[0],
    currency: 'VND',

    async init() {
      mountAppShell("Sổ quỹ tiền mặt", "/app/cash-book.html");
    },

    async loadReport() {
      if (!this.accountId || !this.fromDate || !this.toDate) {
        $store.app.flashError("Vui lòng nhập đầy đủ thông tin");
        return;
      }
      this.loading = true;
      this.data = null;
      this.entries = [];
      try {
        const params = new URLSearchParams({
          company_id: $store.app.companyId(),
          currency: this.currency,
          account_id: this.accountId,
          from_date: this.fromDate,
          to_date: this.toDate,
        });
        const data = await apiGet(`/cash/reports/cash-book?${params}`);
        this.data = data;
        this.entries = data.entries || [];
      } catch (e) {
        $store.app.flashError(e.error || "Không tải được sổ quỹ");
      }
      this.loading = false;
    },
  };
}
</script>

</body>
</html>
