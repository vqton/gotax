<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="auth-page">

<div class="auth-card" aria-labelledby="page-title">

  <div class="auth-logo">
    <span class="logo-mark">📊</span>
    <span class="logo-name">GoTax</span>
  </div>
  <div class="auth-header">
    <h1 id="page-title" class="auth-title">Đăng nhập hệ thống</h1>
    <p class="auth-subtitle">Hệ thống Quản lý Thuế Kế toán · Circular 99/2025</p>
  </div>

  <div id="login-error" class="alert alert-error hidden" role="alert"></div>

  <form id="login-form" novalidate>

    <div class="form-group">
      <label for="username" class="form-label">Tên đăng nhập</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-input"
        placeholder="ten.dang.nhap"
        autocomplete="username"
        aria-required="true"
        aria-describedby="username-hint"
      >
      <p id="username-hint" class="form-hint">Tên đăng nhập do quản trị cấp.</p>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Mật khẩu</label>
      <div class="password-wrapper">
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="••••••••"
          autocomplete="current-password"
          aria-required="true"
        >
        <button
          type="button"
          onclick="GoTax.togglePw('password')"
          class="password-toggle"
          aria-label="Hiện / ẩn"
        ><span id="pw-eye">👁</span></button>
      </div>
    </div>

    <div class="form-group">
      <label class="check-box">
        <input type="checkbox" id="has-tenant" onchange="document.getElementById('mst-wrap').classList.toggle('hidden', !this.checked)">
        <span>Kèm mã MST / tenant</span>
      </label>
    </div>

    <div class="form-group hidden" id="mst-wrap">
      <label for="mst" class="form-label">Mã MST</label>
      <input
        type="text"
        id="mst"
        name="mst"
        class="form-input"
        placeholder="0123456789"
        inputmode="numeric"
        pattern="[0-9]{10,14}"
        autocomplete="off"
      >
      <p class="form-hint">10–14 chữ số.</p>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%">
      <span id="submit-label">ĐĂNG NHẬP</span>
    </button>
  </form>

  <div class="auth-divider" aria-hidden="true">hoặc</div>

  <button
    type="button"
    onclick="document.getElementById('vneid').click()"
    class="btn btn-ghost btn-lg"
    style="width:100%"
  >🪪 Đăng nhập qua VNeID</button>
  <a id="vneid" href="/vneid/login" hidden></a>

  <div class="auth-footer">
    <a href="/forgot-password" class="auth-link">Quên mật khẩu?</a>
    <span class="auth-foot-note">© 2026 GoTax</span>
  </div>

</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
