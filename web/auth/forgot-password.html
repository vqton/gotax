<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="/assets/js/auth.js"></script>
</head>
<body class="auth-page">

<div class="auth-card" x-data="forgotStore()" aria-labelledby="page-title">

  <div class="auth-header">
    <div class="auth-logo">
      <span class="logo-icon">📊</span>
      <span class="logo-text">GoTax</span>
    </div>
    <h1 id="page-title" class="auth-title">Quên mật khẩu</h1>
    <p class="auth-subtitle">Nhập email để nhận link đặt lại mật khẩu</p>
  </div>

  <div id="alert-slot"
    x-data
    x-init="mountAlerts"
    @forgot:success.window="successAlert($event.detail.msg)"
    @forgot:error.window="errorAlert($event.detail.msg)"
  ></div>

  <form @submit.prevent="submit" novalidate>

    <div class="form-group">
      <label for="email" class="form-label">Email đăng ký</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-input"
        placeholder="ke.toan@congty.vn"
        required
        x-model="email"
        autocomplete="email"
        aria-required="true"
        aria-describedby="email-hint"
      >
      <p id="email-hint" class="form-hint">Chúng tôi gửi link đặt lại đến email này (nếu tồn tại).</p>
      <template x-if="fieldError">
        <p class="form-hint" style="color: var(--clr-error);" x-text="fieldError"></p>
      </template>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="btn btn-primary btn-full"
      :disabled="isSubmitting"
    >
<template x-if="isSubmitting">
  <span class="btn-spinner" aria-hidden="true"></span>
</template>
<span x-text="isSubmitting ? 'Đang gửi…' : 'GỬI LINK ĐẶT LẠI'"></span>
</button>
  </form>

  <template x-if="serverMsg">
    <div class="alert" :class="'alert--' + serverType" x-text="serverMsg" x-transition></div>
  </template>

  <div class="auth-footer">
    <a href="/login" class="link-underline">← Quay lại đăng nhập</a>
  </div>

</div>

<script>
function forgotStore() {
  const auth = Alpine.store("auth");

  return {
    email: "",
    fieldError: "",
    isSubmitting: false,
    serverMsg: "",
    serverType: "info",

    submit() {
      this.fieldError = "";
      if (!this.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email)) {
        this.fieldError = "Email không hợp lệ.";
        return;
      }
      this.isSubmitting = true;
      fetch("/api/v1/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: this.email }),
      })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        this.isSubmitting = false;
        if (!r.ok) {
          this.serverMsg = data.error || "Gửi thất bại.";
          this.serverType = "error";
          dispatchEvent(new CustomEvent("forgot:error", { detail: { msg: this.serverMsg }, bubbles: true }));
          return;
        }
        this.serverMsg = data.message || "Đã gửi link đặt lại mật khẩu (nếu email tồn tại).";
        this.serverType = "success";
        dispatchEvent(new CustomEvent("forgot:success", { detail: { msg: this.serverMsg }, bubbles: true }));
      })
      .catch(() => {
        this.isSubmitting = false;
        this.serverMsg = "Lỗi kết nối. Thử lại sau.";
        this.serverType = "error";
        dispatchEvent(new CustomEvent("forgot:error", { detail: { msg: this.serverMsg }, bubbles: true }));
      });
    },
  };
}
</script>

</body>
</html>
