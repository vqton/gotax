<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="auth-page">

<div class="auth-card" aria-labelledby="page-title">

  <div class="auth-logo">
    <span class="logo-mark">📊</span>
    <span class="logo-name">GoTax</span>
  </div>
  <div class="auth-header">
    <h1 id="page-title" class="auth-title">Quên mật khẩu</h1>
    <p class="auth-subtitle">Nhập email để nhận link đặt lại mật khẩu</p>
  </div>

  <div id="form-msg" class="alert hidden" role="status"></div>

  <form id="forgot-form" novalidate>

    <div class="form-group">
      <label for="email" class="form-label">Email đăng ký</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-input"
        placeholder="ke.toan@congty.vn"
        autocomplete="email"
        aria-required="true"
        aria-describedby="email-hint"
      >
      <p id="email-hint" class="form-hint">Chúng tôi gửi link đặt lại đến email này (nếu tồn tại).</p>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%">
      <span id="submit-label">GỬI LINK ĐẶT LẠI</span>
    </button>
  </form>

  <div class="auth-footer">
    <a href="/login" class="auth-link">← Quay lại đăng nhập</a>
  </div>

</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
