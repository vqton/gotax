<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script defer src="/assets/js/auth.js"></script>
</head>
<body class="auth-page">

<div class="w-full max-w-[420px] bg-white rounded-xl shadow-[0_1px_3px_rgba(0,0,0,.1),0_8px_24px_rgba(0,0,0,.06)] p-8 pb-7 border border-gray-200"
     x-data="forgotStore()" aria-labelledby="page-title">

  <div class="text-center mb-6">
    <div class="inline-flex items-center gap-2 mb-3">
      <span class="text-2xl">📊</span>
      <span class="text-xl font-bold text-brand tracking-tight">GoTax</span>
    </div>
    <h1 id="page-title" class="text-xl font-semibold text-gray-900 mb-1">Quên mật khẩu</h1>
    <p class="text-sm text-gray-500">Nhập email để nhận link đặt lại mật khẩu</p>
  </div>

  <div id="alert-slot"
    x-data
    x-init="mountAlerts"
    @forgot:success.window="successAlert($event.detail.msg)"
    @forgot:error.window="errorAlert($event.detail.msg)"
  ></div>

  <form @submit.prevent="submit" novalidate>

    <div class="mb-4">
      <label for="email" class="block text-sm font-semibold text-gray-900 mb-1.5">Email đăng ký</label>
      <input
        type="email"
        id="email"
        name="email"
        class="w-full px-3 py-2.5 border-[1.5px] border-gray-300 rounded-md bg-gray-50 text-[0.95rem] text-gray-900 appearance-none transition-colors duration-150 focus:outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-blue-200/40"
        placeholder="ke.toan@congty.vn"
        required
        x-model="email"
        autocomplete="email"
        aria-required="true"
        aria-describedby="email-hint"
      >
      <p id="email-hint" class="text-xs text-gray-500 mt-1">Chúng tôi gửi link đặt lại đến email này (nếu tồn tại).</p>
      <template x-if="fieldError">
        <p class="text-xs text-error mt-1" x-text="fieldError"></p>
      </template>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="w-full h-10 inline-flex items-center justify-center gap-2 bg-accent text-white font-semibold text-[0.925rem] leading-none rounded-md cursor-pointer transition-all duration-150 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed select-none whitespace-nowrap"
      :disabled="isSubmitting"
    >
      <template x-if="isSubmitting">
        <span class="btn-spinner" aria-hidden="true"></span>
      </template>
      <span x-text="isSubmitting ? 'Đang gửi…' : 'GỬI LINK ĐẶT LẠI'"></span>
    </button>
  </form>

  <template x-if="serverMsg">
    <div class="rounded-md px-3.5 py-3 text-sm font-medium mt-4 transition-all"
         :class="{
           'bg-red-50 text-red-900 border border-red-200': serverType === 'error',
           'bg-green-50 text-green-900 border border-green-200': serverType === 'success',
           'bg-blue-50 text-blue-900 border border-blue-200': serverType === 'info',
         }"
         x-text="serverMsg" x-transition></div>
  </template>

  <div class="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center text-sm">
    <a href="/login" class="text-accent hover:underline">← Quay lại đăng nhập</a>
  </div>

</div>

<script>
function forgotStore() {
  const auth = Alpine.store("auth");

  return {
    email: "",
    fieldError: "",
    isSubmitting: false,
    serverMsg: "",
    serverType: "info",

    submit() {
      this.fieldError = "";
      if (!this.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email)) {
        this.fieldError = "Email không hợp lệ.";
        return;
      }
      this.isSubmitting = true;
      fetch("/api/v1/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: this.email }),
      })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        this.isSubmitting = false;
        if (!r.ok) {
          this.serverMsg = data.error || "Gửi thất bại.";
          this.serverType = "error";
          dispatchEvent(new CustomEvent("forgot:error", { detail: { msg: this.serverMsg }, bubbles: true }));
          return;
        }
        this.serverMsg = data.message || "Đã gửi link đặt lại mật khẩu (nếu email tồn tại).";
        this.serverType = "success";
        dispatchEvent(new CustomEvent("forgot:success", { detail: { msg: this.serverMsg }, bubbles: true }));
      })
      .catch(() => {
        this.isSubmitting = false;
        this.serverMsg = "Lỗi kết nối. Thử lại sau.";
        this.serverType = "error";
        dispatchEvent(new CustomEvent("forgot:error", { detail: { msg: this.serverMsg }, bubbles: true }));
      });
    },
  };
}
</script>

</body>
</html>
