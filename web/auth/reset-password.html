<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu · GoTax</title>
</head>
<body class="auth-page">

<div class="w-full max-w-[420px] bg-white rounded-xl shadow-[0_1px_3px_rgba(0,0,0,.1),0_8px_24px_rgba(0,0,0,.06)] p-8 pb-7 border border-gray-200" aria-labelledby="page-title">

  <div class="text-center mb-6">
    <div class="inline-flex items-center gap-2 mb-3">
      <span class="text-2xl">📊</span>
      <span class="text-xl font-bold text-brand tracking-tight">GoTax</span>
    </div>
    <h1 id="page-title" class="text-xl font-semibold text-gray-900 mb-1">Đặt lại mật khẩu</h1>
    <p class="text-sm text-gray-500">Nhập mật khẩu mới. Tối thiểu 8 ký tự.</p>
  </div>

  <div id="login-error" class="hidden mb-4 rounded-md bg-red-50 border border-red-200 px-3 py-2.5 text-sm text-red-800" role="alert"></div>

  <form id="reset-form" novalidate>

    <div class="mb-4">
      <label for="password" class="block text-sm font-semibold text-gray-900 mb-1.5">Mật khẩu mới</label>
      <div class="relative">
        <input
          type="password"
          id="password"
          name="new_password"
          class="w-full pr-10 px-3 py-2.5 border-[1.5px] border-gray-300 rounded-md bg-gray-50 text-[0.95rem] text-gray-900 appearance-none transition-colors duration-150 focus:outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-blue-200/40"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          onclick="GoTax.togglePw('password')"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-base leading-none p-1 rounded text-gray-500 hover:text-gray-900 hover:bg-gray-50"
          aria-label="Hiện / ẩn mật khẩu"
        >👁</button>
      </div>
      <p class="text-xs text-gray-500 mt-1">Tối thiểu 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
    </div>

    <div class="mb-4">
      <label for="password2" class="block text-sm font-semibold text-gray-900 mb-1.5">Nhập lại mật khẩu mới</label>
      <div class="relative">
        <input
          type="password"
          id="password2"
          class="w-full pr-10 px-3 py-2.5 border-[1.5px] border-gray-300 rounded-md bg-gray-50 text-[0.95rem] text-gray-900 appearance-none transition-colors duration-150 focus:outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-blue-200/40"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          onclick="GoTax.togglePw('password2')"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-base leading-none p-1 rounded text-gray-500 hover:text-gray-900 hover:bg-gray-50"
          aria-label="Hiện / ẩn mật khẩu"
        >👁</button>
      </div>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="w-full h-10 inline-flex items-center justify-center gap-2 bg-accent text-white font-semibold text-[0.925rem] leading-none rounded-md cursor-pointer transition-all duration-150 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed select-none whitespace-nowrap"
    >
      <span id="submit-label">ĐẶT LẠI MẬT KHẨU</span>
    </button>
  </form>

  <div class="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center text-sm">
    <a href="/login" class="text-accent hover:underline">← Quay lại đăng nhập</a>
  </div>

</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
