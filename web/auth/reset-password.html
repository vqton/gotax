<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="auth-page">

<div class="auth-card" aria-labelledby="page-title">

  <div class="auth-logo">
    <span class="logo-mark">📊</span>
    <span class="logo-name">GoTax</span>
  </div>
  <div class="auth-header">
    <h1 id="page-title" class="auth-title">Đặt lại mật khẩu</h1>
    <p class="auth-subtitle">Nhập mật khẩu mới. Tối thiểu 8 ký tự.</p>
  </div>

  <div id="login-error" class="alert alert-error hidden" role="alert"></div>

  <form id="reset-form" novalidate>

    <div class="form-group">
      <label for="password" class="form-label">Mật khẩu mới</label>
      <div class="password-wrapper">
        <input
          type="password"
          id="password"
          name="new_password"
          class="form-input"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          onclick="GoTax.togglePw('password')"
          class="password-toggle"
          aria-label="Hiện / ẩn mật khẩu"
        >👁</button>
      </div>
      <p class="form-hint">Tối thiểu 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
    </div>

    <div class="form-group">
      <label for="password2" class="form-label">Nhập lại mật khẩu mới</label>
      <div class="password-wrapper">
        <input
          type="password"
          id="password2"
          class="form-input"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          onclick="GoTax.togglePw('password2')"
          class="password-toggle"
          aria-label="Hiện / ẩn mật khẩu"
        >👁</button>
      </div>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%">
      <span id="submit-label">ĐẶT LẠI MẬT KHẨU</span>
    </button>
  </form>

  <div class="auth-footer">
    <a href="/login" class="auth-link">← Quay lại đăng nhập</a>
  </div>

</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
