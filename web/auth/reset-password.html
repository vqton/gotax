<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="/assets/js/alpine.min.js"></script>
  <script defer src="/assets/js/auth.js"></script>
</head>
<body class="auth-page">

<div class="w-full max-w-[420px] bg-white rounded-xl shadow-[0_1px_3px_rgba(0,0,0,.1),0_8px_24px_rgba(0,0,0,.06)] p-8 pb-7 border border-gray-200"
     x-data="resetStore()" aria-labelledby="page-title">

  <div class="text-center mb-6">
    <div class="inline-flex items-center gap-2 mb-3">
      <span class="text-2xl">📊</span>
      <span class="text-xl font-bold text-brand tracking-tight">GoTax</span>
    </div>
    <h1 id="page-title" class="text-xl font-semibold text-gray-900 mb-1">Đặt lại mật khẩu</h1>
    <p class="text-sm text-gray-500">Nhập mật khẩu mới. Tối thiểu 8 ký tự.</p>
  </div>

  <div id="alert-slot"
    x-data
    x-init="mountAlerts"
    @reset:success.window="successAlert($event.detail.msg)"
    @reset:error.window="errorAlert($event.detail.msg)"
  ></div>

  <form @submit.prevent="submit" novalidate>

    <input type="hidden" name="token" :value="urlToken">

    <div class="mb-4">
      <label for="new-password" class="block text-sm font-semibold text-gray-900 mb-1.5">Mật khẩu mới</label>
      <div class="relative">
        <input
          :type="showPw ? 'text' : 'password'"
          id="new-password"
          name="new_password"
          class="w-full pr-10 px-3 py-2.5 border-[1.5px] rounded-md bg-gray-50 text-[0.95rem] text-gray-900 appearance-none transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-200/40"
          :class="pwError ? 'border-error focus:border-error focus:ring-red-100' : 'border-gray-300 focus:border-accent'"
          placeholder="••••••••"
          required
          minlength="8"
          x-model="password"
          autocomplete="new-password"
          aria-required="true"
          aria-invalid="pwError ? 'true' : 'false'"
        >
        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-base leading-none p-1 rounded text-gray-500 hover:text-gray-900 hover:bg-gray-50"
          @click="showPw = !showPw"
          :aria-pressed="showPw"
          aria-label="Hiện / ẩn mật khẩu"
        ><span x-text="showPw ? '🙈' : '👁'"></span></button>
      </div>
      <template x-if="pwError">
        <p class="text-xs text-error mt-1" x-text="pwError"></p>
      </template>
      <p class="text-xs text-gray-500 mt-1">Tối thiểu 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
    </div>

    <div class="mb-4">
      <label for="confirm-password" class="block text-sm font-semibold text-gray-900 mb-1.5">Nhập lại mật khẩu mới</label>
      <div class="relative">
        <input
          :type="showConfirm ? 'text' : 'password'"
          id="confirm-password"
          class="w-full pr-10 px-3 py-2.5 border-[1.5px] rounded-md bg-gray-50 text-[0.95rem] text-gray-900 appearance-none transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-200/40"
          :class="confirmError ? 'border-error focus:border-error focus:ring-red-100' : 'border-gray-300 focus:border-accent'"
          placeholder="••••••••"
          required
          minlength="8"
          x-model="confirm"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-base leading-none p-1 rounded text-gray-500 hover:text-gray-900 hover:bg-gray-50"
          @click="showConfirm = !showConfirm"
          :aria-pressed="showConfirm"
          aria-label="Hiện / ẩn mật khẩu"
        ><span x-text="showConfirm ? '🙈' : '👁'"></span></button>
      </div>
      <template x-if="confirmError">
        <p class="text-xs text-error mt-1" x-text="confirmError"></p>
      </template>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="w-full h-10 inline-flex items-center justify-center gap-2 bg-accent text-white font-semibold text-[0.925rem] leading-none rounded-md cursor-pointer transition-all duration-150 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed select-none whitespace-nowrap"
      :disabled="isSubmitting"
    >
      <template x-if="isSubmitting">
        <span class="btn-spinner" aria-hidden="true"></span>
      </template>
      <span x-text="isSubmitting ? 'Đang xử lý…' : 'ĐẶT LẠI MẬT KHẨU'"></span>
    </button>
  </form>

  <template x-if="serverMsg">
    <div class="rounded-md px-3.5 py-3 text-sm font-medium mt-4 transition-all"
         :class="{
           'bg-red-50 text-red-900 border border-red-200': serverType === 'error',
           'bg-green-50 text-green-900 border border-green-200': serverType === 'success',
           'bg-blue-50 text-blue-900 border border-blue-200': serverType === 'info',
         }"
         x-text="serverMsg" x-transition></div>
  </template>

  <div class="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center text-sm">
    <a href="/login" class="text-accent hover:underline">← Quay lại đăng nhập</a>
  </div>

</div>

<script>
function resetStore() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token") || "";

  return {
    urlToken: token,
    password: "",
    confirm: "",
    showPw: false,
    showConfirm: false,
    isSubmitting: false,
    pwError: "",
    confirmError: "",
    serverMsg: "",
    serverType: "info",

    submit() {
      this.pwError = "";
      this.confirmError = "";
      let ok = true;

      if (!this.password || this.password.length < 8) {
        this.pwError = "Mật khẩu phải có ít nhất 8 ký tự.";
        ok = false;
      }

      if (this.password !== this.confirm) {
        this.confirmError = "Hai mật khẩu không trùng nhau.";
        ok = false;
      }

      if (!ok) return;

      if (!this.urlToken) {
        this.showServer("Link đặt lại không hợp lệ hoặc hết hạn.", "error");
        return;
      }

      this.isSubmitting = true;
      fetch("/api/v1/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: this.urlToken, new_password: this.password }),
      })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        this.isSubmitting = false;
        if (!r.ok) {
          this.showServer(data.error || "Đặt lại mật khẩu thất bại.", "error");
          dispatchEvent(new CustomEvent("reset:error", { detail: { msg: data.error }, bubbles: true }));
          return;
        }
        this.showServer(data.message || "Đặt lại mật khẩu thành công. Đang chuyển đến trang đăng nhập…", "success");
        dispatchEvent(new CustomEvent("reset:success", { detail: { msg: data.message }, bubbles: true }));
        setTimeout(() => window.location.href = "/login", 1500);
      })
      .catch(() => {
        this.isSubmitting = false;
        this.showServer("Lỗi kết nối. Thử lại sau.", "error");
        dispatchEvent(new CustomEvent("reset:error", { detail: { msg: "Lỗi kết nối" }, bubbles: true }));
      });
    },

    showServer(text, type) {
      this.serverMsg = text;
      this.serverType = type;
    },
  };
}
</script>

</body>
</html>
