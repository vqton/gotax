<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu · GoTax</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="/assets/js/auth.js"></script>
</head>
<body class="auth-page">

<div class="auth-card" x-data="resetStore()" aria-labelledby="page-title">

  <div class="auth-header">
    <div class="auth-logo">
      <span class="logo-icon">📊</span>
      <span class="logo-text">GoTax</span>
    </div>
    <h1 id="page-title" class="auth-title">Đặt lại mật khẩu</h1>
    <p class="auth-subtitle">Nhập mật khẩu mới. Tối thiểu 8 ký tự.</p>
  </div>

  <div id="alert-slot"
    x-data
    x-init="mountAlerts"
    @reset:success.window="successAlert($event.detail.msg)"
    @reset:error.window="errorAlert($event.detail.msg)"
  ></div>

  <form @submit.prevent="submit" novalidate>

    <input type="hidden" name="token" :value="urlToken">

    <div class="form-group">
      <label for="new-password" class="form-label">Mật khẩu mới</label>
      <div class="password-wrapper">
        <input
          :type="showPw ? 'text' : 'password'"
          id="new-password"
          name="new_password"
          class="form-input"
          :class="{ 'is-invalid': pwError }"
          placeholder="••••••••"
          required
          minlength="8"
          x-model="password"
          autocomplete="new-password"
          aria-required="true"
          aria-invalid="pwError ? 'true' : 'false'"
        >
        <button
          type="button"
          class="password-toggle"
          @click="showPw = !showPw"
          :aria-pressed="showPw"
          aria-label="Hiện / ẩn mật khẩu"
        ><span x-text="showPw ? '🙈' : '👁'"></span></button>
      </div>
      <template x-if="pwError">
        <p class="form-hint" style="color: var(--clr-error);" x-text="pwError"></p>
      </template>
      <p class="form-hint">Tối thiểu 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
    </div>

    <div class="form-group">
      <label for="confirm-password" class="form-label">Nhập lại mật khẩu mới</label>
      <div class="password-wrapper">
        <input
          :type="showConfirm ? 'text' : 'password'"
          id="confirm-password"
          class="form-input"
          :class="{ 'is-invalid': confirmError }"
          placeholder="••••••••"
          required
          minlength="8"
          x-model="confirm"
          autocomplete="new-password"
          aria-required="true"
        >
        <button
          type="button"
          class="password-toggle"
          @click="showConfirm = !showConfirm"
          :aria-pressed="showConfirm"
          aria-label="Hiện / ẩn mật khẩu"
        ><span x-text="showConfirm ? '🙈' : '👁'"></span></button>
      </div>
      <template x-if="confirmError">
        <p class="form-hint" style="color: var(--clr-error);" x-text="confirmError"></p>
      </template>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="btn btn-primary btn-full"
      :disabled="isSubmitting"
    >
<template x-if="isSubmitting">
  <span class="btn-spinner" aria-hidden="true"></span>
</template>
<span x-text="isSubmitting ? 'Đang xử lý…' : 'ĐẶT LẠI MẬT KHẨU'"></span>
</button>
  </form>

  <template x-if="serverMsg">
    <div class="alert" :class="'alert--' + serverType" x-text="serverMsg" x-transition></div>
  </template>

  <div class="auth-footer">
    <a href="/login" class="link-underline">← Quay lại đăng nhập</a>
  </div>

</div>

<script>
function resetStore() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token") || "";

  return {
    urlToken: token,
    password: "",
    confirm: "",
    showPw: false,
    showConfirm: false,
    isSubmitting: false,
    pwError: "",
    confirmError: "",
    serverMsg: "",
    serverType: "info",

    submit() {
      this.pwError = "";
      this.confirmError = "";
      let ok = true;

      if (!this.password || this.password.length < 8) {
        this.pwError = "Mật khẩu phải có ít nhất 8 ký tự.";
        ok = false;
      }

      if (this.password !== this.confirm) {
        this.confirmError = "Hai mật khẩu không trùng nhau.";
        ok = false;
      }

      if (!ok) return;

      if (!this.urlToken) {
        this.showServer("Link đặt lại không hợp lệ hoặc hết hạn.", "error");
        return;
      }

      this.isSubmitting = true;
      fetch("/api/v1/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: this.urlToken, new_password: this.password }),
      })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        this.isSubmitting = false;
        if (!r.ok) {
          this.showServer(data.error || "Đặt lại mật khẩu thất bại.", "error");
          dispatchEvent(new CustomEvent("reset:error", { detail: { msg: data.error }, bubbles: true }));
          return;
        }
        this.showServer(data.message || "Đặt lại mật khẩu thành công. Đang chuyển đến trang đăng nhập…", "success");
        dispatchEvent(new CustomEvent("reset:success", { detail: { msg: data.message }, bubbles: true }));
        setTimeout(() => window.location.href = "/login", 1500);
      })
      .catch(() => {
        this.isSubmitting = false;
        this.showServer("Lỗi kết nối. Thử lại sau.", "error");
        dispatchEvent(new CustomEvent("reset:error", { detail: { msg: "Lỗi kết nối" }, bubbles: true }));
      });
    },

    showServer(text, type) {
      this.serverMsg = text;
      this.serverType = type;
    },
  };
}
</script>

</body>
</html>
