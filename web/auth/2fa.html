<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực 2FA · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="auth-page">

<div class="auth-card auth-wide" aria-labelledby="page-title">

  <div class="auth-logo">
    <span class="logo-mark">📊</span>
    <span class="logo-name">GoTax</span>
  </div>
  <div class="auth-header">
    <h1 id="page-title" class="auth-title">Xác thực hai yếu tố</h1>
    <p class="auth-subtitle">Nhập mã 6 số từ ứng dụng Google Authenticator</p>
  </div>

  <div id="login-error" class="alert alert-error hidden" role="alert"></div>

  <form id="2fa-form" novalidate>

    <div class="form-group">
      <label class="form-label">Mã xác thực</label>
      <div class="code-group">
        <input type="text" id="code0" data-i="0" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Chữ số 1" class="code-input">
        <input type="text" id="code1" data-i="1" maxlength="1" inputmode="numeric" aria-label="Chữ số 2" class="code-input">
        <input type="text" id="code2" data-i="2" maxlength="1" inputmode="numeric" aria-label="Chữ số 3" class="code-input">
        <input type="text" id="code3" data-i="3" maxlength="1" inputmode="numeric" aria-label="Chữ số 4" class="code-input">
        <input type="text" id="code4" data-i="4" maxlength="1" inputmode="numeric" aria-label="Chữ số 5" class="code-input">
        <input type="text" id="code5" data-i="5" maxlength="1" inputmode="numeric" aria-label="Chữ số 6" class="code-input">
      </div>
      <p class="form-hint">Mã đổi mỗi 30 giây · Mở Google Authenticator để xem.</p>
    </div>

    <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%">
      <span id="submit-label">XÁC THỰC</span>
    </button>

  </form>

  <div class="auth-footer">
    <a href="/login" class="auth-link">← Quay lại đăng nhập</a>
    <button type="button" id="resend-btn" class="auth-link-btn">Gửi lại mã SMS?</button>
  </div>

</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(function () {
  var inputs = Array.prototype.slice.call(document.querySelectorAll(".code-input"));
  var errEl = document.getElementById("login-error");
  var btn = document.getElementById("submit-btn");
  var label = document.getElementById("submit-label");

  function code() { return inputs.map(function (i) { return i.value; }).join(""); }
  function showErr(msg) { if (errEl) { errEl.textContent = msg; errEl.classList.remove("hidden"); } else GoTax.Toast.show(msg, "error"); }

  inputs.forEach(function (inp) {
    inp.addEventListener("input", function () {
      inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
      if (inp.value && Number(inp.dataset.i) < 5) inputs[Number(inp.dataset.i) + 1].focus();
      if (errEl) errEl.classList.add("hidden");
    });
    inp.addEventListener("keydown", function (e) {
      var i = Number(inp.dataset.i);
      if (e.key === "Backspace" && !inp.value && i > 0) { inputs[i - 1].value = ""; inputs[i - 1].focus(); e.preventDefault(); }
      if (e.key === "ArrowRight" && i < 5) { inputs[i + 1].focus(); e.preventDefault(); }
      if (e.key === "ArrowLeft" && i > 0) { inputs[i - 1].focus(); e.preventDefault(); }
    });
  });

  document.getElementById("2fa-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (code().length < 6) { showErr("Nhập đủ 6 chữ số."); return; }
    btn.disabled = true;
    label.textContent = "Đang xác thực…";
    fetch("/api/v1/auth/totp/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        temp_token: localStorage.getItem("gotax_temp_token") || "",
        code: code(),
      }),
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (d.access_token) {
          GoTax.Auth.saveLogin(d);
          window.location.href = "/app/dashboard.html";
        } else {
          btn.disabled = false;
          label.textContent = "XÁC THỰC";
          showErr(d.error || "Mã không hợp lệ.");
        }
      })
      .catch(function () {
        btn.disabled = false;
        label.textContent = "XÁC THỰC";
        showErr("Lỗi kết nối.");
      });
  });

  document.getElementById("resend-btn").addEventListener("click", function () {
    GoTax.Toast.show("Mã đã gửi lại (giả lập).", "info");
  });
})();
</script>
</body>
</html>
