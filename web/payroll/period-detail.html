<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết kỳ lương · Payroll · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/payroll.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav id="pw-nav" class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between"></nav>

<main class="max-w-7xl mx-auto px-6 py-8" x-data="periodDetail()" x-init="init()">

  <template x-if="$store.pw.success">
    <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.pw.success"></div>
  </template>
  <template x-if="$store.pw.error">
    <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.pw.error"></div>
  </template>

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900" x-text="'Kỳ lương ' + (period.month || '') + '/' + (period.year || '')"></h1>
      <div class="flex items-center gap-3 mt-1">
        <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium" :class="statusClass(period.status)" x-text="period.status"></span>
        <span class="text-sm text-gray-500" x-text="'Tạo: ' + fmtDateTime(period.created_at)"></span>
      </div>
    </div>
    <div class="flex gap-2">
      <button @click="calculate()" :disabled="calculating" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800 disabled:opacity-50">
        <span x-show="!calculating">🧮 Tính lương</span>
        <span x-show="calculating">Đang tính…</span>
      </button>
      <button @click="submit()" x-show="period.status==='DRAFT'||period.status==='PROCESSING'" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700">Gửi duyệt</button>
      <button @click="approve()" x-show="period.status==='SUBMITTED'" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700">Phê duyệt</button>
      <button @click="reject()" x-show="period.status==='SUBMITTED'" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700">Từ chối</button>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="grid grid-cols-5 gap-4 mb-6">
    <div class="bg-white rounded-xl border p-4 text-center">
      <p class="text-xs text-gray-500">Nhân viên</p>
      <p class="text-xl font-bold" x-text="summary.employee_count || 0"></p>
    </div>
    <div class="bg-white rounded-xl border p-4 text-center">
      <p class="text-xs text-gray-500">Tổng gross</p>
      <p class="text-xl font-bold text-blue-700" x-text="fmtVND(summary.total_gross)"></p>
    </div>
    <div class="bg-white rounded-xl border p-4 text-center">
      <p class="text-xs text-gray-500">Tổng khấu trừ</p>
      <p class="text-xl font-bold text-red-600" x-text="fmtVND(summary.total_deductions)"></p>
    </div>
    <div class="bg-white rounded-xl border p-4 text-center">
      <p class="text-xs text-gray-500">Tổng net</p>
      <p class="text-xl font-bold text-green-700" x-text="fmtVND(summary.total_net_pay)"></p>
    </div>
    <div class="bg-white rounded-xl border p-4 text-center">
      <p class="text-xs text-gray-500">Chi phí employer</p>
      <p class="text-xl font-bold text-purple-700" x-text="fmtVND(summary.total_employer_cost)"></p>
    </div>
  </div>

  <!-- Employee payroll grid -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-sm font-semibold text-gray-700">Bảng lương nhân viên</h2>
      <div class="flex gap-2">
        <input type="text" placeholder="Tìm nhân viên…" x-model="search" class="border rounded-lg px-3 py-1.5 text-sm w-48">
        <a :href="'/payroll/payslips.html?period_id=' + periodId" class="px-3 py-1.5 bg-gray-100 rounded-lg text-sm hover:bg-gray-200">Phiếu lương</a>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-3 py-2 font-semibold text-gray-600 sticky left-0 bg-gray-50">Mã NV</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">Lương cơ bản</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">Phụ cấp</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">OT</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">Gross</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">BHXH</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">BHYT</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">BHTN</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">PIT</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600">Tổng KTrừ</th>
            <th class="text-right px-3 py-2 font-semibold text-gray-600 sticky right-0 bg-gray-50">Net</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in filteredRuns" :key="r.id">
            <tr class="border-b border-gray-100 hover:bg-blue-50/50">
              <td class="px-3 py-2 font-medium sticky left-0 bg-white" x-text="r.employee_id"></td>
              <td class="px-3 py-2 text-right" x-text="fmtVND(r.base_salary)"></td>
              <td class="px-3 py-2 text-right" x-text="fmtVND(r.allowances)"></td>
              <td class="px-3 py-2 text-right" x-text="fmtVND(r.ot_pay)"></td>
              <td class="px-3 py-2 text-right font-medium text-blue-700" x-text="fmtVND(r.gross_salary)"></td>
              <td class="px-3 py-2 text-right text-red-600" x-text="fmtVND(r.si_deduction)"></td>
              <td class="px-3 py-2 text-right text-red-600" x-text="fmtVND(r.hi_deduction)"></td>
              <td class="px-3 py-2 text-right text-red-600" x-text="fmtVND(r.ui_deduction)"></td>
              <td class="px-3 py-2 text-right text-red-600" x-text="fmtVND(r.pit_amount)"></td>
              <td class="px-3 py-2 text-right font-medium text-red-600" x-text="fmtVND(r.total_deductions)"></td>
              <td class="px-3 py-2 text-right font-bold text-green-700 sticky right-0 bg-white" x-text="fmtVND(r.net_pay)"></td>
            </tr>
          </template>
          <tr x-show="!filteredRuns.length">
            <td colspan="11" class="px-4 py-8 text-center text-gray-400">Chưa có dữ liệu lương. Nhấn "Tính lương" để bắt đầu.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
function periodDetail() {
  const params = new URLSearchParams(location.search);
  return {
    periodId: params.get("id"),
    period: {},
    runs: [],
    summary: {},
    search: "",
    calculating: false,

    get filteredRuns() {
      const q = this.search.toLowerCase();
      if (!q) return this.runs;
      return this.runs.filter(r => r.employee_id.toLowerCase().includes(q));
    },

    async init() {
      mountNav("pw-nav", "/payroll/periods.html");
      if (!this.periodId) { window.location = "/payroll/periods.html"; return; }
      try {
        [this.period, this.runs, this.summary] = await Promise.all([
          pwGet(`/periods/${this.periodId}`),
          pwGet(`/periods/${this.periodId}/runs`),
          pwGet(`/periods/${this.periodId}/summary`),
        ]);
      } catch (e) { console.error(e); }
    },

    async calculate() {
      this.calculating = true;
      try {
        await pwPost(`/periods/${this.periodId}/calculate`, {});
        $store.pw.flashSuccess("Tính lương thành công");
        await this.init();
      } catch (e) { $store.pw.error = e.error || "Lỗi tính lương"; }
      this.calculating = false;
    },

    async submit() {
      try { await pwPost(`/periods/${this.periodId}/submit`, {}); await this.init(); $store.pw.flashSuccess("Đã gửi duyệt"); } catch (e) { $store.pw.error = e.error || "Lỗi"; }
    },

    async approve() {
      try { await pwPost(`/periods/${this.periodId}/approve`, {}); await this.init(); $store.pw.flashSuccess("Đã phê duyệt"); } catch (e) { $store.pw.error = e.error || "Lỗi"; }
    },

    async reject() {
      try { await pwPost(`/periods/${this.periodId}/reject`, {}); await this.init(); $store.pw.flashSuccess("Đã từ chối"); } catch (e) { $store.pw.error = e.error || "Lỗi"; }
    },
  };
}
</script>

</body>
</html>
