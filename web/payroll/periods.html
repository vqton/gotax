<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỳ lương · Payroll · GoTax</title>
  <script defer src="/assets/js/alpine.min.js"></script>
  <script src="/assets/js/auth-legacy.js"></script>
  <script src="/assets/js/payroll.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav id="pw-nav" class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between"></nav>

<main class="max-w-7xl mx-auto px-6 py-8" x-data="periods()" x-init="init()">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Danh sách kỳ lương</h1>
    <button @click="showCreate = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Tạo kỳ mới</button>
  </div>

  <!-- Create modal -->
  <template x-if="showCreate">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showCreate=false">
      <div class="bg-white rounded-xl shadow-xl p-6 w-96" @click.stop>
        <h2 class="text-lg font-bold mb-4">Tạo kỳ lương mới</h2>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tháng</label>
        <input type="number" min="1" max="12" x-model.number="newMonth" class="w-full border rounded-lg px-3 py-2 mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Năm</label>
        <input type="number" min="2024" x-model.number="newYear" class="w-full border rounded-lg px-3 py-2 mb-4">
        <div class="flex justify-end gap-2">
          <button @click="showCreate=false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">Hủy</button>
          <button @click="createPeriod()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Tạo</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">Kỳ</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">Trạng thái</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">Người lập</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">Ngày lập</th>
          <th class="text-left px-4 py-3 font-semibold text-gray-600">Phê duyệt</th>
          <th class="text-right px-4 py-3 font-semibold text-gray-600">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="p in periods" :key="p.id">
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-3 font-medium" x-text="p.month + '/' + p.year"></td>
            <td class="px-4 py-3"><span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium" :class="statusClass(p.status)" x-text="p.status"></span></td>
            <td class="px-4 py-3 text-gray-500" x-text="p.prepared_by || '—'"></td>
            <td class="px-4 py-3 text-gray-500" x-text="fmtDateTime(p.prepared_at)"></td>
            <td class="px-4 py-3 text-gray-500" x-text="p.approved_by || '—'"></td>
            <td class="px-4 py-3 text-right">
              <a :href="'/payroll/period-detail.html?id=' + p.id" class="text-blue-700 hover:underline text-sm">Chi tiết</a>
            </td>
          </tr>
        </template>
        <tr x-show="!periods.length">
          <td colspan="6" class="px-4 py-8 text-center text-gray-400">Chưa có kỳ lương nào</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script>
function periods() {
  return {
    periods: [],
    showCreate: false,
    newMonth: new Date().getMonth() + 1,
    newYear: new Date().getFullYear(),

    async init() {
      mountNav("pw-nav", "/payroll/periods.html");
      try {
        this.periods = await pwGet("/periods");
      } catch (e) { console.error(e); }
    },

    async createPeriod() {
      try {
        await pwPost("/periods", { year: this.newYear, month: this.newMonth });
        this.showCreate = false;
        this.periods = await pwGet("/periods");
        $store.pw.flashSuccess("Tạo kỳ lương thành công");
      } catch (e) {
        $store.pw.error = e.error || "Không tạo được kỳ";
      }
    },
  };
}
</script>

</body>
</html>
