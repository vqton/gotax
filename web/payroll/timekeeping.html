<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm công · Payroll · GoTax</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/payroll.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav id="pw-nav" class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between"></nav>

<main class="max-w-7xl mx-auto px-6 py-8" x-data="timekeeping()" x-init="init()">

  <template x-if="$store.pw.success">
    <div class="mb-4 rounded-md bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-800" x-text="$store.pw.success"></div>
  </template>
  <template x-if="$store.pw.error">
    <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800" x-text="$store.pw.error"></div>
  </template>

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Chấm công nhân viên</h1>
    <div class="flex gap-2">
      <button @click="showImport = true" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700">📥 Import CSV</button>
      <button @click="showAdd = true" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium hover:bg-blue-800">+ Thêm mới</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border p-4 mb-6 flex gap-4 items-end">
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">Mã NV</label>
      <input type="text" x-model="filterEmp" class="border rounded-lg px-3 py-2 text-sm w-32">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">Từ ngày</label>
      <input type="date" x-model="filterFrom" class="border rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">Đến ngày</label>
      <input type="date" x-model="filterTo" class="border rounded-lg px-3 py-2 text-sm">
    </div>
    <button @click="loadRecords()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium hover:bg-gray-200">Lọc</button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b">
        <tr>
          <th class="text-left px-3 py-2 font-semibold text-gray-600">Ngày</th>
          <th class="text-left px-3 py-2 font-semibold text-gray-600">Mã NV</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600">Giờ vào</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600">Giờ ra</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600">Giờ làm</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600">OT (h)</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600">Đêm (h)</th>
          <th class="text-center px-3 py-2 font-semibold text-gray-600">Phép</th>
          <th class="text-center px-3 py-2 font-semibold text-gray-600">NC</th>
          <th class="text-center px-3 py-2 font-semibold text-gray-600">NL</th>
          <th class="text-right px-3 py-2 font-semibold text-gray-600"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in records" :key="r.id">
          <tr class="border-b hover:bg-blue-50/50">
            <td class="px-3 py-2" x-text="r.date"></td>
            <td class="px-3 py-2 font-medium" x-text="r.employee_id"></td>
            <td class="px-3 py-2 text-right" x-text="r.clock_in || '—'"></td>
            <td class="px-3 py-2 text-right" x-text="r.clock_out || '—'"></td>
            <td class="px-3 py-2 text-right font-medium" x-text="r.hours_worked"></td>
            <td class="px-3 py-2 text-right" :class="r.ot_hours > 0 ? 'text-amber-600' : ''" x-text="r.ot_hours || '—'"></td>
            <td class="px-3 py-2 text-right" :class="r.night_hours > 0 ? 'text-purple-600' : ''" x-text="r.night_hours || '—'"></td>
            <td class="px-3 py-2 text-center"><span x-show="r.leave_type" class="inline-block px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded text-xs" x-text="r.leave_type"></span></td>
            <td class="px-3 py-2 text-center"><span x-show="r.is_rest_day" class="text-blue-600">✓</span></td>
            <td class="px-3 py-2 text-center"><span x-show="r.is_holiday" class="text-red-600">✓</span></td>
            <td class="px-3 py-2 text-right"><button @click="deleteRecord(r.id)" class="text-red-500 text-xs hover:underline">Xóa</button></td>
          </tr>
        </template>
        <tr x-show="!records.length"><td colspan="11" class="px-4 py-8 text-center text-gray-400">Chưa có dữ liệu chấm công</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Add modal -->
  <template x-if="showAdd">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showAdd=false">
      <div class="bg-white rounded-xl shadow-xl p-6 w-[480px]" @click.stop>
        <h2 class="text-lg font-bold mb-4">Thêm bản ghi chấm công</h2>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Mã NV</label><input type="text" x-model="addForm.employee_id" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Ngày</label><input type="date" x-model="addForm.date" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Giờ vào</label><input type="time" x-model="addForm.clock_in" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Giờ ra</label><input type="time" x-model="addForm.clock_out" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Giờ làm thực tế</label><input type="number" step="0.5" x-model.number="addForm.hours_worked" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Giờ OT</label><input type="number" step="0.5" x-model.number="addForm.ot_hours" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Giờ ca đêm</label><input type="number" step="0.5" x-model.number="addForm.night_hours" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-medium text-gray-500 mb-1">Loại phép</label>
            <select x-model="addForm.leave_type" class="w-full border rounded-lg px-3 py-2 text-sm">
              <option value="">Không</option>
              <option value="ANNUAL">Phép năm</option>
              <option value="SICK">Ốm đau</option>
              <option value="MATERNITY">Thai sản</option>
              <option value="UNPAID">Không lương</option>
            </select>
          </div>
        </div>
        <div class="flex items-center gap-6 mt-4">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="addForm.is_rest_day" class="accent-blue-700"> Ngày nghỉ</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="addForm.is_holiday" class="accent-blue-700"> Ngày lễ</label>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button @click="showAdd=false" class="px-4 py-2 text-sm text-gray-600">Hủy</button>
          <button @click="addRecord()" class="px-4 py-2 bg-blue-700 text-white rounded-lg text-sm font-medium">Thêm</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Import CSV modal -->
  <template x-if="showImport">
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="showImport=false">
      <div class="bg-white rounded-xl shadow-xl p-6 w-[520px]" @click.stop>
        <h2 class="text-lg font-bold mb-4">Import chấm công CSV</h2>
        <p class="text-sm text-gray-500 mb-3">Định dạng: <code class="bg-gray-100 px-1 rounded">employee_id,date,hours_worked,ot_hours,night_hours,leave_type</code></p>
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-500 mb-1">Mã công ty (company_id)</label>
          <input type="text" x-model="importCompanyId" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="company-uuid">
        </div>
        <div class="mb-4">
          <input type="file" accept=".csv" @change="csvFile = $event.target.files[0]" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div x-show="importResult" class="mb-4 p-3 rounded-lg text-sm" :class="importResult?.error ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'" x-text="importResult?.message || importResult?.error"></div>
        <div class="flex justify-end gap-2">
          <button @click="showImport=false; importResult=null" class="px-4 py-2 text-sm text-gray-600">Đóng</button>
          <button @click="importCSV()" :disabled="!csvFile" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium disabled:opacity-50">Import</button>
        </div>
      </div>
    </div>
  </template>

</main>

<script>
function timekeeping() {
  return {
    records: [],
    filterEmp: "",
    filterFrom: "",
    filterTo: "",
    showAdd: false,
    showImport: false,
    addForm: { employee_id: "", date: "", clock_in: "", clock_out: "", hours_worked: 8, ot_hours: 0, night_hours: 0, leave_type: "", is_rest_day: false, is_holiday: false },
    csvFile: null,
    importCompanyId: "",
    importResult: null,

    async init() {
      mountNav("pw-nav", "/payroll/timekeeping.html");
      await this.loadRecords();,

    async loadRecords() {
      try {
        let qs = [];
        if (this.filterEmp) qs.push(`employee_id=${this.filterEmp}`);
        if (this.filterFrom) qs.push(`from_date=${this.filterFrom}`);
        if (this.filterTo) qs.push(`to_date=${this.filterTo}`);
        this.records = await pwGet(`/timekeeping${qs.length ? '?' + qs.join('&') : ''}`);
      } catch (e) { console.error(e); }
    },

    async addRecord() {
      try {
        await pwPost("/timekeeping", this.addForm);
        this.showAdd = false;
        this.addForm = { employee_id: "", date: "", clock_in: "", clock_out: "", hours_worked: 8, ot_hours: 0, night_hours: 0, leave_type: "", is_rest_day: false, is_holiday: false };
        await this.loadRecords();
        $store.pw.flashSuccess("Đã thêm bản ghi chấm công");
      } catch (e) { $store.pw.error = e.error || "Lỗi"; }
    },

    async deleteRecord(id) {
      if (!confirm("Xóa bản ghi chấm công?")) return;
      try { await pwDelete(`/timekeeping/${id}`); await this.loadRecords(); } catch (e) { $store.pw.error = e.error || "Lỗi"; }
    },

    async importCSV() {
      if (!this.csvFile || !this.importCompanyId) { $store.pw.error = "Chọn file và nhập company_id"; return; }
      const fd = new FormData();
      fd.append("file", this.csvFile);
      fd.append("company_id", this.importCompanyId);
      try {
        const r = await pwFetch("/timekeeping/import", { method: "POST", body: fd, headers: {} });
        this.importResult = await r.json();
        if (r.ok) { await this.loadRecords(); $store.pw.flashSuccess("Import thành công"); }
      } catch (e) { this.importResult = { error: "Lỗi import" }; }
    },
  };
}
</script>

</body>
</html>
